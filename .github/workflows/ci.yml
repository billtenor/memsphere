name: CI
run-name: ${{ inputs.full_health_bootstrap && 'Initialize PR merge gate' || ((github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.profile == 'full')) && 'CI (full · units only)' || 'CI (default · units only)') }}

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      profile:
        description: Unit-only CI profile (integration tests temporarily paused)
        type: choice
        options: [default, full]
        default: full
      full_health_bootstrap:
        description: Owner only, first-install status publisher (no builds)
        type: boolean
        default: false
      reviewed_sha:
        description: Exact architect-reviewed SHA required for first install
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-${{ github.workflow }}-${{ inputs.full_health_bootstrap && 'bootstrap' || ((github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.profile == 'full')) && 'full' || 'default') }}-${{ (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.profile == 'full')) && github.run_id || (github.event.pull_request.number || github.ref) }}
  cancel-in-progress: ${{ !inputs.full_health_bootstrap && github.event_name != 'push' && !(github.event_name == 'workflow_dispatch' && inputs.profile == 'full') }}

jobs:
  plan:
    if: ${{ !inputs.full_health_bootstrap }}
    name: Select CI profile
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      profile: ${{ steps.plan.outputs.profile }}
    steps:
      - uses: actions/checkout@v7
      - id: plan
        env:
          CI_PROFILE: ${{ inputs.profile || 'default' }}
        run: node scripts/ci/ci-plan.mjs >> "$GITHUB_OUTPUT"

  test:
    needs: plan
    name: Test (${{ matrix.os }}, ${{ matrix.title }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      CI_TEST_RESULTS: ci-results/${{ matrix.os }}-${{ matrix.suite }}.json
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Reuse Node compilation within this job
        shell: bash
        run: echo "NODE_COMPILE_CACHE=$RUNNER_TEMP/memsphere-node-compile-cache" >> "$GITHUB_ENV"
      - run: npm ci
      # Build/typecheck once, then run only explicitly separated unit tests.
      - run: npm run test:ci -- --suite=unit
      - name: Preserve test timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: timings-${{ matrix.os }}-${{ matrix.suite }}
          path: ci-results
          if-no-files-found: error

  full-result:
    name: Cross-platform unit tests
    runs-on: ubuntu-24.04
    needs: [plan, test]
    if: always() && needs.plan.outputs.profile == 'full'
    timeout-minutes: 5
    steps:
      - env:
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          test "$TEST_RESULT" = success

  full-health-bootstrap:
    name: First-install merge gate publisher
    if: github.event_name == 'workflow_dispatch' && inputs.full_health_bootstrap && github.actor == github.repository_owner && inputs.reviewed_sha == github.sha
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
      actions: read
      pull-requests: read
      statuses: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - env:
          GITHUB_TOKEN: ${{ github.token }}
          REVIEWED_SHA: ${{ inputs.reviewed_sha }}
        run: node scripts/ci/full-health.mjs --bootstrap --publish
