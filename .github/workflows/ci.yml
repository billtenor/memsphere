name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      profile:
        description: Default PR checks or complete cross-platform regression
        type: choice
        options: [default, full]
        default: full
  schedule:
    - cron: "30 2 * * *"

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-${{ github.workflow }}-${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.profile == 'full')) && 'full' || 'default' }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !(github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.profile == 'full')) }}

jobs:
  plan:
    name: Select CI profile
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      profile: ${{ steps.plan.outputs.profile }}
    steps:
      - uses: actions/checkout@v7
      - id: plan
        env:
          CI_PROFILE: ${{ inputs.profile || 'default' }}
        run: node scripts/ci-plan.mjs >> "$GITHUB_OUTPUT"

  test:
    needs: plan
    name: Test (${{ matrix.os }}, ${{ matrix.title }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ needs.plan.outputs.profile == 'full' && 10 || 5 }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      CI_TEST_RESULTS: ci-results/${{ matrix.os }}-${{ matrix.suite }}.json
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Reuse Node compilation within this job
        if: runner.os == 'Windows'
        shell: bash
        run: echo "NODE_COMPILE_CACHE=$RUNNER_TEMP/memsphere-node-compile-cache" >> "$GITHUB_ENV"
      - run: npm ci
      - name: Install Playwright Chromium
        if: matrix.browser
        run: npx playwright install chromium
      # pretest:ci builds and typechecks both core and View Modules once.
      - run: npm run test:ci -- --suite=${{ matrix.suite }} --test-concurrency=${{ matrix.workers }}
      - if: matrix.suite == 'cli' || matrix.suite == 'app-cli'
        run: npm run smoke:project
      - name: Preserve test timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: timings-${{ matrix.os }}-${{ matrix.suite }}
          path: ci-results
          if-no-files-found: error

  windows-package-smoke:
    needs: plan
    name: Windows packaged CLI shells
    runs-on: windows-latest
    timeout-minutes: ${{ needs.plan.outputs.profile == 'full' && 10 || 5 }}
    env:
      MEMSPHERE_HOME: ${{ github.workspace }}\.ci-memsphere-home
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Reuse Node compilation within this job
        shell: bash
        run: echo "NODE_COMPILE_CACHE=$RUNNER_TEMP/memsphere-node-compile-cache" >> "$GITHUB_ENV"
      - name: Pack and install
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .ci-pack, .ci-install | Out-Null
          npm pack --ignore-scripts --pack-destination .ci-pack
          $package = (Get-ChildItem .ci-pack\*.tgz | Select-Object -First 1).FullName
          npm install --prefix .ci-install $package
      - name: Packaged core Run and View lifecycle
        shell: pwsh
        run: node scripts/windows-package-smoke.mjs
      - name: Windows PowerShell 5.1 smoke
        shell: powershell
        run: |
          & ".\.ci-install\node_modules\.bin\memsphere.cmd" --version
          & ".\.ci-install\node_modules\.bin\memsphere.cmd" --help
          Push-Location ".ci windows project"
          & "..\.ci-install\node_modules\.bin\memsphere.cmd" view status
          Pop-Location
      - name: PowerShell 7 smoke
        shell: pwsh
        run: |
          & ".\.ci-install\node_modules\.bin\memsphere.cmd" --version
          & ".\.ci-install\node_modules\.bin\memsphere.cmd" --help
          Push-Location ".ci windows project"
          & "..\.ci-install\node_modules\.bin\memsphere.cmd" view status
          Pop-Location
      - name: CMD smoke
        shell: cmd
        run: |
          .ci-install\node_modules\.bin\memsphere.cmd --version
          .ci-install\node_modules\.bin\memsphere.cmd --help
          cd /d ".ci windows project"
          ..\.ci-install\node_modules\.bin\memsphere.cmd view status
      - name: Git Bash smoke
        shell: bash
        run: |
          ./.ci-install/node_modules/.bin/memsphere --version
          ./.ci-install/node_modules/.bin/memsphere --help
          cd ".ci windows project"
          ../.ci-install/node_modules/.bin/memsphere view status

      - name: Native platform contracts
        if: needs.plan.outputs.profile == 'default'
        env:
          CI_TEST_RESULTS: ci-results/windows-latest-package-platform.json
        run: node scripts/run-tests.mjs --suite=package-platform --test-concurrency=2
      - name: Preserve native contract timings
        if: always() && needs.plan.outputs.profile == 'default'
        uses: actions/upload-artifact@v4
        with:
          name: timings-windows-latest-package-platform
          path: ci-results
          if-no-files-found: error

  budget:
    name: CI five-minute budget
    runs-on: ubuntu-24.04
    needs: [plan, test, windows-package-smoke]
    if: always() && needs.plan.outputs.profile == 'default'
    timeout-minutes: 1
    steps:
      - uses: actions/checkout@v7
      - name: Require all tests and the full workflow to meet the budget
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TEST_RESULT: ${{ needs.test.result }}
          PACKAGE_RESULT: ${{ needs.windows-package-smoke.result }}
        run: |
          node scripts/ci-budget.mjs
          test "$TEST_RESULT" = success
          test "$PACKAGE_RESULT" = success

  full-result:
    name: Full cross-platform regression
    runs-on: ubuntu-24.04
    needs: [plan, test, windows-package-smoke]
    if: always() && needs.plan.outputs.profile == 'full'
    timeout-minutes: 1
    steps:
      - env:
          TEST_RESULT: ${{ needs.test.result }}
          PACKAGE_RESULT: ${{ needs.windows-package-smoke.result }}
        run: |
          test "$TEST_RESULT" = success
          test "$PACKAGE_RESULT" = success
