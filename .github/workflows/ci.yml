name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }}, ${{ matrix.title }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, suite: browser, title: "Browser UI", workers: 3, browser: true }
          - { os: ubuntu-latest, suite: cli, title: "CLI & Packaging", workers: 3, browser: false }
          - { os: ubuntu-latest, suite: memory-and-projects, title: "Projects & Memory", workers: 2, browser: true }
          - { os: ubuntu-latest, suite: runtime-core, title: "Run, Data & SDK", workers: 2, browser: false }
          - { os: macos-latest, suite: browser, title: "Browser UI", workers: 3, browser: true }
          - { os: macos-latest, suite: cli, title: "CLI & Packaging", workers: 4, browser: false }
          - { os: macos-latest, suite: core, title: "Projects, Memory & Runtime", workers: 4, browser: true }
          - { os: windows-latest, suite: model-ui, title: "Models & Settings UI", workers: 2, browser: true }
          - { os: windows-latest, suite: review-ui, title: "Review & Shell UI", workers: 2, browser: true }
          - { os: windows-latest, suite: memory-cli, title: "Memory & Project CLI", workers: 2, browser: false }
          - { os: windows-latest, suite: app-cli, title: "App, Model & Data CLI", workers: 2, browser: false }
          - { os: windows-latest, suite: project-core, title: "Project Lifecycle", workers: 2, browser: false }
          - { os: windows-latest, suite: memory-core, title: "Memory Stores & Changes", workers: 2, browser: true }
          - { os: windows-latest, suite: runtime-core, title: "Run, Data & SDK", workers: 2, browser: false }
    env:
      CI_TEST_RESULTS: ci-results/${{ matrix.os }}-${{ matrix.suite }}.json
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Playwright Chromium
        if: matrix.browser
        run: npx playwright install chromium
      # pretest:ci builds and typechecks both core and View Modules once.
      - run: npm run test:ci -- --suite=${{ matrix.suite }} --test-concurrency=${{ matrix.workers }}
      - if: matrix.suite == 'cli' || matrix.suite == 'app-cli'
        run: npm run smoke:project
      - name: Preserve test timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: timings-${{ matrix.os }}-${{ matrix.suite }}
          path: ci-results
          if-no-files-found: error

  windows-package-smoke:
    name: Windows packaged CLI shells
    runs-on: windows-latest
    timeout-minutes: 5
    env:
      MEMSPHERE_HOME: ${{ github.workspace }}\.ci-memsphere-home
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Pack and install
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .ci-pack, .ci-install | Out-Null
          npm pack --ignore-scripts --pack-destination .ci-pack
          $package = (Get-ChildItem .ci-pack\*.tgz | Select-Object -First 1).FullName
          npm install --prefix .ci-install $package
      - name: Packaged core Run and View lifecycle
        shell: pwsh
        run: node scripts/windows-package-smoke.mjs
      - name: Windows PowerShell 5.1 smoke
        shell: powershell
        run: |
          & ".\.ci-install\node_modules\.bin\memsphere.cmd" --version
          & ".\.ci-install\node_modules\.bin\memsphere.cmd" --help
          Push-Location ".ci windows project"
          & "..\.ci-install\node_modules\.bin\memsphere.cmd" view status
          Pop-Location
      - name: PowerShell 7 smoke
        shell: pwsh
        run: |
          & ".\.ci-install\node_modules\.bin\memsphere.cmd" --version
          & ".\.ci-install\node_modules\.bin\memsphere.cmd" --help
          Push-Location ".ci windows project"
          & "..\.ci-install\node_modules\.bin\memsphere.cmd" view status
          Pop-Location
      - name: CMD smoke
        shell: cmd
        run: |
          .ci-install\node_modules\.bin\memsphere.cmd --version
          .ci-install\node_modules\.bin\memsphere.cmd --help
          cd /d ".ci windows project"
          ..\.ci-install\node_modules\.bin\memsphere.cmd view status
      - name: Git Bash smoke
        shell: bash
        run: |
          ./.ci-install/node_modules/.bin/memsphere --version
          ./.ci-install/node_modules/.bin/memsphere --help
          cd ".ci windows project"
          ../.ci-install/node_modules/.bin/memsphere view status

  budget:
    name: CI five-minute budget
    runs-on: ubuntu-latest
    needs: [test, windows-package-smoke]
    if: always()
    timeout-minutes: 1
    steps:
      - uses: actions/checkout@v7
      - name: Require all tests and the full workflow to meet the budget
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TEST_RESULT: ${{ needs.test.result }}
          PACKAGE_RESULT: ${{ needs.windows-package-smoke.result }}
        run: |
          node scripts/ci-budget.mjs
          test "$TEST_RESULT" = success
          test "$PACKAGE_RESULT" = success
