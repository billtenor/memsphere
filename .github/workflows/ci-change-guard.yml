name: CI change protection

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited]
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  statuses: write

concurrency:
  group: ci-change-guard-publisher
  cancel-in-progress: false

jobs:
  guard:
    name: Publish CI change protection status
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/heads/master
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Inspect PR files without running PR code
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci/ci-change-guard.mjs --publish
