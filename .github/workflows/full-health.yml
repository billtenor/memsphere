name: Update PR merge gate
run-name: Update PR merge gate (${{ github.event_name == 'workflow_run' && format('CI {0}', github.event.action) || github.event_name == 'push' && 'master updated' || github.event_name == 'pull_request_target' && format('PR {0}', github.event.action) || 'manual refresh' }})

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited]
    branches: [master]
  push:
    branches: [master]
  workflow_run:
    workflows: [CI]
    types: [requested, in_progress, completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: read
  statuses: write

# Every run refreshes all PRs from live facts, including after coalesced events.
concurrency:
  group: full-health-publisher
  cancel-in-progress: false

jobs:
  refresh:
    name: Publish merge gate status (no tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/heads/master
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Query full regression and update PR statuses
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # Temporary rollout bridge; remove the repository variable after ruleset cutover.
          FULL_HEALTH_PUBLISH_LEGACY: ${{ vars.FULL_HEALTH_PUBLISH_LEGACY }}
        run: |
          export CHECKED_OUT_SHA="$(git rev-parse HEAD)"
          node scripts/ci/full-health.mjs --publish
