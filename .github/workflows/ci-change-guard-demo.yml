# Temporary PR #118 acceptance demo. Remove after Human acceptance.
# Human explicitly authorized running this reviewed PR version before first installation.
name: CI change guard acceptance demo

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read
  statuses: write

concurrency:
  group: ci-change-guard-acceptance-demo
  cancel-in-progress: false

jobs:
  demonstrate:
    if: github.event.pull_request.number == 118 && github.event.pull_request.head.repo.full_name == github.repository
    name: CI modification rejected (temporary acceptance demo)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Run the real guard for PR 118
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          import { createApi, REPOSITORY } from './scripts/full-health.mjs';
          import { refreshGuard } from './scripts/ci-change-guard.mjs';
          const api = createApi({ token: process.env.GITHUB_TOKEN });
          const list = api.list;
          api.list = async (path, key) => {
            const items = await list(path, key);
            return path === '/pulls?state=open&base=master' ? items.filter(pull => pull.number === 118) : items;
          };
          const reports = await refreshGuard(api, {
            publish: true,
            targetUrl: `https://github.com/${REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`
          });
          if (reports.length !== 1) throw new Error('Expected exactly PR 118 for acceptance demo');
          if (reports.some(report => report.state !== 'success')) process.exitCode = 1;
          JS
