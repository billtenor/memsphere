!procedure
syntax: memsphere-20260721-stable
names:
  - generic-requirement-management
  - 通用需求管理流程
defines:
  - 按当前项目的需求管理约定，管理单个需求的记录、状态更新、完成归档和取消归档。
asserts:
  - 一次执行只处理一个需求，只修改需求记录及其明确附件，不得修改或清理无关内容。
  - 操作前必须确认当前项目的需求记录、状态和归档约定，并检查重复需求、关联需求、目标记录和归档冲突。
  - 更新已有需求时必须保留仍然有效的背景、决策、验收标准和历史结果。
goals:
  - 让需求状态和生命周期可以通过项目约定的记录直接追踪。
  - 保留需求、验收标准、技术与测试方案、开发任务和验收结果。
flow:
  - !action
    action: 提供新需求描述或已有需求的管理请求，以及相关附件、目标状态或归档意图。
    actor: human
    artifact: !artifact
      name: 需求管理请求
      format: markdown

  - !action
    action: 读取当前项目的需求管理约定，定位相关需求记录，并按本次操作需要调查代码、测试和提交记录。
    actor: agent
    asserts:
      - 新需求必须检查重复和强关联需求；没有则记录“无”。
      - 已有需求必须唯一定位，不能仅凭相似标题猜测。
      - 只调查足以判断本次操作的信息，不得额外建立项目未要求的需求总表或状态索引。
    artifact: !artifact
      name: 需求调查与操作判断
      format: markdown

  - !if
    condition: !action
      action: 判断本次请求是否需要创建新的需求记录。
      actor: agent
      artifact: !artifact
        name: 是否创建新需求记录
        type: boolean
    then:
      - !action
        action: 整理需求目标、边界和验收标准，并按当前项目约定创建需求记录。
        actor: agent
        asserts:
          - 需求标识必须唯一，并符合当前项目的命名与存储约定。
          - 需求记录必须包含标识、状态、类型和创建时间；项目要求执行追踪标识时必须一并记录。
          - 正文必须说明需求、验收标准、范围、不做事项和关联需求；验收标准应可执行或可观察。
          - 尚未形成的方案、任务和验收结果写“待开发前补充”或“尚未开始”，不得虚构。
          - 附件必须保存到项目约定的稳定位置，不得引用临时路径。
        artifact: !artifact
          name: 新建需求记录结果
          format: markdown

    else:
      - !if
        condition: !action
          action: 判断本次请求是否要求 completed 归档。
          actor: agent
          artifact: !artifact
            name: 是否请求 Completed 归档
            type: boolean
        then:
          - !action
            action: 对照全部验收标准检查实际实现，运行必要测试，并将证据和结论写入需求记录。
            actor: agent
            asserts:
              - 必须记录实际命令、结果、未执行项、阻塞问题，以及无法自动化检查的交付要求和可观察证据。
              - 不得仅依据提交说明、代码存在或历史测试结果判定通过。
              - 存在未满足标准、未完成回归或无法排除的实质风险时，验收结论必须为未通过。
            artifact: !artifact
              name: Completed 归档验收报告
              format: markdown

          - !if
            condition: !action
              action: 判断全部验收标准和项目回归是否通过且不存在归档阻塞。
              actor: agent
              artifact: !artifact
                name: 是否满足 Completed 归档条件
                type: boolean
            then:
              - !action
                action: 按当前项目约定记录完成状态和完成时间，并在项目设有归档机制时归档需求记录。
                actor: agent
                asserts:
                  - 只有完整验收明确通过时才能归档。
                  - 归档目标冲突时必须停止并报告，不得覆盖。
                artifact: !artifact
                  name: Completed 归档结果
                  format: markdown

        else:
          - !if
            condition: !action
              action: 判断本次请求是否要求 cancelled 归档。
              actor: agent
              artifact: !artifact
                name: 是否请求 Cancelled 归档
                type: boolean
            then:
              - !action
                action: 将可确认的取消原因和日期写入需求记录，按当前项目约定更新取消状态，并在项目设有归档机制时归档。
                actor: agent
                asserts:
                  - 未提供详细原因时只记录“需求方明确请求取消”等可确认事实，不得虚构背景。
                  - 归档目标冲突时必须停止并报告，不得覆盖。
                artifact: !artifact
                  name: Cancelled 归档结果
                  format: markdown
            else:
              - !action
                action: 根据实际进展更新需求记录的状态和受影响内容。
                actor: agent
                asserts:
                  - 状态值和状态迁移必须符合当前项目的需求管理约定。
                  - 状态和内容变化必须有 human 请求、代码、测试或实际执行记录作为依据。
                artifact: !artifact
                  name: Active Change 更新结果
                  format: markdown

  - !action
    action: 复核最终需求记录的位置、元数据、正文结构、状态或归档位置，并读取完整记录作为产物。
    actor: agent
    asserts:
      - 活跃需求必须包含合法状态；已完成需求必须包含完成时间；已取消需求必须记录取消原因。
    artifact: !artifact
      name: 最终需求记录
      type: object
      format:
        name: markdown
        layout: outline
      schema: !schema
        type: object
        format:
          name: markdown
          layout: outline
        fields:
          - 需求
          - 验收标准
          - 技术与测试方案
          - 开发任务
          - 验收结果
      final: true

  - !action
    action: 向 human 汇报处理结果、最终记录位置和后续动作。
    actor: agent
    artifact: !artifact
      name: 需求管理处理摘要
      format: markdown
      final: true
