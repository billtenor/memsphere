!procedure
syntax: memsphere-20261027-stable
mode: graph
names:
  - generic-agile-requirement-development
  - 通用敏捷需求开发流程
defines:
  - 通过 human 与 agent 的迭代协作，把软件需求推进到当前迭代实现、验证、验收、PR 提交、全部适用 CI 通过、human 操作合入、agent 核验合入结果及本地开发分支清理。
  - 通过统一准出核验选择进入点，顺序完成同步 master、CI 跟进、技术验收和产品验收，再核验当前 HEAD 是否可交由 human 合入。
asserts:
  - 各阶段产物须符合已确认的需求范围、实施方案和适用仓库规范；范围或方案变更须有 human 确认依据。
  - 本流程的“全部适用 CI”仅指实际验证当前 PR 候选版本的检查；目标分支健康门禁单独记录，不计入该集合，流程推进不等于可以合入。
goals:
  - 确认当前迭代的范围、交付物和验收标准。
  - 按仓库规范完成实现和验证。
  - 完成本地验证并提交 PR，确保当前 HEAD 已同步最新 master、全部适用 CI 通过，并取得对应版本的技术与产品验收。
  - 等待 human 操作合入，由 agent 核验合入结果；正常则清理本轮本地开发分支并结束运行，有问题或无法判断时再联系 human。
actions:
  - !action
    id: requirements
    description: 调查需求、相关实现和适用规范，形成当前迭代需求契约。
    actor: agent
    asserts:
      - 需求契约须包含整体目标、当前迭代范围、后续范围、交付物、验收标准、兼容性要求和待确认项。
      - 契约须列明采用的项目规范；无适用项时注明“无”。
    dependencies:
      - !dependency
        from: START
    artifact:
      name: 当前迭代需求契约
      model:
        definedBy: json-schema/draft-07.json
        definition: '{"type":"string"}'
      payload:
        contentType: text/markdown
      review:
        - 产品负责人
  - !action
    id: implementation_plan
    description: 基于需求契约调查代码和适用规范，形成实施与验证方案。
    actor: agent
    asserts:
      - 方案须基于实际代码，说明实现方式、影响范围、开发任务、验证方式和采用的项目规范。
      - 影响实施方向的待决问题须有 human 确认结论。
    dependencies:
      - !dependency
        from: requirements
    artifact:
      name: 实施与验证方案
      model:
        definedBy: json-schema/draft-07.json
        definition: '{"type":"string"}'
      payload:
        contentType: text/markdown
      review:
        - 研发工程师
        - 架构师
        - 测试工程师
  - !action
    id: implement
    description: 按需求契约、实施与验证方案及适用开发和测试规范完成开发、本地验证与问题修复。
    actor: agent
    asserts:
      - 交付的代码、测试及必要文档、Skill 和 Memory 须相互一致。
      - 摘要须说明主要改动与需求落实情况、行为及兼容性影响、实际检查及结果、未执行项和残留问题。
      - 适用本地检查须全部通过，未执行项须有不适用依据；发现的问题须说明处置和修复验证结果。
      - 本轮存在 Memory 差异时，摘要须引用匹配交付版本且通过 Store 与 ChangeSet 校验的结果，包含 ChangeSet ID 和 View 入口。
    dependencies:
      - !dependency
        from:
          - requirements
          - implementation_plan
    artifact:
      name: 开发与测试摘要
      model:
        definedBy: json-schema/draft-07.json
        definition: '{"type":"string"}'
      payload:
        contentType: text/markdown
  - !action
    id: pr
    description: 按适用 Git 规范检查交付内容，创建 commit 并推送，创建或更新本轮 GitHub PR。
    actor: agent
    asserts:
      - 提交内容须完整覆盖本轮实现、测试和必要文档，且不包含其他任务的改动。
      - 提交结果须记录 PR URL、远端、开发分支、目标分支和 head SHA；本地 HEAD 与 PR head 一致，交付内容无未提交改动。
      - PR 标题和描述须说明交付范围、验证结果及残留问题；同一交付使用同一 PR。
      - 本轮存在 Memory 差异时，报告须引用匹配交付版本且通过 Store 与 ChangeSet 校验的结果，包含 ChangeSet ID 和 View 入口。
    dependencies:
      - !dependency
        from: implement
    artifact:
      name: GitHub PR 提交结果
      model:
        definedBy: json-schema/draft-07.json
        definition: '{"type":"string"}'
      payload:
        contentType: text/markdown
  - !action
    id: release_gate
    description: 更新远端引用，核对当前 HEAD 的 master 同步、CI、技术验收与产品验收结果，选择下一入口。
    actor: agent
    asserts:
      - 核验对象须为无未提交交付改动且本地 HEAD 与 PR head 一致的候选；masterSha 表示本次查询的最新远端目标提交。
      - route 按优先级取值：最新目标提交不是 HEAD 的祖先时为 sync_master；否则当前 HEAD 的全部适用 CI 未通过时为 follow_ci；否则缺少当前 HEAD 的技术验收时为 technical_acceptance；否则缺少当前 HEAD 的产品验收时为 product_acceptance；四项均通过时为 ready。
      - evidence 须包含四项门禁的结论和依据；CI 结果须属于当前 HEAD，覆盖全部适用检查且成功，不适用项须有依据。
      - 验收依据须引用同一 Run 中正式接纳的 Artifact、Review 和通过轮次，且候选 head SHA 与当前 HEAD 一致；缺失或无法确认的证据不能计为通过。
    dependencies:
      - !dependency
        from: pr
      - !dependency
        from: delivery
    artifact:
      name: 准出核验结果
      model:
        definedBy: json-schema/draft-07.json
        definition: '{"type":"object","additionalProperties":false,"required":["route","headSha","masterSha","prUrl","evidence"],"properties":{"route":{"type":"string","enum":["sync_master","follow_ci","technical_acceptance","product_acceptance","ready"]},"headSha":{"type":"string","minLength":1},"masterSha":{"type":"string","minLength":1},"prUrl":{"type":"string","minLength":1},"evidence":{"type":"string","minLength":1}}}'
      payload:
        contentType: application/json
  - !action
    id: sync_master
    description: 将最新远端 master 合入开发分支，解决冲突，执行适用本地验证并提交、推送到本轮 PR。
    actor: agent
    asserts:
      - 同步后的 HEAD 须包含最新远端目标提交，集成结果的适用本地检查须全部通过。
      - 同步记录须包含 PR URL、目标分支及 SHA、同步前后 HEAD、冲突解决摘要和验证结果。
      - 本轮存在 Memory 差异时，报告须引用匹配交付版本且通过 Store 与 ChangeSet 校验的结果，包含 ChangeSet ID 和 View 入口。
    dependencies:
      - !dependency
        from: release_gate
        when: artifacts.release_gate.route = "sync_master"
    artifact:
      name: master 同步与集成验证记录
      model:
        definedBy: json-schema/draft-07.json
        definition: '{"type":"string"}'
      payload:
        contentType: text/markdown
  - !action
    id: check_ci
    description: 查询 PR 当前 head 对应的全部适用 CI，判断是否需要继续跟进。
    actor: agent
    asserts:
      - 仅当当前 head 的全部适用 CI 均已成功时，结果为 false；等待中、失败、取消、超时或预期检查缺失时为 true。
      - 无检查、仅部分成功、skipped 或 neutral 不能作为全部通过的依据；不适用项须有仓库依据。
      - master full 及其派生的目标分支健康门禁不参与本步骤的布尔判断；不得因它们排队、运行中、尚未触发或失败而返回 true 或持续等待。当前 PR 候选自身适用的 full 检查仍按实际结果跟进。
    dependencies:
      - !dependency
        from: sync_master
      - !dependency
        from: release_gate
        when: artifacts.release_gate.route = "follow_ci"
      - !dependency
        from: follow_ci
    artifact:
      name: CI 是否仍需跟进
      model:
        definedBy: json-schema/draft-07.json
        definition: '{"type":"boolean"}'
      payload:
        contentType: application/json
  - !action
    id: follow_ci
    description: 跟进未完成的 CI；定位失败原因，修复并执行受影响本地验证，提交、推送到本轮 PR；临时环境故障可有依据地重跑。
    actor: agent
    asserts:
      - 跟进记录须包含 PR URL、head SHA、检查状态及链接、失败原因、修复内容和本地验证结果。
      - 修复后的交付须保持已确认范围与验收标准，不得以削弱测试或关闭适用检查取得通过结果。
      - 本轮存在 Memory 差异时，报告须引用匹配交付版本且通过 Store 与 ChangeSet 校验的结果，包含 ChangeSet ID 和 View 入口。
    dependencies:
      - !dependency
        from: check_ci
        when: artifacts.check_ci = true
    artifact:
      name: CI 跟进与修复记录
      model:
        definedBy: json-schema/draft-07.json
        definition: '{"type":"string"}'
      payload:
        contentType: text/markdown
  - !action
    id: acceptance
    description: 按需求契约和实施方案验收当前 PR 的实现与验证成果；修正问题后完成 master 同步、本地验证、PR 更新及 CI 验证，提交技术评审。
    actor: agent
    asserts:
      - 验收对象须覆盖当前候选的完整代码、测试、文档及 Memory 改动；已确认范围正确实现、验收标准有充分证据且无阻塞交付的问题或风险。
      - 验收材料须固定 PR URL、head SHA、目标分支 SHA 和实际 diff；该 HEAD 须包含最新目标提交，全部适用本地检查和 CI 已通过。
      - 评审结论须体现各角色的审查依据，区分亲自检查或执行的内容与引用的证据，并记录问题、修正结果及残余风险。
      - 本轮存在 Memory 差异时，报告须引用匹配交付版本且通过 Store 与 ChangeSet 校验的结果，包含 ChangeSet ID 和 View 入口。
    dependencies:
      - !dependency
        from: check_ci
        when: artifacts.check_ci = false
      - !dependency
        from: release_gate
        when: artifacts.release_gate.route = "technical_acceptance"
    artifact:
      name: 实现与验证验收材料
      model:
        definedBy: json-schema/draft-07.json
        definition: '{"type":"string"}'
      payload:
        contentType: text/markdown
      review:
        - 研发工程师
        - 测试工程师
        - 架构师
  - !action
    id: delivery
    description: 验收当前 PR 的产品行为并形成交付报告；修正问题后完成受影响验证、commit 和推送，提交产品评审。
    actor: agent
    asserts:
      - 交付报告须固定 PR URL 和最终 head SHA，说明交付内容、验收标准的达成情况、验证结果、后续范围及残留问题。
      - 产品验收结论须以已确认的需求契约和实际产品行为为依据，并覆盖报告固定的候选版本。
      - 本轮存在 Memory 差异时，报告须引用匹配交付版本且通过 Store 与 ChangeSet 校验的结果，包含 ChangeSet ID 和 View 入口。
    dependencies:
      - !dependency
        from: acceptance
      - !dependency
        from: release_gate
        when: artifacts.release_gate.route = "product_acceptance"
    artifact:
      name: 敏捷需求开发交付报告
      model:
        definedBy: json-schema/draft-07.json
        definition: '{"type":"string"}'
      payload:
        contentType: text/markdown
      review:
        - 产品负责人
  - !action
    id: ci_final
    description: 核对当前候选的准出结果与目标分支健康门禁，形成合入交接报告；候选准出结果过期时通过 CLI 回溯准出核验。
    actor: agent
    asserts:
      - 交接报告须引用当前候选的 ready 核验结果、PR URL、head SHA、目标 SHA、四项门禁证据和残留问题。
      - 交接版本须与准出核验一致，包含最新目标提交且全部适用 CI 成功。
      - 交接须单独说明 master full 及实际合入门禁的状态与证据；master full 未完成时交接为“本轮验收完成，等待合入门禁放行”，不得声称已可合入；失败或门禁查询异常时说明阻断原因。保留已完成验收，不为目标分支健康门禁持续轮询、修复本分支或重复验收，由 Human 在门禁满足后操作合入。
      - 本轮存在 Memory 差异时，报告须引用匹配交付版本且通过 Store 与 ChangeSet 校验的结果，包含 ChangeSet ID 和 View 入口。
    dependencies:
      - !dependency
        from: release_gate
        when: artifacts.release_gate.route = "ready"
    artifact:
      name: PR 与 CI 最终交付报告
      model:
        definedBy: json-schema/draft-07.json
        definition: '{"type":"string"}'
      payload:
        contentType: text/markdown
  - !action
    id: human_merge
    description: 操作合入已通过准出核验的 PR。
    actor: human
    asserts:
      - 实际合入时须满足仓库合入门禁；master full 运行中的 pending 仍阻止合入，不能把本轮验收完成当作门禁已通过，交接后的状态更新由仓库门禁继续约束。
      - 合入记录须包含 PR URL、实际 merged 状态、合入提交和目标分支。
    dependencies:
      - !dependency
        from: ci_final
    artifact:
      name: Human 合入记录
      model:
        definedBy: json-schema/draft-07.json
        definition: '{"type":"string"}'
      payload:
        contentType: text/markdown
  - !action
    id: cleanup
    description: 核验实际合入结果及必要的集成结果；正常则清理本轮本地分支并收尾，有问题或无法判断时保留现场并联系 human。
    actor: agent
    asserts:
      - 核验结果须证明 PR 已合入目标分支、本轮改动完整纳入，且合入结果满足适用验证与验收标准；支持 merge、squash 和 rebase 合入。
      - 合入后的 master full 不属于本步骤核验范围，不查询、等待或重跑该任务，其状态不作为结果核验通过或本地分支清理的条件。
      - 清理范围仅限本轮本地开发分支，不得丢失未提交内容、未合入改动或影响其他 worktree。
      - 收尾报告须包含 PR URL、合入提交、结果核验结论及证据、原本地分支名和清理结果；准出时合入结果正常且该本地分支已不存在。
    dependencies:
      - !dependency
        from: human_merge
    artifact:
      name: 合入结果核验与本地分支清理结果
      model:
        definedBy: json-schema/draft-07.json
        definition: '{"type":"string"}'
      payload:
        contentType: text/markdown
