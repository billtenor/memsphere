!statement
syntax: memsphere-20260721-stable
names:
  - memsphere-general-delivery-rules
  - 通用交付规范
defines:
  - 规定软件需求完成后的通用交付与归档要求。
asserts:
  - 项目使用 Memsphere 时，交付前必须检查本轮是否存在 Memory 差异；存在时，必须对最终内容执行 memsphere memory change validate [change-id]，交付记录必须包含与最终内容匹配且校验通过的 ChangeSet ID、校验状态和 View 入口，普通 Store 校验不能代替变更级校验。
  - 需求实现、验证和验收完成后，必须形成交付记录，说明交付内容、验证结果、验收结论、兼容性影响、残留问题和后续事项。
  - 必须按照当前项目的需求管理约定更新完成状态、完成时间和验收结果。
  - 当前项目设有需求归档机制时，必须将已完成需求归档到约定位置，且不得覆盖已有归档。
  - 交付记录、状态更新和必要归档完成前，不得将需求视为已经完整交付。
