!statement
syntax: memsphere-20260721-stable
names:
  - memsphere-general-testing-rules
  - 通用测试规范
defines:
  - 规定软件变更交付前的通用测试和验证要求。
asserts:
  - 代码行为发生变化时，必须补充或更新能够覆盖该行为的测试；修复缺陷时必须增加能够复现原问题的回归测试。
  - 测试必须覆盖本轮变更涉及的正常路径，以及相关的失败路径和边界情况。
  - 必须先执行与改动直接相关的针对性验证，再执行项目规定且与本次交付相关的完整检查。
  - 不得通过删除、跳过或弱化有效测试和断言来使验证通过。
  - 必须记录本轮实际执行的命令、结果和未执行项，不得用历史结果代替当前验证。
  - 验证失败时必须区分本轮变更导致的失败、既有失败和环境阻塞；存在阻塞交付的问题时不得声称验证通过。
sections:
  - !statement
    names:
      - 测试意图与职责边界
    defines:
      - 规定测试的存在理由、独立保护契约和职责边界。
    asserts:
      - 每条测试必须能够说明其前提、用户或调用方执行的行为、预期可观察结果，以及失败时代表被破坏的产品契约。
      - 每条测试必须独立保护一个明确的可观察契约，并能通过测试名称和断言识别被破坏的产品含义；无法明确契约或可观察结果的测试不得保持当前形态。
      - 一条测试只能有一个主要失败含义；多个断言必须共同证明同一契约，无关契约必须拆分为独立测试。
      - 非被测前置状态应通过适用的接口、fixture 或 helper 以最短可靠路径构造；测试必须验证可观察结果，不得把非被测的实现步骤重新演练为测试主体。
  - !statement
    names:
      - 测试分层
    defines:
      - 按测试实际跨越的运行边界选择和命名测试层级。
    asserts:
      - 测试层级必须按实际跨越的运行边界判断，不得根据文件名、测试框架或是否使用 mock 笼统命名。
      - 单元测试验证单个小范围行为，不启动真实网络服务、浏览器或子进程；模块测试验证同一子系统内多个模块的协作，可以使用受控临时文件系统或内存 fixture，但不跨用户可见的服务或进程边界；集成测试跨越真实网络服务、命令行或子进程、版本库、浏览器等边界。
      - 应选择能够验证变更风险的最低测试层级；真实边界上的行为必须由适用的集成测试覆盖，不得只用单元测试替代。
  - !statement
    names:
      - 自动化测试稳定性
    defines:
      - 约束自动化测试中的时序、等待和重试行为。
    asserts:
      - 自动化测试不得依赖机器执行速度、任务调度顺序或其他未受控时序；相同代码在相同环境中重复运行时，结果必须保持一致。
      - 测试异步加载、轮询或界面重渲染时，必须等待被测状态出现并设置超时，不得仅通过等待固定时长判断测试结果。
      - 测试失败源于竞态时，必须修复竞态；确实需要固定等待或重试时，必须限制等待时间或重试次数，并说明原因。
  - !statement
    names:
      - 前端交互测试
    defines:
      - 规定用户界面交互变更的实际操作验证要求。
    asserts:
      - 前端交互发生变化时，交付前必须使用项目适用的浏览器自动化或实际操作方式验证受影响交互，并确认可观察行为正确。
      - 使用真实浏览器驱动用户界面的自动化测试属于集成测试；异步加载、轮询和重渲染场景必须遵循自动化测试稳定性要求。
      - 对可能被重渲染打断的瞬时界面状态进行写入并立即观察时，应在同一页面执行上下文中完成；如果被测契约要求状态跨重渲染保持，则必须等待并断言重渲染后的稳定状态。
