!procedure
syntax: memsphere-20260721-stable
names:
  - memsphere-procedure-construction
  - memsphere Procedure记忆提取流程
  - Procedure 提取流程
defines:
  - 从已完成任务、Run、产物、仓库证据或已经理清的执行思路中，提取可复用、可执行且可验证的 Procedure Memory。
  - 适用于新建 Procedure 或根据可靠实践更新已有 Procedure，不负责执行被提取的流程。
  - 只保留会改变执行、判断或验收结果的内容，不把对话记录、临时尝试和通用常识照搬进 Memory。
  - 同一交付意图下围绕目标 Procedure 产生的相关 Memory 修改，可以在一个 Run 中复用同一 ChangeSet 多轮完成，直到 human 接受整个 ChangeSet 候选。
asserts:
  - 开始前必须使用 memsphere memory list 和 memory read 查找并应用当前工程中的 Memory 撰写、类型契约和 YAML 语法规则。
  - Memory 精简总则：asserts 只保留当前工程或 Memsphere 框架特有、且会改变执行、判断、控制流或验收结果的强制规则；行业共识、模型默认能力、通用安全与质量规范不得写入 Memory。
  - 同一交付意图必须在一个 Run 中持续复用同一个 ChangeSet，且只能包含与主要目标 Procedure 直接相关的 Memory；转入无关任务或改变主要目标时必须新建 Run 和 ChangeSet。
goals:
  - 明确 Procedure 的触发场景、边界、目标和最终交付物。
  - 将可靠经验压缩为最小且完整的执行流程。
  - 生成并验证可被 memsphere Run 执行的 Procedure YAML。
  - 在同一个 Run 中完成 human 要求的多轮相关修改，并只发布最终接受的完整 ChangeSet。
flow:
  - !action
    action: 提供需要提取的任务、已完成实践或执行思路，并按需指定目标 Procedure。
    actor: human
    artifact: !artifact
      name: Procedure 提取请求
      format: markdown

  - !while
    condition: !action
      action: 判断当前 ChangeSet 是否仍有待处理的创建、修改或删除要求。
      actor: agent
      asserts:
        - 初始 Procedure 提取请求尚未处理时必须返回 true；后续必须结合上一轮 Memory ChangeSet 候选验收意见判断。
        - 只有 human 已明确接受最新候选，且没有尚未处理的增量要求时才能返回 false。
      artifact: !artifact
        name: 是否继续修改 Memory ChangeSet
        type: boolean
    do:
      - !action
        action: 收集本轮修改要求及相关证据，确定提取来源、适用边界、主要目标 Procedure 和当前 ChangeSet 的完整 Memory 范围。
        actor: agent
        asserts:
          - 首轮必须使用 Procedure 提取请求；后续轮次必须同时使用上一轮 Memory ChangeSet 候选验收意见中的增量要求。
          - 写入依据必须来自 human 明确输入、实际执行证据或可验证来源；未执行的思路不得描述为已验证经验。
          - 更新或删除已有 Memory 时必须完整读取原文件及适用规则，并识别逻辑引用、Reserved/System 来源和需要同步的副本。
        artifact: !artifact
          name: 本轮 Memory ChangeSet 提取依据
          format: markdown

      - !while
        condition: !action
          action: 判断本轮是否仍缺少会影响流程触发、最终产物、关键分支、human 决策或循环终止的必要信息。
          actor: agent
          artifact: !artifact
            name: 本轮是否缺少关键流程信息
            type: boolean
        do:
          - !action
            action: 补充当前证据无法判断且会影响流程触发、最终产物、关键分支、human 决策或循环终止的信息。
            actor: human
            artifact: !artifact
              name: 本轮 Procedure 提取补充信息
              format: markdown

      - !action
        action: 使用 memsphere memory edit 定位当前 ChangeSet 中全部 Memory 的编辑位置。
        actor: agent
        asserts:
          - Managed Project 使用 memory edit 创建或追加 ChangeSet，并只写 CLI 返回的候选路径；不得直接修改正式 Memory 工作树。
          - Embedded Project 必须用 memory edit 获取当前 worktree 的 Edit Path，并通过普通 Git 工作流合入，不使用 memory publish。
          - 后续轮次必须复用首轮 change id 和 Edit Path；删除或更新时必须同步处理引用、manifest、Reserved/System 来源和安装副本。
        artifact: !artifact
          name: Memory ChangeSet 编辑位置
          type: object
          format: yaml

      - !action
        action: 根据本轮提取依据和补充信息，在已定位的编辑位置更新当前 ChangeSet 中全部相关 Memory。
        actor: agent
        asserts:
          - Memory 精简写入要求：每条 asserts 必须同时满足“当前工程或 Memsphere 特有”与“会改变执行、判断、控制流或验收结果”；不满足的条目必须删除，不得平移到 suggests。
          - 能由 Artifact、Schema、已读取的其他 Memory 或当前 Action 明确表达的契约不得在 asserts 中重复。
          - defines 只用非空字符串说明流程的含义、用途和边界，不得写入 !ref 或匿名 Statement/Schema。
          - 复用外部规则时必须按强制程度投影到 Statement、Schema、Action 或 Procedure 的 asserts/suggests；无法确定投影通道时必须由 human 选择。
          - flow 只保留必要步骤；每个 Action 必须职责单一，并产出后续步骤或 human 实际使用的 Artifact。
          - 只有真正改变控制流时才使用 !if 或 !while；只有已存在且可独立复用的 Procedure 才使用 !call。
          - Artifact 的评审修改必须使用当前 revision round；只有 human 新增修改要求才进入下一次外层循环。
          - "相关 Memory 必须遵循各自类型契约；只有循环外最终发布的 ChangeSet 和处理摘要可以标记 final: true。"
        artifact: !artifact
          name: 本轮 Memory ChangeSet Working Change
          type: object
          format: yaml

      - !action
        action: 校验并评审本轮 Memory ChangeSet 候选。
        actor: agent
        asserts:
          - 必须使用 memsphere memory change validate [change-id] 复用同一 ChangeSet，并更新可通过 Memory 入口和 ChangeSet 详情查看的单一当前验证内容；普通 memsphere validate 不能代替。
          - 必须检查完整 target 清单、目标关系、Procedure 控制流、类型契约、引用完整性和 Reserved/System 同步状态。
          - 未通过 change validate 时不得提交评审；Reviewer 或 Runner 要求修改时必须使用当前 Artifact Review 的 revision round 修订并重报。
        artifact: !artifact
          name: 本轮已验证的 Memory ChangeSet
          type: object
          format: yaml
          review:
            - 流程设计者

      - !action
        action: 验收当前 Memory ChangeSet 候选，并决定接受或继续修改。
        actor: human
        asserts:
          - 必须明确选择接受当前候选或继续修改；继续修改时必须提供下一轮增量要求。
          - 只有当前 ChangeSet 预览、校验结果和评审结论均可接受时才能选择接受。
        artifact: !artifact
          name: Memory ChangeSet 候选验收意见
          format: markdown

  - !action
    action: 发布 human 已接受的最终 Memory ChangeSet。
    actor: agent
    asserts:
      - 必须发布外层循环最后一次通过校验、评审并被 human 接受的同一 ChangeSet；验收后不得夹带新的 Memory 改动。
      - Managed Project 使用 memsphere memory publish；Embedded Project 使用普通 Git commit，且不得制造空 commit 或自动 push。
      - 整个 Run 只能发布一次，发布前必须满足当前工程的适用测试和交付规则。
    artifact: !artifact
      name: 已发布的 Memory ChangeSet
      type: object
      format: yaml
      final: true

  - !action
    action: 向 human 简要说明 ChangeSet 的主要目标 Procedure、全部 Memory 路径、提取依据、多轮修改记录、关键边界和校验结果。
    actor: agent
    artifact: !artifact
      name: Memory ChangeSet 提取结果
      format: markdown
      final: true
