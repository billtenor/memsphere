!procedure
syntax: memsphere-20260721-stable
names:
  - code-branch-review-and-remediation
  - 基于代码分支的评审与修复流程
  - 代码分支循环评审修复流程
defines:
  - 面向一个代码分支，在同一个 Run 中基于目标分支与基线分支的完整差异持续完成代码评审、问题判断、修复和复验，直到没有待处理问题或 human 决定结束。
  - 合并代码评审与评论修复的核心逻辑，不依赖 GitHub Pull Request、review comment 或 thread。
  - 评审意见、接受或拒绝依据、代码修改和验证结果只记录在本地 Memsphere 交付物中，不向 GitHub 发布 comment。
asserts:
  - 不得创建或发布 GitHub review、comment、thread reply 或其他远端评审反馈；Memsphere Artifact 是本流程的评审与处置记录。
  - 评审、意见处置、代码修复、Git commit 和 master 合入是分离的阶段，只能在对应 Action 中执行其副作用。
goals:
  - 对目标代码分支完成全面、基于工程规则且可追溯的评审。
  - 在同一流程中判断并修复合理问题，执行必要验证，并对修复后的新 HEAD 再评审。
  - 形成包含全部意见、处置依据、代码提交、验证结果和残余风险的本地交付记录。
flow:
  - !action
    action: 提供需要评审与修复的目标代码分支及基线分支。
    actor: human
    artifact: !artifact
      name: 代码分支评审与修复请求
      format: markdown

  - !action
    action: 建立分支评审基线。
    actor: agent
    asserts:
      - 必须确认目标分支与基线分支的 SHA、工作区状态、允许修改范围、完整 diff 范围和可用测试入口，不得覆盖或提交无关工作区改动。
      - 必须定位并记录本批代码最终获批的需求方案、技术方案和测试方案的稳定标识；无法唯一确定评审所必需的方案时必须请 human 澄清。
    artifact: !artifact
      name: 代码分支评审基线
      format: markdown

  - !while
    condition: !action
      action: 判断是否仍需评审或处理尚未闭环的问题。
      actor: agent
      asserts:
        - 首轮必须返回 true；此后只有最新 HEAD 已评审、全部意见已处置、适用验证已完成且没有阻塞性残余风险时才能结束，human 明确结束时必须保留未完成事项。
      artifact: !artifact
        name: 是否继续分支评审与修复
        type: boolean
    do:
      - !action
        action: 只读评审当前 HEAD 并生成代码问题清单。
        actor: agent
        asserts:
          - !ref
            target: statements/memsphere-repository-development-rules
          - !ref
            target: statements/memsphere-repository-testing-rules
          - 必须固定当前 HEAD SHA，并使用基线中记录的最终需求方案、技术方案和测试方案。
          - 必须核对实现是否满足获批需求、是否遵循技术方案或有合理且已说明的偏差、测试与检查是否覆盖测试方案；方案缺失或不一致本身必须作为评审证据处理。
          - 问题清单必须记录实际覆盖和有证据的问题；没有问题时也必须说明实际覆盖。
          - 本步骤只读，且从固定当前 HEAD 到 Artifact Review 完成期间 HEAD 必须保持不变；HEAD 变化时必须重新生成候选。
          - Reviewer 审核的是问题清单的覆盖范围、问题判断、证据和严重级别是否准确完整，不是判断目标代码是否已经达到合入条件；候选准确记录 blocking 或 risk 问题时仍应通过，不得仅因目标代码存在问题而拒绝候选。
        artifact: !artifact
          name: 当前 HEAD 代码问题清单
          format: markdown
          review:
            - 架构师
            - 测试工程师

      - !action
        action: 综合评审意见并形成不包含代码修改的处置结论。
        actor: agent
        asserts:
          - !ref
            target: statements/memsphere-repository-development-rules
          - !ref
            target: statements/memsphere-repository-testing-rules
          - Runner 必须根据代码、测试和适用工程 Memory 独立复核全部评审意见，合并重复项并逐项决定接受、拒绝、请求澄清或延期，不得因 Reviewer 提出就自动接受。
          - 接受表示问题成立并进入下一修复步骤，不表示问题已经修复。
          - 项目负责人审核的是处置判断及依据是否合理完整，不得仅因已接受问题尚未修复而拒绝准确的处置结论。
          - 已修复、仅供参考或不再适用于当前 HEAD 的意见不得被强行转化为代码修改，但仍须记录处置依据。
        artifact: !artifact
          name: 分支评审意见处置结论
          format: markdown
          review:
            - 项目负责人

      - !action
        action: 根据已批准的处置结论修复问题并完成验证。
        actor: agent
        asserts:
          - !ref
            target: statements/memsphere-repository-testing-rules
          - 只允许修改本轮处置结论已接受的问题，并运行适用工程 Memory 和变更范围要求的测试与检查。
          - 如果目标分支 HEAD 在修复期间发生变化，必须先重新同步并复核处置结论，禁止覆盖或忽略他人的新提交。
        artifact: !artifact
          name: 分支问题修复与验证记录
          format: markdown

      - !action
        action: 提交本轮修复的 Git commit。
        actor: agent
        asserts:
          - 只允许提交本轮已接受评审问题产生的修复；不得暂存或提交其他工作区内容，也不得把尚未执行的 master 合入混入该 commit。
          - 存在实际改动时，必须在本轮修复及适用验证达到可提交条件后创建 commit 并记录 commit SHA；没有实际改动时必须记录未创建 commit，不得制造空 commit。
          - 不得自动 push，除非 human 在请求中明确授权。
        artifact: !artifact
          name: 分支修复 Commit 结果
          format: markdown

      - !action
        action: 将 master 合入目标分支并解决冲突。
        actor: agent
        asserts:
          - 必须确认当前位于目标分支、本轮修复已提交且工作区可安全合入，并获取最新 master；不得把目标分支反向合入 master。
          - 必须完成合入所需的 merge commit 并记录 SHA；目标分支已经包含最新 master 时必须记录未创建 merge commit，不得制造空 commit。
        artifact: !artifact
          name: Master 合入与冲突解决记录
          format: markdown

      - !action
        action: 记录本轮评审与修复结果。
        actor: agent
        asserts:
          - 必须记录本轮最终 HEAD、方案来源、评审与处置、代码改动、验证、commit、master 合入以及未解决风险，作为下一轮基线。
          - 本轮修复 commit 或 master 合入使目标 HEAD 变化时，完成本记录后外层 while 必须继续，并基于本轮最终 HEAD 重新执行只读评审；不得在提交或合入步骤内提前跳回评审。
        artifact: !artifact
          name: 分支评审与修复轮次记录
          format: markdown

  - !action
    action: 汇总代码分支评审与修复结果。
    actor: agent
    artifact: !artifact
      name: 代码分支评审与修复总结
      format: markdown
      final: true
