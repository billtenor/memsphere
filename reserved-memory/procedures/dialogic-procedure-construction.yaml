!procedure
syntax: memsphere-20260719-stable
names:
  - 对话式构建 procedure 流程
  - 人工构建程序性记忆流程
  - dialogic-procedure-construction
defines:
  - 通过 human 主动发起与 Agent 的对话，把 human 已经掌握或可以描述的流程经验逐步构建为结构严谨、可验证的 !procedure Memory。
  - 该流程作为预置 Memory 由 memsphere init 安装或更新，实际使用时与其他已安装 Memory 一样通过标准 CLI 发现和读取。
  - 该流程暂不覆盖 Agent 自主发现流程、从代码或文档反推流程、或从多轮实践中归纳流程的 Procedure 构建方式。
  - 该流程先产出边界、目标、原始经验、原子步骤和审查结果，再生成最终 YAML，避免直接把自然语言说明写成不可运行的 Procedure。
goals:
  - 明确待构建 Procedure 的调用场景、目标、边界和最终交付物。
  - 将 human 的经验描述拆解为有序、可执行、带 Artifact 的流程步骤。
  - 显式识别 human 判断、Agent 动作、分支条件、循环条件和可复用 !call。
  - 在生成 YAML 前完成严谨性审查，降低 Procedure 逻辑不清、步骤过粗或 Artifact 缺失的风险。
  - 生成符合 memsphere 语法约束并可通过 validate 的 !procedure YAML。
flow:
  - !action
    action: 接收 human 对待构建 procedure 的初始描述。
    actor: human
    artifact: !artifact
      name: 初始 procedure 构建诉求
      format: markdown
  - !if
    condition: !action
      action: 判断初始描述是否缺少流程目标、典型触发场景或非适用场景。
      actor: agent
      artifact: !artifact
        name: 是否缺少流程定位信息
        type: boolean
    then:
      - !action
        action: 补充该 procedure 要解决的问题、典型触发场景和不应覆盖的场景。
        actor: human
        artifact: !artifact
          name: 流程定位补充信息
          format: markdown
    else:
      - !action
        action: 确认初始描述已经覆盖流程目标、典型触发场景和非适用场景。
        actor: agent
        artifact: !artifact
          name: 流程定位信息完整性确认
  - !action
    action: 基于初始描述和补充信息整理流程定位摘要，必须包含流程目标、典型触发场景、非适用场景和当前不确定项。
    actor: agent
    artifact: !artifact
      name: 流程定位摘要
      format: markdown
  - !action
    action: 整理 Procedure 边界草稿，必须包含候选名称、defines、asserts、goals、适用场景、非适用场景、最终交付物和暂不处理的问题。
    actor: agent
    artifact: !artifact
      name: procedure 边界草稿
      format: markdown
  - !while
    condition: !action
      action: 判断 procedure 边界草稿是否仍需调整。
      actor: human
      artifact: !artifact
        name: procedure 边界是否仍需调整
        type: boolean
    do:
      - !action
        action: 说明需要调整的边界、名称、目标或非适用场景。
        actor: human
        artifact: !artifact
          name: procedure 边界调整意见
          format: markdown
      - !action
        action: 根据调整意见更新 procedure 边界草稿。
        actor: agent
        artifact: !artifact
          name: 更新后的 procedure 边界草稿
          format: markdown
  - !action
    action: 描述运行该 procedure 后必须得到的最终交付物。
    actor: human
    artifact: !artifact
      name: 最终交付物期望
      format: markdown
  - !action
    action: 将最终交付物期望整理为 Artifact 名称、格式和验收标准。
    actor: agent
    artifact: !artifact
      name: 最终 artifact 定义
      format: markdown
  - !action
    action: 讲述 human 实际执行该流程时通常会如何做。
    actor: human
    artifact: !artifact
      name: 原始流程经验叙述
      format: markdown
  - !while
    condition: !action
      action: 判断原始流程经验中是否仍存在关键缺口、隐含判断或未说明的例外。
      actor: agent
      artifact: !artifact
        name: 是否仍需追问流程经验
        type: boolean
    do:
      - !action
        action: 针对一个关键缺口、隐含判断或例外情况提出追问。
        actor: agent
        artifact: !artifact
          name: 流程经验追问
      - !action
        action: 回答追问并补充对应经验。
        actor: human
        artifact: !artifact
          name: 流程经验补充回答
          format: markdown
  - !action
    action: 从原始经验中抽取按执行顺序排列的候选步骤。
    actor: agent
    artifact: !artifact
      name: 候选步骤清单
      format: markdown
  - !action
    action: 将候选步骤拆分为原子 Action，确保每个 Action 都有 action、actor 和 artifact，并把强制步骤约束与非强制建议分别整理为 asserts 和 suggests。
    actor: agent
    artifact: !artifact
      name: 原子步骤草稿
      format: markdown
  - !while
    condition: !action
      action: 判断原子步骤草稿中是否仍有步骤过粗、artifact 缺失或 actor 不明确。
      actor: agent
      artifact: !artifact
        name: 原子步骤是否仍需细化
        type: boolean
    do:
      - !action
        action: 指出一个需要细化的步骤及其问题。
        actor: agent
        artifact: !artifact
          name: 待细化步骤问题
          format: markdown
      - !action
        action: 补充该步骤的执行细节、判断依据或预期产物。
        actor: human
        artifact: !artifact
          name: 步骤细化补充信息
          format: markdown
      - !action
        action: 根据补充信息更新原子步骤草稿。
        actor: agent
        artifact: !artifact
          name: 更新后的原子步骤草稿
          format: markdown
  - !action
    action: 基于原子步骤草稿生成结构化流程草稿，必须把条件判断映射为 !if.condition，把重复动作映射为 !while，把可复用子流程映射为 !call，并确保每个普通步骤都是带 action、actor 和 artifact 的 !action；步骤约束和非强制建议分别按需写入 asserts 和 suggests。
    actor: agent
    artifact: !artifact
      name: 结构化流程草稿
      type: object
      format: yaml
  - !action
    action: "审查结构化流程草稿是否满足跨步骤约束写入 Procedure asserts、步骤约束写入 Action asserts、每个 Action 都有 Artifact、每个条件输出 boolean、human 判断显式标注 actor: human。"
    actor: agent
    artifact: !artifact
      name: 结构化流程严谨性审查结果
      format: markdown
  - !if
    condition: !action
      action: 判断严谨性审查是否发现必须修复的问题。
      actor: agent
      artifact: !artifact
        name: 是否存在必须修复的问题
        type: boolean
    then:
      - !while
        condition: !action
          action: 判断是否仍存在未修复的严谨性问题。
          actor: agent
          artifact: !artifact
            name: 是否仍有未修复严谨性问题
            type: boolean
        do:
          - !action
            action: 选择一个必须修复的问题并说明修复方向。
            actor: agent
            artifact: !artifact
              name: 严谨性问题修复建议
              format: markdown
          - !action
            action: 在需要 human 判断时补充取舍或确认修复方向。
            actor: human
            artifact: !artifact
              name: 严谨性修复确认
              format: markdown
          - !action
            action: 根据修复方向更新结构化流程草稿。
            actor: agent
            artifact: !artifact
              name: 修复后的结构化流程草稿
              type: object
              format: yaml
    else:
      - !action
        action: 确认结构化流程草稿无需强制修复即可生成 YAML。
        actor: agent
        artifact: !artifact
          name: 结构化流程通过审查确认
  - !action
    action: 根据边界草稿、最终 Artifact 定义和结构化流程草稿生成包含 names、defines、可选 asserts、goals 和 flow 的完整 !procedure YAML。
    actor: agent
    artifact: !artifact
      name: 最终 !procedure YAML
      type: object
      format: yaml
  - !action
    action: 将初版最终 !procedure YAML 写入 memoryRoot 的 procedures 目录，使 memsphere View 可以读取该 Procedure 并支持 human review。
    actor: agent
    artifact: !artifact
      name: 写入后的初版 procedure memory 文件
      type: object
      format: yaml
  - !action
    action: 对写入初版后的 Memory Store 运行 memsphere validate，确认该 Procedure 已进入 memory 目录且语法有效。
    actor: agent
    artifact: !artifact
      name: 初版写入后校验结果
      format: markdown
  - !while
    condition: !action
      action: 判断最终 !procedure YAML 是否仍需语义调整。
      actor: human
      artifact: !artifact
        name: 最终 YAML 是否仍需语义调整
        type: boolean
    do:
      - !action
        action: 说明最终 YAML 需要调整的内容。
        actor: human
        artifact: !artifact
          name: 最终 YAML 调整意见
          format: markdown
      - !action
        action: 根据调整意见更新最终 !procedure YAML。
        actor: agent
        artifact: !artifact
          name: 调整后的最终 !procedure YAML
          type: object
          format: yaml
      - !action
        action: 将调整后的最终 !procedure YAML 同步写回 memoryRoot 的 procedures 目录。
        actor: agent
        artifact: !artifact
          name: 调整后写回的 procedure memory 文件
          type: object
          format: yaml
      - !action
        action: 对调整后写回的 Memory Store 重新运行 memsphere validate。
        actor: agent
        artifact: !artifact
          name: 调整后重新校验结果
          format: markdown
  - !action
    action: 汇总最终 Procedure Memory 的文件路径和最近一次校验结果，面向 human 说明构建完成情况。
    actor: agent
    artifact: !artifact
      name: Procedure 构建结果
      final: true
