!concept
names:
  - Statement
  - 陈述记忆
  - "!statement"
defines:
  - memsphere 中用于表达可被核查的事实、规则或约束的记忆实体。
  - 用于让记忆库明确哪些内容应当成立或被验证，不用于定义术语，也不用于描述结构模板。
  - Statement 通过 asserts 列出必须成立的断言；应用一份 Memory 时，其中全部断言都具有约束力。
  - !statement
    asserts:
      - asserts 中的每一项都必须独立成立，列表成员不是候选项或建议项。
      - 一项断言不得因为同一 Memory 中存在文本定义或 Schema 而被忽略。
      - 断言与用户输入冲突时，Agent 不得静默改写输入或继续生成违反断言的产物。
      - 无法判断断言是否成立时，Agent 应取得必要信息，而不是把未知当作成立。
