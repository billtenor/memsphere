!concept
syntax: memsphere-20260721-stable
names:
  - Concept
  - 概念
  - 概念记忆
defines:
  - memsphere 中用于解释一个可稳定复用的概念、词汇或领域抽象是什么的 Memory。
  - 用于统一记忆术语，使不同记忆和执行流程对同一概念形成一致理解。
  - Concept 的 defines 可以同时使用文本定义、匿名 Statement 和匿名 Schema 描述同一个概念；这些成员相互补充并共同生效，不是可任选其一的候选解释。
  - !statement
    asserts:
      - 一份 Concept 记忆应当围绕一个可稳定复用的词汇或领域抽象建立定义。
      - 同一 Concept 的名称与别名应当表达同一个概念，不应引入彼此冲突的含义。
      - 阅读 Concept 时必须完整读取并递归解释全部 defines 成员。
      - 文本 defines 说明概念含义和用途，匿名 Statement 补充必须成立的约束，匿名 Schema 补充实例或产物结构。
      - 需要独立判断真假的事实、规则或约束应当使用 Statement 表达。
      - 文档、数据或协作产物的结构应当使用 Schema 表达。
  - !schema
    format: yaml
    asserts:
      - 根节点必须使用 !concept 标签，不得使用独立的 type 字段。
      - "必须声明 syntax: memsphere-20260721-stable。"
      - 顶层 Concept 必须声明非空 names，或使用非空 name 作为单值简写。
      - defines 可以包含文本定义，以及带 YAML tag 的匿名嵌套记忆实体。
    fields:
      - !schema
        name: syntax
        type: string
        defines:
          - 当前 Concept 使用的不可变语法版本。
      - !schema
        names:
          - names
        type: array
        item: !schema
          type: string
        defines:
          - Concept 的规范名称与别名，首项为规范名称。
      - !schema
        names:
          - defines
        type: array
        items:
          - !schema
            type: string
          - !schema
            type: object
        defines:
          - Concept 的文本定义，以及用于补充其规则或结构的匿名嵌套记忆实体；列表中的全部成员共同定义该 Concept。
      - !schema
        names:
          - extends
        type: array
        item: !schema
          type: string
        defines:
          - 可选，Concept 所继承的上位概念。
extends:
  - Memory
