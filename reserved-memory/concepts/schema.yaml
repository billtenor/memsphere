!concept
names:
  - Schema
  - 图式记忆
  - "!schema"
defines:
  - memsphere 中用于定义文档、数据或协作产物内容结构的 Memory。
  - 用于让协作者按共同的结构填写或验证产物，不用于表达领域术语或独立事实。
  - fields 共同定义产物包含的字段；字段是结构要求，不是可以任意选择的示例项。
  - Artifact 的 type 和 format 决定值类型及编码方式，Schema 只负责 fields、element_types 和重复结构约束。
  - !statement
    asserts:
      - "当 Artifact 使用 markdown + layout: outline 时，字段名称必须成为 Markdown 标题，并按 fields 的嵌套关系形成标题层级。"
      - "当 Artifact 使用 markdown + layout: table 时，第一层 fields 必须成为 Markdown 表格列，每个列表元素占一行。"
      - Schema 的 asserts 是对实例内容和结构的自然语言附加约束，必须与 fields 一并满足，但不由代码 validator 猜测执行。
      - 按 Node 局部读取嵌套字段时，返回的根级与祖先 Schema context、Repeat 限制和目标 fragment 必须共同生效。
      - 字符串 field 只提供字段名称；嵌套 !schema 用于继续描述该字段的子结构或约束。
      - "!repeat 是供 object + markdown + layout: outline Artifact 使用的结构控制节点，它让 body 中的一组字段按同一轮次整体重复。"
      - "!repeat 的 limit 可用 min/max 约束次数；未给 min 时按 0 理解，未给 max 时表示没有业务上限。"
      - "!repeat 不允许用于 table、defines、Procedure flow 或其他位置，body 中也不能再次嵌套 !repeat。"
      - element_types 表示 Schema 描述的列表允许包含哪些元素类型；它不决定 Artifact format。
  - !schema
    asserts:
      - 根节点必须使用 !schema 标签，不得使用独立的 type 字段。
      - 顶层 Schema 的 names 必须是非空字符串数组，首项为规范名称。
    fields:
      - !schema
        names:
          - names
        element_types:
          - string
        defines:
          - Schema 的规范名称与别名，首项为规范名称。
      - !schema
        names:
          - defines
        element_types:
          - string
          - Statement
          - Schema
        defines:
          - Schema 的文本定义，以及用于补充其规则或结构的匿名嵌套记忆实体。
      - !schema
        names:
          - asserts
        element_types:
          - string
        defines:
          - 可选，实例内容和结构必须满足的附加约束。
      - !schema
        names:
          - element_types
        element_types:
          - string
        defines:
          - 可选，Schema 描述的列表允许包含的元素类型。
      - !schema
        names:
          - fields
        element_types:
          - string
          - Schema
        defines:
          - 可选，由最简字段名、嵌套 !schema 或 !repeat 重复字段组组成的子结构。
