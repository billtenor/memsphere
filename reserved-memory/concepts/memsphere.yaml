!concept
names:
  - Memsphere
  - memsphere
defines:
  - memsphere 定义了一套维护、检索和遵循 Memory 的框架，使 Agent 能够复用当前工程积累的概念、陈述、流程和图式。
  - memsphere Skill 提供与预置 Memory 一致的快速入口和冗余摘要；Memory 承载完整知识与流程，CLI 提供稳定的发现、读取和 Run 执行能力。
  - Agent 通过 memsphere memory list 发现当前工程可用的 Memory，通过 memsphere memory read 读取完整 Memory，而不依赖 Memory 当前使用文件还是其他存储后端。
  - memsphere init 由用户执行，并安装或更新当前工程的预置 Memory；实际使用时，Agent 不区分一份 Memory 是预置安装还是用户创建。
  - 需要遵循 Memory 完成任务时，Agent 必须先选择适用的 Procedure；没有专用 Procedure 时使用通用流程，再根据当前步骤按需读取 Concept、Statement 和 Schema。
