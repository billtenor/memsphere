!concept
syntax: memsphere-20260721-stable
names:
  - memsphere-procedure
  - Procedure
defines:
  - memsphere 中用于描述一个任务从开始到结束如何执行的 Memory。
  - Procedure 通过 goals 描述目标，通过 asserts 声明全局约束，并通过 flow 安排有序 Action、分支、循环和对子流程的调用；需要 Review 的 Artifact 只声明 Procedure 本地 Slot，Actor Binding 与 Decision Policy 在创建 Run 时选择。
  - Artifact Review 自动冻结当前候选之前已经上报的全部 Artifact；Reviewer 可以根据当前 Artifact 与要求按需向前追溯，不需要 Procedure 作者分类或声明证据。
  - Run 启动时冻结可用 Actor、权限、Agent 运行配置和初始 Slot Binding；Runner 可以通过显式、受校验且带审计记录的运行期换绑操作修改未来尚未创建的 Review，已经创建的 Review、Round 和 Assignment 始终保留创建时的 Binding。
  - 同一个 Procedure 可以被多次执行，每次执行形成相互独立的 Run；创建者必须为每个新 Run 提供本次执行的名称，Run 同时记录 Procedure 名称、当前步骤、步骤产物和最终交付物。
  - !statement
    asserts:
      - 需要使用 memsphere 遵循 Memory 完成任务时，必须先选择适用的 Procedure，并完整读取或按 Node 读取执行任务所需的内容。
      - 存在适用的专用 Procedure 时必须优先使用；没有适用的专用 Procedure 时使用 memsphere-general-task-execution。
      - Agent 必须使用 memsphere run start 启动 Procedure，并通过必填的 --name 为本次 Run 指定非空名称；只执行 CLI 当前返回的步骤，不得提前执行尚未返回的步骤。
      - Run 名称是用户可读的单次执行名称，Procedure 名称是流程定义名称；二者都不能替代 run id。启动 Run 后必须保存 run id；后续 run report、run enter-schema 和 run repeat 必须显式传入该 id，不得凭名称猜测或混用其他 Run。
      - Run 启动时会冻结当前 config.json 的工作语言；后续状态、下一步命令、权限说明和 Review 反馈均按该语言输出，修改配置只影响之后创建的 Run。
      - CLI 返回的 Procedure Asserts 是当前调用链中持续生效的全局约束，Asserts 是当前步骤必须满足的要求，Suggests 是执行时可以参考但不强制满足的建议。
      - 当前步骤提示中的 Do 表示 Agent 当前动作，Agent 步骤不重复展示执行者；Ask human to do 表示必须暂停并等待 Human 操作。Details 提供补充上下文，Artifact 规定步骤产物及其格式，Then 给出下一条命令。
      - 每个 Action 都必须产生明确的 Artifact；Actor 为 human 时，Agent 必须等待 human 提供结果后再上报和继续。
      - 短内容使用 memsphere run report 的 --artifact 上报，文件产物使用 --artifact-file 上报；带 Schema 的结构化 Markdown 产物可以按照 Then 提示进入 Schema 填写流程。
      - Agent 执行任何 memsphere run report 时必须请求宿主在沙盒外运行；当有效 Artifact 将发起 Review 时，CLI 会在创建 Review 或修改 Run 前检查 Report 执行能力，受限环境中失败后必须以完全相同的命令申请提升权限重试，不得修改参数规避门禁。
      - 进入 Schema 填写流程后，首次概览和 run schema show 提供父 Action、父 Artifact 内容契约、完整字段进度与约束来源；这些生产提示不得混入 Review 参与者、权限、投票或轮次信息。
      - Schema 字段每次 report 都会更新同一份受管累计草稿；全部字段完成后 Run 必须停在全局调整状态，由 Runner 阅读并直接编辑 CLI 返回的草稿路径，再使用 --artifact-file 显式提交同一文件。
      - Schema 最终文件显式提交并通过结构与契约校验后，Run 才按照父 Artifact 契约决定直接接纳或进入 Artifact Review；执行者只需继续遵循 CLI 返回的 Then，不得自行提前发起或跳过 Review。
      - Human 在 View 的 Artifact Review 浮窗中按 Round 查看不可变 Submission、正式 Comment、Vote、Result 与 Revision Summary；只有当前 Round 的本人 Assignment 可编辑，历史 Round 只读，完成后仍可从对应步骤重新打开评审证据。
      - Agent Reviewer 在同一 Artifact Review 浮窗的参与者行中展示状态、最近活动及按 attempt 隔离的只读运行记录；Agent 不进入 Human 身份选择器，实际发送的 prompt、ACP update 和生命周期以 JSONL 事实来源随 Run 留存，View 只读取不含 prompt 正文的可校验、可重建过滤投影。
      - Artifact Review 的定位 Comment 必须绑定创建时的 Submission 与 digest；它不评论 Memory 或 Workspace 文件，也不会自动迁移到下一轮 Submission。
      - Human 完成前序流程后若不再参与后续 Review，Runner 可以先用 memsphere run binding show 查看冻结 Actor 与当前 Binding，再用 memsphere run binding update 为完整 Slot key 选择一个或多个 --actor，或使用 --skip；只能选择 Run 启动时冻结的 Actor，换绑只影响尚未创建的 Review。
      - 配置 control_plane 后，每个 Artifact 都必须通过 Runner 的 artifact.submit 鉴权；正常的当前步骤提示不展开权限清单，权限不足时只说明被拒绝的操作、所需权限和处理方式；拒绝不会改变 Run 状态或写入 Artifact。
      - run report 成功后先返回只确认本次 Run、Artifact 和可选 Review 标识的上报回执；触发 Review 时再返回等待或投票指令，不在 report 阶段提前输出 Review 汇总。run review wait 负责返回当前轮次汇总及投票指令；run review vote 只确认投票结果并返回推进后的下一步，不重复完整汇总。
      - 完成当前步骤后，必须按照 CLI 返回的 Then 命令上报 Artifact；只有 CLI 明确返回 Run 完成状态后才能汇报流程完成和最终产物。
  - !ref
    target: schemas/memsphere-procedure-schema
