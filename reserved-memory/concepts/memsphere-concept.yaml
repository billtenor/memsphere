!concept
syntax: memsphere-20260721-stable
names:
  - memsphere-concept
  - Concept
defines:
  - memsphere 中用于解释一个可稳定复用的概念、词汇或领域抽象是什么的 Memory。
  - 用于统一记忆术语，使不同记忆和执行流程对同一概念形成一致理解。
  - Concept 的 defines 只使用文本描述概念含义、用途和边界；需要独立核查的规则和内容结构分别由 Statement 与 Schema 表达。
  - Concept 的合法 YAML 结构由 memsphere-concept-schema 定义。
extends:
  - memsphere-memory
