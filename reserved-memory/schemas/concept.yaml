!schema
syntax: memsphere-20260721-stable
names:
  - Concept entity schema
  - "!concept 编写模板"
format: yaml
defines:
  - 定义 memsphere !concept Memory 的合法内容结构和字段要求。
asserts:
  - 根节点必须使用 !concept 标签，不得使用独立的 type 字段。
  - "必须声明 syntax: memsphere-20260721-stable。"
  - 必须声明非空 names，或使用非空 name 作为单值简写。
  - defines 可以包含字符串、!statement 或 !schema；嵌套结构必须携带 YAML tag。
  - extends 如出现，必须是字符串数组。
fields:
  - !schema
    name: syntax
    type: string
    defines:
      - 必填，当前 Memory 使用的不可变语法版本；本 Schema 要求 memsphere-20260721-stable。
  - !schema
    names:
      - names
    type: array
    item: !schema
      type: string
    defines:
      - 概念名称与别名，首项为规范名称。
  - !schema
    names:
      - defines
    type: array
    items:
      - !schema
        type: string
      - !schema
        type: object
    defines:
      - 对概念语义的文本定义，以及用于补充规则或结构的匿名 Statement、Schema；全部成员共同生效。
  - !schema
    names:
      - extends
    type: array
    item: !schema
      type: string
    defines:
      - 可选，概念所继承的上位概念。
