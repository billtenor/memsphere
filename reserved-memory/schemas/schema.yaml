!schema
syntax: memsphere-20260721-stable
names:
  - Schema entity schema
  - "!schema 编写模板"
format: yaml
defines:
  - 定义 memsphere !schema Memory 的合法内容结构和字段要求。
asserts:
  - 根节点必须使用 !schema 标签。
  - "必须声明 syntax: memsphere-20260721-stable。"
  - 必须声明非空 names，或使用非空 name 作为单值简写。
  - defines 可以包含字符串、!statement 或 !schema；嵌套结构必须携带 YAML tag。
  - type 不继承父层；显式声明优先，省略时有 fields 推断为 object、无 fields 推断为 string。
  - format 显式声明优先，省略时继承父 Schema 或所属 Artifact；Markdown layout 只由兼容的 object outline 或 array table 结构节点保留，标量字段不继承 layout。
  - fields 如出现，可以包含表示最简字段名的字符串、带 !schema tag 的详细字段，或带 !repeat tag 的重复字段组；只允许 object Schema 使用。
  - array Schema 可以使用 item 声明唯一元素 Schema，或使用 items 声明至少两个候选 Schema；二者互斥。
  - "!repeat 只能供 object + markdown + layout: outline Artifact 使用；body 必须非空，只能包含字符串或 !schema，不能嵌套 !repeat。"
  - "!repeat.limit 如出现，必须至少包含非负整数 min 或 max；两者同时存在时 min 不能大于 max。"
  - fields 中的 !schema 必须具有非空 name/names；defines 与 item/items 中的匿名 !schema 可以省略名称，但必须包含有意义的结构。
fields:
  - !schema
    name: syntax
    type: string
    defines:
      - 必填，当前 Memory 使用的不可变语法版本；本 Schema 要求 memsphere-20260721-stable。
  - !schema
    names:
      - names
    type: array
    item: !schema
      type: string
    defines:
      - 结构名称与别名，首项为规范名称。
  - !schema
    names:
      - defines
    type: array
    items:
      - !schema
        type: string
      - !schema
        type: object
    defines:
      - 对结构语义的文本说明，以及用于补充规则或结构的匿名 Statement、Schema；全部成员共同生效。
  - !schema
    names:
      - asserts
    type: array
    item: !schema
      type: string
    defines:
      - 可选，内容、书写或校验要求。
  - !schema
    names:
      - type
    defines:
      - 可选，本层 Schema 的值类型；不继承父层，省略时根据 fields 推断 object 或 string。
  - !schema
    names:
      - format
    defines:
      - 可选，本层 Schema 的编码格式及格式参数；省略时继承父层兼容的格式上下文。
  - !schema
    names:
      - fields
    type: array
    items:
      - !schema
        type: string
      - !schema
        type: object
    defines:
      - 可选，由简写字段名、嵌套 !schema 节点或 !repeat 重复字段组组成的子结构。
      - "!repeat 的结构为 { limit?: { min?: number, max?: number }, body: List<string | Schema> }；body 作为整体重复。"
  - !schema
    names:
      - item
    type: object
    defines:
      - 可选，array 的唯一元素 Schema 契约。
  - !schema
    names:
      - items
    type: array
    item: !schema
      type: object
    defines:
      - 可选，由至少两个候选 Schema 组成的联合元素契约；与 item 互斥。
