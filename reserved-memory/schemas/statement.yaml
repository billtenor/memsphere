!schema
names:
  - Statement entity schema
  - "!statement 编写模板"
defines:
  - 定义 memsphere !statement Memory 的合法内容结构和字段要求。
asserts:
  - 根节点必须使用 !statement 标签，不得使用独立的 type 字段。
  - names 必须是非空字符串数组，首项为规范名称。
  - defines 可以包含字符串、!statement 或 !schema；嵌套结构必须携带 YAML tag。
  - asserts、suggests 和 sections 如出现，必须是非空数组；每个 Statement 节点必须至少包含其中一个。
  - suggests 不得削弱或替代 asserts。
  - sections 的每个成员必须携带 !statement tag 和非空 names，并递归遵循本 Schema。
  - 同一父节点下各 section 的首个规范名称不得重复。
  - 一个节点可以同时包含 asserts、suggests 和 sections；sections 只组织内容，不改变规则生效语义。
fields:
  - !schema
    names:
      - names
    element_types:
      - string
    defines:
      - 陈述主题的名称与别名，首项为规范名称。
  - !schema
    names:
      - defines
    element_types:
      - string
      - Statement
      - Schema
    defines:
      - 对陈述主题的文本说明，以及用于补充规则或结构的匿名 Statement、Schema；全部成员共同生效。
  - !schema
    names:
      - asserts
    element_types:
      - string
    defines:
      - 必须成立或需要被验证的事实、规则或约束。
  - !schema
    names:
      - suggests
    element_types:
      - string
    defines:
      - 可选，执行时可以参考但不强制满足的建议。
  - !schema
    names:
      - sections
    element_types:
      - Statement
    defines:
      - 可选，用有名称的内嵌 Statement 节点递归组织规则；同级规范名称必须唯一。
