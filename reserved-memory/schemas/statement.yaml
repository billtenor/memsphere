!schema
names:
  - Statement entity schema
  - "!statement 编写模板"
format: outline
defines:
  - 描述 memsphere !statement 记忆实体的合法结构。
asserts:
  - 根节点必须使用 !statement 标签，不得使用独立的 type 字段。
  - names 必须是非空字符串数组，首项为规范名称。
  - defines 可以包含字符串、!statement 或 !schema；嵌套结构必须携带 YAML tag。
  - asserts 必须是非空的可核查断言数组。
fields:
  - !schema
    names:
      - names
    items:
      - string
    defines:
      - 陈述主题的名称与别名，首项为规范名称。
  - !schema
    names:
      - defines
    items:
      - string
      - Statement
      - Schema
    defines:
      - 对陈述主题的文本说明，以及用于补充规则或结构的匿名 Statement、Schema。
  - !schema
    names:
      - asserts
    items:
      - string
    defines:
      - 必须成立或需要被验证的事实、规则或约束。
