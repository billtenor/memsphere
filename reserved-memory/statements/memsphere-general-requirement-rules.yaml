!statement
syntax: memsphere-20260721-stable
names:
  - 通用需求规范
  - memsphere-general-requirement-rules
defines:
  - 规定软件需求进入开发前必须明确的内容和兼容性决策。
asserts:
  - 需求文档必须明确目标、当前迭代范围、非本轮范围、交付物、验收标准和待确认项。
  - 验收标准必须可观察、可验证，并能够判断当前迭代是否完成。
  - 已确认的范围、交付物或验收标准发生变化时，必须更新需求文档并重新确认。
sections:
  - !statement
    names:
      - 向前兼容
    asserts:
      - 需求文档必须通过独立且醒目的章节或字段明确写出“需要向前兼容”或“不需要向前兼容”。
      - 是否需要向前兼容，必须以本轮修改是否会中断用户对既有行为、数据、配置、CLI、API 或其他公开契约的使用为判断依据。
      - 需要向前兼容时，必须说明兼容范围并将其纳入验收标准。
      - 不需要向前兼容时，必须说明允许破坏的范围，以及既有内容是否需要迁移、重建或废弃。
