!statement
syntax: memsphere-20260721-stable
names:
  - memsphere-general-development-rules
  - 通用开发规范
defines:
  - 规定软件需求实施过程中的通用开发要求。
asserts:
  - 开发必须以已确认的需求、实施方案和开发计划为依据；需要改变已确认内容时，必须先完成同等确认。
  - 开发前必须了解受影响代码、现有架构和适用的仓库规范，并沿用合理的既有模式。
  - 修改必须限定在当前需求范围内，不得夹带无关重构或行为变更。
  - 实现必须完整处理当前需求涉及的正常路径、失败路径和边界情况。
  - 用户可见行为、公开接口、配置或使用方式发生变化时，必须同步更新相关文档、示例和契约说明。
  - 完成开发后必须记录修改范围、关键实现、行为与兼容性影响，以及仍未解决的问题。
