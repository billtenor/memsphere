!statement
names:
  - Memory 撰写规则
  - 记忆撰写规则
  - Memory authoring rules
defines:
  - 约束 Agent 在创建或编辑 Memory 时选择、归位和压缩内容，避免信息噪声掩盖有效约束。
sections:
  - !statement
    names:
      - 内容取舍
    asserts:
      - 只写入会改变理解、判断、执行或验收的内容；省略后不影响结果的文字必须删除。
      - 不重复 Memsphere 基础语义、其他 Memory 已明确的规则或通用工作常识，除非当前主题存在例外。
      - 不得把未经 human 确认或可靠来源支持的推测和偏好写成规则。

  - !statement
    names:
      - 语义归位
    asserts:
      - 定义与边界写入 defines，强制要求写入 asserts，可选做法写入 suggests，结构写入 Schema，执行顺序写入 Procedure flow。
      - 约束必须放在最小生效范围；全程约束位于根节点，局部约束位于对应的 Action 或 Statement section。
      - 同一主题的规则应集中表达并用 sections 分类，无关主题应放入其他 Memory。

  - !statement
    names:
      - 表述与检查
    asserts:
      - 每条 assert 只表达一个可判断的要求，并明确其适用对象、条件或结果。
      - 必须合并重复规则，删除铺垫、穷举式例子和不改变要求的修饰。
      - 使用足以准确表达约束的最短文字，不得用抽象口号替代可执行要求。
      - 完成后必须检查内容无重复、矛盾和语义错位，并通过 memsphere validate。
