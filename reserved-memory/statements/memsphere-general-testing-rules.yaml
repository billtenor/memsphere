!statement
syntax: memsphere-20260721-stable
names:
  - memsphere-general-testing-rules
  - 通用测试规范
defines:
  - 规定软件变更交付前的通用测试和验证要求。
asserts:
  - 代码行为发生变化时，必须补充或更新能够覆盖该行为的测试；修复缺陷时必须增加能够复现原问题的回归测试。
  - 测试必须覆盖本轮变更涉及的正常路径，以及相关的失败路径和边界情况。
  - 必须先执行与改动直接相关的针对性验证，再执行项目规定且与本次交付相关的完整检查。
  - 不得通过删除、跳过或弱化有效测试和断言来使验证通过。
  - 必须记录本轮实际执行的命令、结果和未执行项，不得用历史结果代替当前验证。
  - 验证失败时必须区分本轮变更导致的失败、既有失败和环境阻塞；存在阻塞交付的问题时不得声称验证通过。
