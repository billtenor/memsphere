!statement
syntax: memsphere-20261027-stable
names:
  - memsphere-concept-writing-rules
  - Concept 撰写规范
defines:
  - 用于编写和评审 Concept，使不同读者对同一概念形成一致理解。
asserts:
  - Concept 解释概念是什么。正文应围绕含义、用途、边界和必要关系组织，而不是收集所有与它有关的描述。
  - 保留一段内容，应能说明它解决了什么理解上的歧义。不能帮助读者识别概念、区分相近概念或理解其关系的内容，不应仅因与主题有关而加入。
  - 可独立核查的事实与规则由 Statement 表达，执行步骤由 Procedure 表达，内容结构由 Schema 表达。概念本身的边界仍可直接解释，不能只按“必须”“不能”等措辞判断内容归属。
  - 定义使用清楚且一致的术语；依赖其他概念时说明必要关系，并以其 canonical name 指向已有定义，避免重复展开。extends 只表达上位概念，不表达一般关联。
  - 评审时检查正文是否足以达成一致理解，同时删除重复、过时和无助于理解的描述。移出的有效规则先核对已有归属；确有独立保留价值且没有归属时，再沉淀到对应 Memory。
suggests:
  - 先直接说明概念的核心含义，再补充容易混淆的边界；只有文字解释仍有歧义时才补充例子。
  - 篇幅和条数由需要澄清的含义决定，不设置固定配额，也不为凑齐模板增加内容。
