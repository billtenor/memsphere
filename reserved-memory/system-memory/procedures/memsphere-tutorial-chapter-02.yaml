!procedure
syntax: memsphere-20260721-stable
names:
  - memsphere-tutorial-chapter-02
  - memsphere 教学流程-第二章
defines:
  - 帮助 Human 获得一个个性化 Procedure，在 ChangeSet 中把它准备好，然后启动并完成一次 Run。
  - 个性化 Procedure 可以由 Human 提供，也可以从 Memory 市场导入。
asserts:
  - 全章只使用四个顶层循环：准备环境、提供个性化流程、准备个性化流程、运行个性化流程。
  - 只修改本章个性化流程直接需要的 User Memory，不得修改 System Memory、Mounted Memory 或无关 Memory。
  - 未经 Human 明确同意，不得 publish、commit、push、merge 或废弃 ChangeSet。
  - Human 提问时，先读取相关 Memory。Memory 中没有答案时，明确说明不知道。
  - 本章不讲配置中心、定时执行或完整 Git/PR 流程。
goals:
  - 让 Human 知道如何提供自己的执行流程，或从 Memory 市场导入一个流程。
  - 让 Human 学会在 ChangeSet 页面查看候选流程并提交 Comment。
  - 让 Human 学会启动流程，并在 Run 页面查看状态和提交 Review。
flow:
  - !while
    condition: !action
      action: 检查环境是否还没有准备就绪。
      actor: agent
      asserts:
        - 检查 memsphere CLI、memsphere Skill、Primary Project、Project 类型、Memory Store、正式 Memory 校验、View 地址，以及冲突中的 Memory 修改或 active ChangeSet。
        - Mounted Project 只能读取，不能作为修改目标。
        - 还有问题时继续准备；全部准备好后结束本循环。
      artifact: !artifact
        name: 环境是否还没准备好
        type: boolean
    do:
      - !action
        action: 解决 Agent 可以安全解决的环境问题，并告诉 Human 还需要做什么。
        actor: agent
        asserts:
          - 不得猜测 Human 想使用哪个 Project。
          - 不得覆盖、暂存、提交或清理已有工作区内容。
          - 需要 Human 操作时，说明具体操作和完成后的确认方法。
        artifact: !artifact
          name: 环境准备说明
          format: markdown
      - !action
        action: 完成 Agent 提出的环境操作；如果不需要操作，确认环境可以继续使用。
        actor: human
        artifact: !artifact
          name: Human 的环境准备结果
          format: markdown

  - !while
    condition: !action
      action: 检查 Human 是否还没有提供一个想使用的个性化流程。
      actor: agent
      asserts:
        - Human 提供了自己的流程说明，或提供了 Memory 市场导入时创建的 ChangeSet id 后，结束本循环。
        - 只有想法但还没有说明流程如何执行时，继续引导。
      artifact: !artifact
        name: 是否还没有个性化流程
        type: boolean
    do:
      - !action
        action: 引导 Human 描述自己的执行流程，或者引导 Human 从 Memory 市场选择并导入一个 Procedure。
        actor: agent
        asserts:
          - Human 描述自己的流程时，只询问开始条件、主要步骤、需要 Human 决定的地方和结束结果。
          - 从 Memory 市场导入 Procedure 后，引导 Human 复制导入时创建的 ChangeSet id 并发给 Agent。
          - 不要求 Human 编写 YAML 或选择 Memory 类型。
        artifact: !artifact
          name: 提供个性化流程的方法
          format: markdown
      - !action
        action: 描述一个自己想使用的执行流程；或者从 Memory 市场导入 Procedure，并把导入时创建的 ChangeSet id 发给 Agent。
        actor: human
        artifact: !artifact
          name: Human 提供的个性化流程
          format: markdown

  - !while
    condition: !action
      action: 检查 Human 提供的个性化流程是否还没有准备就绪。
      actor: agent
      asserts:
        - 还没有生成通过校验的候选 Procedure，或 Human 回复已经提交 Comment 时，继续。
        - 候选 Procedure 已通过校验，且 Human 回复没有 Comment 时，结束本循环。
      artifact: !artifact
        name: 个性化流程是否还没准备好
        type: boolean
    do:
      - !action
        action: 根据 Human 提供的流程、Memory 市场导入的 ChangeSet 或上一轮 Comment，创建或修改个性化 Procedure，并校验同一个 ChangeSet。
        actor: agent
        asserts:
          - Human 描述自己的流程时，第一次修改创建或定位 ChangeSet；后续修改继续使用同一个 ChangeSet。
          - Human 提供 Memory 市场导入生成的 ChangeSet id 时，claim 并使用这个 ChangeSet，不得另建 ChangeSet。
          - 有待处理 Comment 时，先 claim 当前 ChangeSet，根据 Comment 修改候选内容，重新 validate，再 finish 已处理的 Comment。
          - 使用 `memsphere memory change validate [change-id]`；普通 `memsphere validate` 不能代替。
          - Agent 负责编辑 YAML，Human 不需要查看或手写 YAML。
        artifact: !artifact
          name: 已校验的个性化 Procedure
          type: object
          format: yaml
      - !action
        action: 把 ChangeSet 的链接和 id 发给 Human，请 Human 查看个性化 Procedure；内容有问题时，在对应位置提交 Comment。
        actor: agent
        asserts:
          - 不得要求 Human 查看或编辑 YAML。
          - 说明 Comment 用来修改长期保存的 Procedure。
        artifact: !artifact
          name: ChangeSet 查看说明
          format: markdown
      - !action
        action: 查看 ChangeSet 页面，然后回复“已提交 Comment”或“没有 Comment”。
        actor: human
        artifact: !artifact
          name: Human 的 ChangeSet 检查结果
          format: markdown

  - !action
    action: 发送“请启动 <个性化流程名称> 流程”，请求 Agent 启动刚刚准备好的个性化流程。
    actor: human
    artifact: !artifact
      name: Human 的流程启动请求
      format: markdown

  - !while
    condition: !action
      action: 检查个性化流程是否还没有运行结束。
      actor: agent
      asserts:
        - 还没有创建 Run，Run 正在执行，或 Review 要求修改时，继续。
        - Run 明确显示 done 或 abandoned 后，结束本循环。
      artifact: !artifact
        name: 个性化流程是否还没运行结束
        type: boolean
    do:
      - !action
        action: 根据 Human 的启动请求创建 Run，或继续处理同一个 Run，并把 Run 链接发给 Human。
        actor: agent
        asserts:
          - 第一次执行时使用 `memsphere run start <procedure> --change <change-id> --name <name>` 启动一次候选 Run，并保存 run_id。
          - 后续循环必须继续同一个 run_id，不得重复启动。
          - 严格执行 Run 当前返回的步骤，不得提前执行后续步骤。
        artifact: !artifact
          name: 个性化流程运行状态
          format: markdown
      - !action
        action: 打开 Run 页面查看当前状态；如果页面要求 Review，提交 Review 意见，然后把结果告诉 Agent。
        actor: human
        artifact: !artifact
          name: Human 的 Run 检查结果
          format: markdown

  - !action
    action: 总结 Human 使用的个性化流程、ChangeSet 检查结果、Run 的最终状态，以及 Human 在本章学会的操作。
    actor: agent
    asserts:
      - 用简单语言说明 Procedure、ChangeSet、Comment、Run 和 Review 在本章中分别做了什么。
      - 提供本章实际使用的 ChangeSet id 和 run_id。
    artifact: !artifact
      name: memsphere 教学第二章完成摘要
      format: markdown
      final: true
