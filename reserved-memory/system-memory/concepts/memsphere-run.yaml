!concept
syntax: memsphere-20261027-stable
names:
  - memsphere-run
  - Run
defines:
  - 一次有名称、有状态且可追溯的运行，可执行 Procedure，也可承载 Agent 自由探索。
  - Procedure 是可复用的流程定义，Run 是一次具体执行。流程执行按 Procedure 的 flow 过程或 graph 依赖展开，自由探索模式围绕逐步形成的产物及其依赖关系展开。
  - Step 是某个 Action 的执行实例。自由探索中的 Artifact 是围绕明确目的组织、可独立阅读或使用，并值得供后续引用、评审、修订或交付保留的一份结果；External 是引用的外部资料，Review 是对产物的评审或反馈。Run 将这些对象组织为同一次运行的上下文。
  - Runner 是 Memsphere 在当前通用 Agent 框架中的实际执行者。只使用主 Agent 时由主 Agent 执行；启用子 Agent 时，主 Agent 和子 Agent 共同构成 Runner，内部如何分工由 Agent 框架管理。
  - Action 的 actor 只区分 human 与 agent；human 表示由人完成该步骤，agent 表示由 Runner 执行。
  - 流程运行的 Memory 快照是本次执行所依据的记忆内容，使执行记录与当时的流程定义相对应。
  - Run 的 running、done 和 abandoned 分别表示进行中、已完成和已废弃；归档表示结束后的运行收存于历史视图，恢复归档表示重新展示原运行记录。
  - 当前成果是一组代表本次运行结果的 Artifact，其依赖关系解释成果如何形成；历史修订保留先前的产物及其关联。
  - graph 执行时在依赖满足后立即创建 pending Step；enter 首次转为 running 并返回实际工作 Prompt，重复 enter 复用实例及开始时间，show 只读。正式上报后有评审则 awaiting_review，无评审或评审接纳后 done；评审要求修改回到同一 running Step，修订新建 Artifact 与轮次。
  - graph 当前只有一个可执行 Step 时自动 enter，多个时展示 Step 概述并由 Agent 显式选择；Continue 由当前 Agent 会话定位，候选评审和修订期间固定 Project、Run、Step，接纳后前台正式进入后继才更新绑定；身份模式 status/wait 不自动 enter。跨 Step 并发由宿主 Agent 框架管理。
  - "graphFrame 是 Run.frames 的 type: graph 扩展，保存触发、汇合、待物化实例、已分发完成和序号；不另加 mode 或全局业务状态。完成序与创建序分开，collect 固定成员按 Step 创建序排列。"
  - graph 的 run status 可以恢复和推进；列表、run show、step show、View 详情只读。Run 只有全部 Step 完成且没有未齐 Join 才能 finish，终态归档和恢复保留模型 Store 内的原证据。
  - 自由探索上报 Artifact 后仍为 running，可在同一 Run 接收反馈与完整修订；Human 明确确认当前成果并同意结束后才进入 done。Agent 结束当前回复等待人工检查与结束 Run 是不同的决定。
  - graph 的当前有效 Step 与历史 Step 分开判断。回溯以具体 Step ID 追加替代记录，保存实际触发来源；已消费汇合中的独立输入按 processedStepIds 的实际派发顺序恢复，不用创建序或预留完成序猜测。
  - collect 回溯只收集当前有效的已接纳产物；控制来源独立且成员被替代时，等待替代成员路径完成或条件消除后再释放控制信号。原生空集合仍合法。存在恢复 intent、等待 collect 或有效未完成步骤时不能结束 Run。
  - 回溯执行保留 Continue 原绑定，新 pending 目标须显式 run step enter；status 恢复、独立分支上报或评审完成均不得自动进入或改绑到该目标；旧上下文提交被拒绝。run status 恢复同一替代 Step 及取消进程 intent，不再次回溯。旧评审草稿、已提交票与材料保留，未提交评审取消；确认旧 Reviewer 进程组退出后才清除取消 intent。
  - collect 的同一 Action/依赖恢复槽合并所有受影响成员的替代根与具体成员来源；连续回溯独立成员或控制来源时更新同一等待。历史和新控制到达按实际派发顺序保留各来源最新有效信号，普通 dispatch 也须等待，成员接纳或条件消除后只释放一次。等待追踪实际控制来源，并覆盖新条件选中的同一 collect 声明成员及其前置路径，不限于旧集合已有的成员 Action，同时覆盖尚未释放的上游 collect；控制替代路径被条件消除且相关等待收敛后撤销恢复槽，不生成新的 collect 或下游步骤。
  - collect 的成员集合与当时已观测的成员路径触发来源一起固定，包含 false 条件及空中间聚合；物化重试复用同一集合，来源随历史保留而不随恢复槽清除；同槽历史成员路径与条件来源合并保存在等待中，以支持多个独立条件根连续回溯。回溯空集合的条件来源时，相关聚合及下游退出有效链；影响闭包和等待前沿使用同一具体实例来源，空中间聚合仍派发有效控制时，必须继续等待其后继成员正式完成；历史缺少足够成员或条件来源证据时拒绝相关回溯。
  - CLI run step rewind 指定 --output json 时，参数与运行时错误也以 stderr 上的结构化 JSON 返回，包含 error.code 和 message，stdout 为空且退出码非零；默认文本输出保留可读诊断。
