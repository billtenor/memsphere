!concept
syntax: memsphere-20261027-stable
names:
  - memsphere-framework
  - Memsphere
defines:
  - Memsphere 是个性化软件的运行环境，组织可跨对话、模型和 Agent 积累的软件资产，让软件从自然语言开始，并在真实使用中持续演化。
  - Memsphere 不是 Agent，而是运行在通用 Agent 之上的一层。Agent 理解意图并执行工作；Memsphere 为其提供可持续使用和演进的软件语义、运行记录与资产管理。
  - 个性化软件由 Memory、个性化 CLI、数据和界面协作构成。Memory 承载可复用的语义与流程，CLI 提供确定性的执行能力，数据保存业务状态，界面支持人的使用与协作；这些资产不要求一次建齐。memsphere-personalized-software 定义这一软件形态及其算力分工。
  - App 是组织完整功能的软件单元，Project 是承载 App、独立 Memory、配置、数据和运行记录的持久空间。App 与 Project 分别表达功能组合和使用范围，具体含义见 memsphere-app。
  - Run 保存一次工作的上下文、产物及运行记录，使结果可追溯并用于后续工作；它可以执行 Procedure，也可以承载自由探索，具体含义见 memsphere-run。
  - Memsphere Skill 是 Agent 进入 Memsphere 的使用入口；Memory 提供可复用的知识与流程，Memsphere CLI 提供发现、读取、运行与管理这些资产的能力。
