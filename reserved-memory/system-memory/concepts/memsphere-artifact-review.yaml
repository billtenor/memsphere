!concept
syntax: memsphere-20260721-stable
names:
  - memsphere-artifact-review
  - Artifact Review
  - 产物评审
defines:
  - 流程执行 Run 中针对某次不可变 Artifact Submission 的正式评审，用于让 Human 或 Agent 从不同视角检查产物。
  - Review Slot 是 Procedure 声明的评审视角；Binding 是 Run 中评审视角与实际 Actor 的对应关系。
  - Round 是围绕同一份 Submission 的一轮评审，关联当时的材料、参与者与评审配置；Assignment 是其中分配给单个 Reviewer 的评审任务。
  - Comment 表达具体评审意见，Vote 表达参与者的评审结论；Decision Policy 表达这些结论的汇总方式。
  - Reviewer 负责审查产物并形成意见，Runner 负责产物的生产、修订和接纳决定。产物修订对应新的 Submission 和 Round，历史材料与评审记录保留原有对应关系。
  - Human 委托 Runner 提交的评审仍归属于 Human；Runner 是该次提交的受托执行者。
  - Artifact Review Comment 与用于修改长期 Memory 的 ChangeSet Comment 是两种不同对象。
  - 自由探索中的轻量 Review 是产物的评论记录，不具有正式评审的 Round、Assignment 和 Vote，也不构成产物接纳门禁。
