!concept
names:
  - 记账
  - 记账记录
defines:
  - 一条记账记录表示一次收入或支出的发生情况，用于后续汇总和核对资金变化。
  - !statement
    asserts:
      - 金额必须大于零。
      - 日期不能为空，并使用 YYYY-MM-DD 格式。
      - 类型只能是“收入”或“支出”。
      - 备注不能为空，必须描述本次收入或支出的具体内容。
      - 记账实例必须以 Markdown 文件保存到 artifacts/bookkeeping.md。
      - 缺少任一必填字段时，不得猜测或创建记账实例，应请求用户补充缺失信息。
      - 用户信息违反记账约束时，不得创建记账实例，应指出冲突的约束。
  - !schema
    format: outline
    asserts:
      - 日期、类型、金额、分类和备注均不能为空。
    fields:
      - 日期
      - 类型
      - 金额
      - 分类
      - 备注
