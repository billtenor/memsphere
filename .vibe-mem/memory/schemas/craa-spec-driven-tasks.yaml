!schema
names:
  - "craa-spec-driven-tasks"
  - "tasks.md"
  - "CRAA Tasks Document"
  - "CRAA 开发任务清单"
defines:
  - "CRAA OpenSpec 流程中的开发任务清单图式。"
  - "用于把 specs 的行为要求、design 的技术方案和 test 的验证方案拆解成可执行、可追踪、可验证的实现任务。"
asserts:
  - |-
    Tasks 用来拆解实现工作，供 apply 阶段逐项执行和勾选。
    
    格式要求：
    - 必须使用 checkbox：`- [ ]`
    - 建议按依赖顺序分组
    - 每个任务要小到一个开发会话内可完成
    - 每个任务都应可验证，能判断什么时候完成
    - 不要把多个无法一起验证的大动作塞进同一个 checkbox
    
    任务应参考：
    - specs：要实现什么行为
    - design：按什么方案实现
    - test：需要完成哪些关键验证
fields:
  - !schema
    names:
      - "1. <任务分组名称>"
    asserts:
      - |-
        示例分组：
        - 工程初始化
        - 核心模型 / 接口
        - 业务实现
        - 错误处理与安全
        - 可观测性
        - 文档与验证
      - |-
        - [ ] 1.1 <可独立完成且可验证的任务>
        - [ ] 1.2 <可独立完成且可验证的任务>
  - !schema
    names:
      - "2. <任务分组名称>"
    asserts:
      - |-
        - [ ] 2.1 <可独立完成且可验证的任务>
        - [ ] 2.2 <可独立完成且可验证的任务>
  - !schema
    names:
      - "3. 验证"
    asserts:
      - |-
        根据变更类型填写验证项。
        
        Go 代码默认验证入口优先使用仓库约定的 `make test_local`。
        Java 子工程应列出 Maven test/package/build.sh 等对应验证入口。
        测试任务应来自 test.md 的关键验证场景、失败场景验证、兼容性与通过标准。
        如果某项验证无法执行，需要在最终交付说明中写清楚原因。
      - |-
        - [ ] 3.1 <运行相关单元测试、模块测试或链路测试>
        - [ ] 3.2 <运行构建或打包验证>
        - [ ] 3.3 <更新文档或 MR 验证说明>
