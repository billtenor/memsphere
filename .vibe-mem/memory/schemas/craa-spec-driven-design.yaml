!schema
names:
  - "craa-spec-driven-design"
  - "design.md"
  - "CRAA Design Document"
  - "CRAA 技术方案文档"
defines:
  - "CRAA OpenSpec 流程中的技术方案文档图式。"
  - "用于说明 proposal 边界内如何可靠落地，以及为什么这样设计。"
fields:
  - !schema
    names:
      - "1. 设计摘要"
    asserts:
      - |-
        用较短篇幅帮助 reviewer 快速判断这份技术方案在解决什么问题、采用什么路线、最大风险在哪里。
        
        应该写：
        - 一句话方案结论
        - 最关键的 3-5 个设计点
        - 最大技术约束或最大风险
        - 本文档依赖的 proposal/specs
  - !schema
    names:
      - "2. 技术约束"
    asserts:
      - |-
        本节强调“方案必须在什么约束下成立”，不要重复 proposal 的业务背景。
        
        应该写：
        - 当前架构、当前链路、当前数据模型中会约束方案的事实
        - 平台版本、运行环境、部署方式、构建方式等约束
        - 现有 API、SDK、配置、数据格式、存储语义的兼容约束
        - 上下游依赖、SLA、限流、权限、网络、区域等外部约束
        - 已知不能改变的边界
        
        如果某类约束不存在，可以写“无”或“不涉及”。
  - !schema
    names:
      - "3. 技术目标与非目标"
    asserts:
      - |-
        本节定义技术方案的评价标准。
        它和 proposal 的区别是：
        - proposal 定义 change 要交付什么能力、工程范围是什么
        - design 这里定义技术方案必须满足什么技术目标，以及不解决哪些技术问题
      - "**目标：**"
      - |-
        示例：
        - SDK 不依赖 Flink。
        - Sink 只承载外部写入语义，不包含 HDFS/Dorado 编排。
        - Java 子工程不影响 Go 根工程默认构建。
      - "**非目标：**"
      - |-
        写本技术方案明确不解决的问题。
        可以与 proposal 的“不提供的能力边界 / 本次不做”有重叠，但这里应更技术化。
  - !schema
    names:
      - "4. 关键决策"
    asserts:
      - |-
        本节记录设计文档中必须拍板的关键技术选择。
        不要让关键决策散落在各个章节里；即使后文会展开，也应在这里给出集中索引。
        
        每个决策建议包含：
        - 结论：最终选什么
        - 问题描述：为什么必须做这个选择
        - 备选方案：考虑过哪些方案
        - 选择理由：为什么当前方案更合适
        - 影响与代价：该选择带来的约束、风险或后续成本
        - 待确认项：如已完全确认，写“无”
    fields:
      - !schema
        names:
          - "4.1 决策：<决策标题>"
        fields:
          - !schema
            names:
              - "结论"
          - !schema
            names:
              - "问题描述"
          - !schema
            names:
              - "备选方案"
          - !schema
            names:
              - "选择理由"
          - !schema
            names:
              - "影响与代价"
          - !schema
            names:
              - "待确认项"
  - !schema
    names:
      - "5. 方案总览"
    asserts:
      - |-
        本节说明方案整体如何运转。
        建议用架构图、数据流、调用链、模块关系或文字步骤表达。
        
        应该回答：
        - 核心模块有哪些，职责分别是什么
        - 请求或数据从哪里进入、经过哪里、在哪里结束
        - 控制面和数据面如何分工
        - 本方案与现有链路的关系是什么
  - !schema
    names:
      - "6. 详细方案"
    asserts:
      - |-
        本节是技术方案主体。
        以下小节按条件填写，不涉及的小节写“无”或“不涉及”。
        不要为了填满模板而编造不相关设计。
        
        如果方案存在固定小节无法自然覆盖的专项细节，可以在本节下新增自拟三级标题。
        标题应围绕一个具体设计问题或稳定方案面向，例如：
        - HDFS 输入读取方案
        - SDK Client 生命周期
        - 失败记录与重跑方案
        - Dorado 参数与运行配置
        - 依赖打包与版本隔离
        
        每个自拟小节应说明：
        - 这个细节解决什么问题
        - 方案怎么做
        - 边界和失败情况是什么
        - 与关键决策、代码结构、测试方案有什么关系
        
        自拟小节用于展开“方案是什么”，不要写成任务清单；任务拆解放到 tasks.md。
    fields:
      - !schema
        names:
          - "6.1 核心模型与领域语义"
        asserts:
          - |-
            涉及核心对象、领域概念、运行语义、能力边界变化时填写。
            
            应该写：
            - 本方案中的核心对象是什么
            - 对象之间是什么关系
            - 哪些术语在本系统或上下游中有专用含义
            - 关键语义如何定义，例如同步/异步、批处理/流式、强依赖/弱依赖、幂等、终态等
      - !schema
        names:
          - "6.2 接口与对外使用方式"
        asserts:
          - |-
            涉及 HTTP API、RPC、SDK、命令行参数、Dorado 参数、配置项、错误码、输出格式变化时填写。
            
            应该写：
            - 新增/修改/不变的对外接口或使用方式
            - 入参、出参、必填项、默认值、长度限制、错误语义
            - 是否向下兼容
            - 调用方需要如何迁移或适配
      - !schema
        names:
          - "6.3 数据模型与存储设计"
        asserts:
          - |-
            涉及数据库、缓存、索引、文件格式、消息格式、对象 schema、状态字段变化时填写。
            
            应该写：
            - 复用、修改、新增的数据结构分别是什么
            - 字段语义、索引、唯一性、分片键、TTL、容量和热点风险
            - 数据迁移、数据兼容、历史数据处理方式
            - 多源数据或异构数据的一致性要求
      - !schema
        names:
          - "6.4 状态机与生命周期"
        asserts:
          - |-
            涉及对象状态变化、异步任务、批处理作业、迁移、创建/删除/恢复等生命周期时填写。
            
            应该写：
            - 状态定义
            - 状态转换条件
            - 初始态、终态、失败态
            - 非法状态转换如何处理
            - 状态变化如何保证并发安全和可恢复
      - !schema
        names:
          - "6.5 关键流程"
        asserts:
          - |-
            涉及复杂流程、跨模块调用、跨服务交互、长耗时任务、失败重试时填写。
            
            建议至少覆盖：
            - happy path
            - 失败路径
            - 重试 / 重跑 / 重入路径
            - 任务结束或资源释放路径
            
            涉及服务间交互时，可以写调用链或时序图。
            涉及服务内部流程时，可以写流程图或步骤列表。
      - !schema
        names:
          - "6.6 代码结构与实现映射"
        asserts:
          - |-
            方案成型后填写主要代码落点。
            这里应该列出主要新增/修改目录、文件或 module，并说明职责。
            
            注意：
            - 这里属于 design，不属于 proposal
            - 不要求逐行实现
            - 只列关键文件和关键职责，避免变成完整 diff 清单
            
            推荐格式：
            
            | 路径 | 新增/修改 | 职责 |
            |-|-|-|
            | `path/to/file.go` | 修改 | <说明该文件承担的方案职责> |
            | `path/to/module/` | 新增 | <说明该模块职责> |
          - |-
            | 路径 | 新增/修改 | 职责 |
            |-|-|-|
            |  |  |  |
  - !schema
    names:
      - "7. 正确性与一致性设计"
    asserts:
      - |-
        本节检查方案是否在业务语义和数据语义上正确。
        
        按需覆盖：
        - 幂等性：唯一标识是什么，重复请求/重跑是否收敛
        - 并发控制：并发请求、并发任务、并发写如何避免脏写
        - 事务与最终一致性：哪些操作必须原子，哪些允许最终一致
        - 失败重试：哪些失败可重试，哪些不可重试，重试耗尽后怎么办
        - 状态一致性：状态转换是否可恢复、是否有非法状态防护
        - 数据对账与补偿：是否需要对账、修复、旁路失败记录
        
        不涉及时写“无”或“不涉及”，不要留空。
  - !schema
    names:
      - "8. 稳定性与可运维设计"
    asserts:
      - |-
        本节检查方案是否能稳定运行、容易排障、不会给上下游带来不可控风险。
        
        按需覆盖：
        - 下游依赖：强弱依赖、超时、重试、降级、限流、QPS/容量
        - 性能与容量：吞吐、延迟、并发、队列、资源占用、热点风险
        - 可观测性：日志、指标、报警、trace、失败记录
        - 运维操作：配置变更、扩容、限流、任务重跑、数据订正、应急操作
        - 资源生命周期：连接、线程、goroutine、client、文件句柄是否可释放
        
        不涉及时写“无”或“不涉及”，不要留空。
  - !schema
    names:
      - "9. 兼容性设计"
    asserts:
      - |-
        本节单独说明兼容性，不和灰度回滚混在一起。
        
        按需覆盖：
        - API / SDK / 参数 / 配置是否向下兼容
        - 数据格式、存储 schema、历史数据是否兼容
        - 新旧链路是否并存，如何区分
        - 多版本、多区域、多运行环境是否兼容
        - 发布期间是否存在顺序依赖
        - 调用方是否需要迁移
        
        不涉及时写“无”或“不涉及”，不要留空。
  - !schema
    names:
      - "10. 灰度与回滚"
    asserts:
      - |-
        本节说明变更如何安全上线、如何观察、如何回退。
        
        按需覆盖：
        - 灰度方式：发布灰度、配置灰度、白名单、百分比、分批任务、影子验证等
        - 灰度推进指标：什么指标正常才继续
        - 回滚触发条件：什么指标异常必须停或回滚
        - 回滚方式：代码回滚、配置回滚、任务停止、数据回滚、兼容旧链路
        - 回滚顺序与依赖：是否存在发布、配置、数据、任务之间的先后关系
        
        如果确实不需要灰度或无法回滚，必须解释原因和风险接受方式。
  - !schema
    names:
      - "11. 待确认问题"
    asserts:
      - |-
        列出 design 阶段仍未关闭的问题。
        每个问题建议写明 owner、下一步动作或期望确认时间。
        如果没有待确认问题，写“无”。
