!concept
syntax: memsphere-20260719-stable
names:
  - bookkeeping
  - 记账
  - 记账记录
defines:
  - 一条记账记录表示一次收入或支出的发生情况，用于后续汇总和核对资金变化。
  - !statement
    asserts:
      - 金额必须大于零。
      - 日期不能为空，并使用 YYYY-MM-DD 格式。
      - 类型只能是“收入”或“支出”。
      - 备注不能为空，必须描述本次收入或支出的具体内容。
      - 记账实例必须以 Markdown 文件保存到 artifacts/bookkeeping.md。
  - !schema
    asserts:
      - 日期、类型、金额、分类和备注均不能为空。
    fields:
      - 日期
      - 类型
      - 金额
      - 分类
      - 备注
