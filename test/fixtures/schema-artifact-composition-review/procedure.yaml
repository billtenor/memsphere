!procedure
syntax: memsphere-20260721-stable
name: schema-artifact-composition-review
role_bindings:
  agent_reviewer: agent
  human_reviewer: human
flow:
  - !action
    action: Produce a complete delivery from an external Schema.
    asserts:
      - Keep the delivery coherent across all sections.
    suggests:
      - Prefer concise, traceable evidence.
    artifact: !artifact
      name: reviewed delivery
      type: object
      format:
        name: markdown
        layout: outline
      schema: Reviewed delivery
      review: artifact_acceptance.unanimous
  - !action
    action: Continue only after the complete delivery is accepted.
    artifact: !artifact
      name: continuation
