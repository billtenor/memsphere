!schema
syntax: memsphere-20260721-stable
names:
  - emergency-data-repair-plan
  - 紧急数据修复方案
defines:
  - 供 Human 审批与演练使用的修复方案，首次生成与后续修订使用同一契约。
type: object
format: { name: markdown, layout: outline }
fields:
  - 修复动作
  - !schema
    name: 风险解释
    asserts:
      - 每项风险必须关联支持该判断的证据；未确认的风险必须明确标为假设。
    suggests:
      - 按影响程度排序风险解释。
  - 验证计划
  - !schema
    name: 证据引用
    asserts:
      - 必须引用本工单的证据，并能定位到对应材料。
