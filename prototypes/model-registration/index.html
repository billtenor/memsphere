<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>模型 · Memsphere 原型</title><link rel="stylesheet" href="styles.css"></head>
<body>
<div class="shell">
 <aside class="rail" aria-label="模块"><div class="brand" title="memsphere">◇</div><button class="rail-search" aria-label="搜索">⌕</button><div class="rail-modules"><button><span>✧</span>原型</button><button><span>♧</span>记忆</button><button class="active"><span>▱</span>模型</button><button><span>▷</span>运行</button></div><button class="rail-bottom" id="open-settings" aria-label="设置"><span>⚙</span>设置</button><div class="avatar">人</div></aside>
 <aside class="secondary"><div class="module-heading"><span class="eyebrow">MODULE</span><h1>模型</h1></div><nav id="navigation" aria-label="模型导航"></nav><div class="prototype-note"><span class="status-dot"></span>界面原型<span>登记与安装操作仅作演示</span></div></aside>
 <div class="workspace" id="workspace"><aside class="list-panel" aria-label="模型列表"><header><span class="eyebrow">memsphere</span><div class="list-title"><h2 id="scope-title"></h2><span id="scope-count"></span></div></header><div class="filters"><div class="search-box"><span>⌕</span><input id="search" placeholder="查找模型…" aria-label="查找模型"></div><label class="domain-label" for="tag">标签</label><select id="tag" aria-label="标签筛选"></select></div><div id="model-list" class="model-list"></div><div class="list-footer" id="list-footer"></div></aside><main class="detail"><header class="page-header"><div><strong id="page-title">模型</strong><span id="page-subtitle">memsphere</span></div><span class="preview-pill">展示原型</span><button id="reset" class="button">↻ 重置预览</button></header><div id="content" class="content"></div></main></div>
</div><div id="toast" role="status" class="toast" hidden></div><dialog id="market-preview"><div id="dialog-content"></div><button id="close-dialog" class="button">关闭预览</button></dialog><dialog id="storage-settings" aria-labelledby="settings-title"><div class="settings-heading"><div><span class="eyebrow">设置 / 存储</span><h2 id="settings-title">模型登记存储</h2></div><button id="close-settings" class="button" aria-label="关闭设置">关闭</button></div><p>选择保存模型名称、所属包、标签等管理信息的 ValueStore。</p><label class="settings-label" for="registration-store">存储 ID</label><select id="registration-store"><option value="memsphere/model-registrations">memsphere/model-registrations（默认）</option><option value="project/model-registrations">project/model-registrations（演示）</option></select><div class="settings-store"><div class="section-tools"><span>所选存储的详细配置</span><span id="store-config-badge" class="badge neutral">默认</span></div><label class="settings-label" for="store-type">存储类型</label><select id="store-type"><option value="filesystem">filesystem ValueStore</option></select><label class="settings-label" for="store-directory">存储目录</label><input id="store-directory" required value="models/registrations" placeholder="填写项目相对路径或绝对路径"><span class="muted">相对路径以当前项目为基准。</span><dl><dt>登记模型</dt><dd class="mono">memsphere/model-registration <span class="badge">代码内置</span></dd></dl></div><div class="settings-note">模型存储由各模型的存储方式和存储 ID 指定。修改已有存储目录或切换登记存储时，需要显式迁移登记数据。</div><footer class="settings-footer"><span class="muted">展示原型 · 不写入实际配置</span><button id="save-settings" class="button primary">保存</button></footer></dialog><script type="module" src="app.js"></script>
</body></html>
