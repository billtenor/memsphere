!procedure
names:
  - vibe-mem-harness-smoke
  - harness-smoke
defines:
  - 用于手动验证 vibe-mem run harness 的最小流程。
goals:
  - 验证 procedure step 可以通过 artifact report 顺序推进。
  - 验证 branch 可以根据 boolean artifact 选择后续步骤。
  - 验证 loop 可以通过 boolean artifact 决定继续或退出。
  - 验证 format 为 schema 的 artifact 可以进入 schema 深度优先编写流程。
flow:
  - action: 判断当前输入是否足够开始 smoke test。
    artifact:
      name: 当前输入是否足够开始测试
      format: boolean
  - !if
    condition:
      action: 判断是否需要先补充测试目标。
      artifact:
        name: 是否需要补充测试目标
        format: boolean
    then:
      - action: 写出缺失的测试目标，要求只用一句话。
        artifact:
          name: 缺失的测试目标
          format: string
    elseif:
      - condition:
          action: 判断是否需要记录目标已经充分的原因。
          artifact:
            name: 是否需要记录目标充分的原因
            format: boolean
        then:
          - action: 写出当前测试目标已经充分的原因。
            artifact:
              name: 测试目标已经充分的原因
              format: string
    else:
      - action: 确认当前测试目标已经足够。
        artifact:
          name: 测试目标充分确认
          format: string
  - !while
    condition:
      action: 判断是否还需要继续补充 smoke test 观察点。
      artifact:
        name: 是否需要继续补充观察点
        format: boolean
    do:
      - action: 补充一个新的观察点，要求具体说明你想验证什么。
        artifact:
          name: 新增观察点
          format: string
  - action: 用一句话总结本次 smoke test 的目的。
    artifact:
      name: 本次测试目的总结
      format: string
  - !call
    target: vibe-mem-harness-child
  - action: 编写一份最小 harness note artifact。
    artifact:
      name: 最小 Harness 记录
      format: schema
      schema: vibe-mem-harness-note
