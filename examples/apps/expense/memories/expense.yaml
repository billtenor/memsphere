!concept
syntax: memsphere-20260721-stable
names:
  - expense-app
  - 费用记录 App
defines:
  - 费用记录 App 为当前 Project 提供共享账本，Human 在 View 中录入和提交，Agent 使用独立 expense CLI 完成相同操作。
  - 在已绑定当前 Project 的工作区运行 expense-project list，可加 --cursor 翻页。录入用 expense-project create --description TEXT --amount NUMBER，提交用 expense-project submit --id ID --revision REVISION。
  - 费用金额必须为正数，记录初始为 draft，只有 draft 可提交为 submitted；提交必须携带查询得到的当前 revision，过期版本被拒绝。
