!procedure
syntax: memsphere-20260721-stable
names:
  - memsphere-procedure-construction
  - memsphere Procedure记忆提取流程
  - Procedure 提取流程
defines:
  - 从已完成任务、Run、产物、仓库证据或已经理清的执行思路中，提取可复用、可执行且可验证的 Procedure Memory。
  - 适用于新建 Procedure 或根据可靠实践更新已有 Procedure，不负责执行被提取的流程。
  - 只保留会改变执行、判断或验收结果的内容，不把对话记录、临时尝试和通用常识照搬进 Memory。
  - 同一个目标 Procedure 的连续增量修改可以在一个 Run 中复用同一 ChangeSet 多轮完成，直到 human 接受当前候选。
asserts:
  - 提取前必须使用 memsphere memory list 和 memory read 查找并应用当前工程中的 Memory 撰写、Procedure 编写和 YAML 语法规则；未找到时遵循本流程约束。
  - 只能把 human 输入、实际执行证据或可验证来源支持的内容写入 Procedure；尚未执行的思路不得描述为已验证经验。
  - 必须提取可复用的任务逻辑，不得记录仅适用于本次任务的路径、值、偶发重试或无关工具调用。
  - 只创建或更新目标 Procedure 文件，不得修改其他 Memory 或无关工作区内容。
  - 一个 Run 只能处理同一个目标 Procedure 和同一组相关修改；更换目标 Procedure 或转入无关任务时必须启动新的 Run。
goals:
  - 明确 Procedure 的触发场景、边界、目标和最终交付物。
  - 将可靠经验压缩为最小且完整的执行流程。
  - 生成并验证可被 memsphere Run 执行的 Procedure YAML。
  - 在同一个 Run 中完成 human 要求的多轮相关修改，并只发布最终接受的版本。
flow:
  - !action
    action: 提供需要提取的任务、已完成实践或执行思路，并按需指定目标 Procedure。
    actor: human
    artifact: !artifact
      name: Procedure 提取请求
      format: markdown

  - !while
    condition: !action
      action: 判断是否仍有待处理的 Procedure 创建或修改要求。
      actor: agent
      asserts:
        - 初始 Procedure 提取请求尚未处理时必须返回 true；后续必须结合上一轮 Procedure 候选验收意见判断。
        - 只有 human 已明确接受最新候选，且没有尚未处理的增量要求时才能返回 false。
      artifact: !artifact
        name: 是否继续修改 Procedure
        type: boolean
    do:
      - !action
        action: 收集本轮修改要求及相关证据，确定提取来源、适用边界和目标 Procedure。
        actor: agent
        asserts:
          - 首轮必须使用 Procedure 提取请求；后续轮次必须同时使用上一轮 Procedure 候选验收意见中的增量要求，并保留仍然有效的既有依据。
          - 更新已有 Procedure 时必须完整读取原文件，并保留仍然有效的行为和约束。
          - 实际执行结果用于确定已验证步骤和约束；human 明确确认的规则按强制程度写入 asserts 或 suggests；仅完成推演的判断不得表述为已经实践验证，关键不确定性必须进入补充循环。
        suggests:
          - 尽量复用当前 Run 已收集的依据，避免要求 human 重复描述或重复读取没有变化的证据。
        artifact: !artifact
          name: 本轮 Procedure 提取依据
          format: markdown

      - !while
        condition: !action
          action: 判断本轮是否仍缺少会影响流程触发、最终产物、关键分支、human 决策或循环终止的必要信息。
          actor: agent
          artifact: !artifact
            name: 本轮是否缺少关键流程信息
            type: boolean
        do:
          - !action
            action: 补充当前证据无法判断且会影响流程触发、最终产物、关键分支、human 决策或循环终止的信息。
            actor: human
            artifact: !artifact
              name: 本轮 Procedure 提取补充信息
              format: markdown

      - !action
        action: 根据本轮提取依据和补充信息更新完整 !procedure YAML 草稿。
        actor: agent
        asserts:
          - 顶层 names[0] 必须是准确且稳定的小写 ASCII kebab-case canonical name；alias、defines 和 goals 必须准确表达自然语言名称、用途、适用边界和预期结果。
          - 必须区分强制规范和可选建议；持续约束写入 Procedure asserts，局部约束写入 Action asserts，可选做法写入 suggests。
          - flow 只保留完成任务所必需的步骤；不得为展示思考过程而拆分中间 Action。
          - 每个 Action 必须职责单一、actor 准确并产出后续步骤或 human 实际需要的 Artifact。
          - 每个 Action 的 action 只描述当前步骤的核心任务并保持简洁；执行范围、强制条件和验收要求写入同级 asserts，可选做法写入 suggests，不得把要求堆叠在步骤描述中。
          - 只有真正改变控制流的判断和重复执行才使用 !if、!while；condition 必须产出 boolean，循环必须具有可判断的终止条件。
          - 只有可复用且已存在的独立 Procedure 才使用 !call。
          - 强制使用的命令或工具必须写入 action 或 asserts，可选做法写入 suggests。
          - "只有循环外最终发布的 Procedure 和面向 human 的处理摘要可以标记 final: true。"
        suggests:
          - 避免按单次执行时间线照抄对话、工具调用、探索过程和偶发重试，应提取稳定且可复用的任务逻辑。
          - 避免把同一 actor 可以连续完成且没有新输入或独立交付价值的工作拆成多个 Action。
          - 避免用 !if 判断后再用 !while 重复判断同一条件；需要反复处理时直接使用 !while。
          - Artifact 需要根据评审意见反复修改时，优先声明 artifact.review，由 Artifact Review 管理意见、决策和修订轮次；human 新增修改要求才进入下一次外层循环。
          - 避免为了满足语法而创建后续步骤和 human 都不会使用的确认结果、候选清单或检查 Artifact。
          - 避免要求 human 重复已有信息，或确认 agent 能依据证据自行判断的事项。
          - 避免把局部约束提升为 Procedure asserts，或把可选做法写成强制要求。
          - 避免穷举低概率例外；分支只保留常见情况或会改变任务结果的关键情况。
          - 避免在校验和必要复核完成前把草稿或中间产物标记为 final。
        artifact: !artifact
          name: 本轮 Procedure Memory 草稿
          type: object
          format: yaml

      - !action
        action: 建立或更新目标 Procedure 的 Working Change。
        actor: agent
        asserts:
          - 首轮必须使用 memsphere memory edit 为目标 Procedure 创建或追加 Managed ChangeSet，并将草稿写入 CLI 返回的 Workspace 候选路径；Embedded Project 则写入仓库内的 Memory 路径。
          - 后续轮次必须复用首轮保存的 change id 和候选路径，不得为同一任务创建新的 ChangeSet；Managed Project 不得直接修改正式 Memory 工作树。
          - 新建时使用唯一且可识别的 YAML 文件名；更新时保留同一目标路径，并只修改本流程范围内的内容。
        artifact: !artifact
          name: 本轮 Procedure Working Change
          type: object
          format: yaml

      - !action
        action: 校验并评审本轮 Procedure 候选。
        actor: agent
        asserts:
          - Managed 与 Embedded Project 必须使用 memsphere memory change validate [change-id] 复用同一 ChangeSet，校验本轮修改并更新可供 View 展示的稀疏 checkpoint。
          - 必须检查步骤输入与 Artifact 衔接、actor 归属、约束作用域、分支完整性、循环终止和最终交付物，并删除重复、无执行价值或可由其他已读取 Memory 提供的内容。
          - 未通过 change validate 时不得提交评审或声称本轮完成；普通 memsphere validate 不代替 Embedded ChangeSet 捕获，也不得把稀疏 ChangeSet candidate 或 checkpoint 直接传给 memsphere validate --memory-root。
          - Reviewer 或 Runner 对当前候选要求修改时，必须使用当前 Artifact Review 的 revision round 修订并重报，不得因此创建新 Run 或进入下一次外层循环。
        artifact: !artifact
          name: 本轮已验证的 Procedure Memory
          type: object
          format: yaml
          review:
            - 流程设计者

      - !action
        action: 验收当前 Procedure 候选，并决定接受或继续修改。
        actor: human
        asserts:
          - 必须明确选择接受当前候选或继续修改；继续修改时必须提供下一轮增量要求。
          - 只有当前 ChangeSet 预览、校验结果和评审结论均可接受时才能选择接受。
        artifact: !artifact
          name: Procedure 候选验收意见
          format: markdown

  - !action
    action: 发布 human 已接受的最终 Procedure Memory。
    actor: agent
    asserts:
      - 必须发布外层循环最后一次通过校验、评审并被 human 接受的同一 ChangeSet；验收后不得夹带新的 Memory 改动。
      - Managed Project 使用 memsphere memory publish 发布；Embedded Project 使用普通 Git commit 发布，且不得制造空 commit 或自动 push。
      - 整个 Run 只能执行一次最终 publish 或 commit；发布前必须满足当前工程的适用测试和交付规则。
    artifact: !artifact
      name: 已发布的 Procedure Memory
      type: object
      format: yaml
      final: true

  - !action
    action: 向 human 简要说明 Procedure 的文件路径、提取依据、多轮修改记录、关键边界和校验结果。
    actor: agent
    artifact: !artifact
      name: Procedure 提取结果
      format: markdown
      final: true
