!procedure
syntax: memsphere-20260721-stable
names:
  - memsphere-tutorial-chapter-03
  - memsphere 教学流程-第三章
defines:
  - 帮助 Human 配置 ACP Provider 与 Actor，理解 Run 执行角色和 Review 角色的区别，然后启动一次带 Artifact Review 的体验 Run。
asserts:
  - Run 步骤执行者只区分 Human 和 Runner。Runner 由通用 Agent 框架托管，可以是主 Agent，也可以由主 Agent 与子 Agent 共同构成；Memsphere 不介入框架内部如何分工。
  - Review Slot 只表示评审视角，实际参与者由本次 Run 的 Actor Binding 决定；Reviewer 不执行 Run 步骤，也不直接修改 Artifact。
  - Human 提问时，先读取 memsphere-run、memsphere-actor、memsphere-artifact-review 和 memsphere-view；Memory 中没有答案时明确说明不知道。
  - 本章不展开 ACP Provider 内部机制、Permission Catalog、运行期换绑、Reviewer 调试与重试或不同 Decision Policy 的详细差异。
goals:
  - 让 Human 知道 ACP Provider 用于连接 Agent 产品，Actor 表示可参与 Review 的具体 Human 或 Agent。
  - 让 Human 区分 Run 执行者与 Artifact Reviewer。
  - 让 Human 理解 Review Slot、Actor、Binding、Reviewer 与 Runner 的关系。
  - 让 Human 主动启动一次带 Artifact Review 的 Run，并在 View 中完成 Review。
flow:
  - !while
    condition: !action
      action: 实际检查第三章教学环境，判断是否仍有未满足的准入项。
      actor: agent
      asserts:
        - 必须实际检查 memsphere CLI 与 Skill、Primary Project Binding、Project 配置与 Memory Store、`memsphere validate` 结果，以及当前环境可访问的 View 地址。
        - 任一项无法实际确认时必须判定为尚未满足，不得根据历史结果推断。
      artifact: !artifact
        name: 是否仍有未满足的第三章准入项
        type: boolean
    do:
      - !action
        action: 定位未满足的准入项，完成 Agent 可以安全处理的事项；需要 Human 完成配置、安装、认证或授权时，给出最小操作、影响和验证方法。
        actor: agent
        asserts:
          - View 尚不可访问时，选择当前环境可用的 Host 和端口启动或重启，并实际检查访问结果。
          - 如果准入问题要求废弃或重新启动当前 Run，必须先说明原因并等待 Human 决定。
        artifact: !artifact
          name: 第三章准入处理结果
          format: markdown
      - !action
        action: 完成准入处理结果中明确列出的 Human 操作；没有需要 Human 操作的事项时，回复“无需额外操作”。
        actor: human
        artifact: !artifact
          name: Human 准入操作结果
          format: markdown

  - !while
    condition: !action
      action: 判断 Human 是否尚未理解 ACP Provider 与 Actor，或当前 Project 尚未具备 Human 已确认的参与者配置。
      actor: agent
      asserts:
        - 必须确认当前 Project 至少有一名 Human Actor。
        - Human 希望使用 Agent Reviewer 时，必须确认选定的 ACP Provider 可用，且已配置对应 Agent Actor。
        - 没有任何可用 ACP Provider 时，只要 Human Actor 已准备并且 Human 已理解这一限制，就不得继续阻塞。
        - 只有 Human 确认参与者配置已准备且没有疑问时，才结束本循环。
      artifact: !artifact
        name: 是否继续 ACP 与 Actor 配置
        type: boolean
    do:
      - !action
        action: 读取当前 Memsphere Home 的 ACP Provider 和当前 Project 的 Actor 配置，用实际配置解释两者的作用，并引导 Human 在 View 设置中补齐希望的参与者。
        actor: agent
        asserts:
          - 必须说明 ACP Provider 是 Memsphere 连接并启动 Agent 产品的入口，Actor 是参与 Review 的具体 Human 或 Agent。
          - 必须提供当前可访问的 View 设置入口，不得使用 Host、端口或 Actor 占位符。
          - 有可用 ACP Provider 时，询问 Human 是否希望配置 Agent Actor，不得替 Human 默认选择 Provider 或模型。
          - 没有可用 ACP Provider 时，明确说明本次将使用 Human Reviewer，并引导 Human 至少配置一名 Human Actor。
          - 只解释和配置当前需要的内容，不展开 ACP 内部实现、完整 Permission Catalog 或高级运行配置。
        artifact: !artifact
          name: ACP 与 Actor 配置指引
          format: markdown
      - !action
        action: 在 View 设置中查看或完成需要的 ACP Provider 与 Actor 配置；然后回复配置已准备且没有疑问，或说明尚未完成的事项与疑问。
        actor: human
        artifact: !artifact
          name: ACP 与 Actor 配置确认
          format: markdown

  - !while
    condition: !action
      action: 根据 Human 最近一次“协作角色学习确认”，判断是否还需要继续解释 Run 执行角色与 Review 角色。
      actor: agent
      asserts:
        - Human 尚未确认、还有疑问或指出解释需要修正时继续。
        - 只有 Human 明确表示没有疑问时才结束本循环；不得要求 Human 复述或回答概念。
      artifact: !artifact
        name: 是否继续解释协作角色
        type: boolean
    do:
      - !action
        action: 读取本章引用的四个 Concept，根据本次 Run 的真实配置，解释 Human Action 和 Agent Action 分别由谁执行，Review Slot 如何绑定 Actor，以及 Runner 与 Reviewer 为什么分开。
        actor: agent
        asserts:
          - 必须使用当前 Run 的真实名称、run_id、Runner、Review Slot、Actor Binding 和 View 地址，不得使用占位符。
          - 必须说明 Memsphere 把 Agent Action 交给一个连续的 Runner 执行上下文，Runner 内部如何分工由通用 Agent 框架管理；Review 则可以配置多个独立视角。
          - 必须说明 Reviewer 只评审已上报的 Artifact，不接管 Run 步骤，也不直接修改 Artifact。
          - “Agent 观察者”已 skip 时，说明本次只由 Human Review，同时使用当前配置解释如何在未来加入 Agent Reviewer。
        artifact: !artifact
          name: Run 执行与 Review 角色说明
          format: markdown
      - !action
        action: 阅读 Agent 的解释和本次 Artifact Review；如果还有疑问或不同意，直接说明问题，否则回复“没有疑问”。
        actor: human
        artifact: !artifact
          name: 协作角色学习确认
          format: markdown

  - !action
    action: 发送“请启动 memsphere 教学流程-第三章 Review 体验流程”，请求 Agent 启动一次带 Artifact Review 的体验 Run。
    actor: human
    artifact: !artifact
      name: Human 的 Review 体验 Run 启动请求
      format: markdown

  - !while
    condition: !action
      action: 检查 Review 体验 Run 是否还没有运行结束。
      actor: agent
      asserts:
        - 还没有创建体验 Run、Run 正在执行，或 Review 要求修改时继续。
        - 体验 Run 明确显示 done 或 abandoned 后结束本循环。
      artifact: !artifact
        name: Review 体验 Run 是否还没有结束
        type: boolean
    do:
      - !action
        action: 根据 Human 的启动请求创建 Review 体验 Run，或继续处理同一个 Run，并把 Run 链接发给 Human。
        actor: agent
        asserts:
          - 第一次执行时，启动“memsphere 教学流程-第三章 Review 体验”，并保存实际 run_id；后续循环必须继续同一个 run_id。
          - 启动预检时，将“Human 体验者”绑定到 Human 已确认的 Human Actor。
          - 当前有可用 ACP Provider 和 Agent Actor 时，询问 Human 是否将“Agent 观察者”绑定到 Agent Actor；没有或 Human 不使用时明确 skip。
          - 必须为 Review scope 选择 Decision Policy，并严格执行体验 Run 当前返回的步骤，不得重复启动。
        artifact: !artifact
          name: Review 体验 Run 状态
          format: markdown
      - !action
        action: 打开 Review 体验 Run 页面查看当前状态；页面要求 Review 时，查看 Artifact、提交 Comment 和 Vote，然后把结果告诉 Agent。
        actor: human
        artifact: !artifact
          name: Human 的 Review 体验结果
          format: markdown

  - !action
    action: 根据本次第三章 Run、Review 体验 Run、参与者配置和 Human 的问题，总结 ACP Provider、Actor、Run 执行角色、Review 角色及 View 的关系。
    actor: agent
    asserts:
      - 用一句话分别说明 ACP Provider、Actor、Runner、Human Action、Review Slot、Actor Binding、Reviewer 和 View。
      - 明确说明 Memsphere 面向一个连续的 Runner 执行上下文，Runner 内部可由多个 Agent 协作；Review 则允许多个独立视角。
      - 记录 Review 体验 Run 实际使用 Human Review 还是 Human 与 Agent 多视角 Review，不得把 skip 的 Agent Slot 表述为已参与。
      - 提供第三章 Run 和 Review 体验 Run 的实际 run_id 与 View 入口。
    artifact: !artifact
      name: memsphere 教学第三章完成摘要
      format: markdown
      final: true
