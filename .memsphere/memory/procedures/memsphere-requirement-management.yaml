!procedure
names:
  - memsphere 需求管理流程
  - memsphere idea 记录流程
  - memsphere-requirement-management
defines:
  - 用于在 human 产生 memsphere 相关产品、体验、工程或能力建设 idea 时，低成本收集并记录需求。
  - 该流程强调先把想法记录在案，再进行必要澄清、归类和结构化，方便后续大版本规划与产品迭代复用。
  - 该流程不负责需求排期和实现，只负责形成可追踪、可管理、可被后续流程消费的需求记录。
goals:
  - 接收 human 对新需求或 idea 的自由描述。
  - 将模糊 idea 整理为结构化需求记录。
  - 补齐需求的最低必要信息，避免后续规划时无法理解上下文。
  - 判断是否需要去重、合并或关联已有需求。
  - 按 schema 约束更新总需求池 Markdown，并向 human 汇报记录结果。
flow:
  - action: 接收 human 对 memsphere 需求或 idea 的自然语言描述。
    actor: human
    artifact:
      name: 需求或 idea 原始描述
      format: markdown
  - !if
    condition:
      action: 判断原始描述是否足够进入需求池。
      actor: agent
      artifact:
        name: 原始描述是否足够进入需求池
        format: boolean
    then:
      - action: 确认原始描述已达到记录门槛。
        actor: agent
        artifact:
          name: 需求记录门槛确认
          format: string
    else:
      - action: 针对缺失的最低必要信息提出 1-3 个澄清问题。
        actor: agent
        artifact:
          name: 需求澄清问题
          format: markdown
      - action: 回答澄清问题并补充必要信息。
        actor: human
        artifact:
          name: 需求澄清回答
          format: markdown
  - action: 根据原始描述和补充信息整理结构化需求草稿。
    actor: agent
    artifact:
      name: 结构化需求草稿
      format: markdown
  - !if
    condition:
      action: 判断需求池 Markdown schema 记忆是否已存在。
      actor: agent
      artifact:
        name: 需求池 Markdown schema 记忆是否已存在
        format: boolean
    then:
      - action: 读取已有需求池 Markdown schema 记忆，并提取文档结构和字段约束。
        actor: agent
        artifact:
          name: 已有需求池 Markdown schema 约束
          format: markdown
    else:
      - action: 创建需求池 Markdown schema 记忆，定义总文档结构和单条需求字段。
        actor: agent
        artifact:
          name: 需求池 Markdown schema 记忆
          format: yaml
  - action: 读取或初始化总需求池 Markdown 文档。
    actor: agent
    artifact:
      name: 当前需求池 Markdown 内容
      format: markdown
  - !if
    condition:
      action: 判断当前需求池中是否存在重复或强相关需求。
      actor: agent
      artifact:
        name: 是否存在重复或强相关需求
        format: boolean
    then:
      - !if
        condition:
          action: 判断合并到最相关的已有需求是否会损失该 idea 的独立价值。
          actor: agent
          artifact:
            name: 合并是否损失独立价值
            format: boolean
        then:
          - action: 将该 idea 作为关联需求独立记录，并说明与已有需求的关系。
            actor: agent
            artifact:
              name: 关联需求记录草稿
              format: markdown
        else:
          - action: 将新 idea 默认合并到最相关的已有需求，并保留新增信息和来源。
            actor: agent
            artifact:
              name: 合并后的需求记录草稿
              format: markdown
    else:
      - action: 将新 idea 作为全新需求记录。
        actor: agent
        artifact:
          name: 新需求记录草稿
          format: markdown
  - action: 按 schema 将需求记录写入总需求池 Markdown。
    actor: agent
    artifact:
      name: 更新后的需求池 Markdown
      format: markdown
  - action: 检查更新后的需求池 Markdown 是否符合 schema 的主要结构约束。
    actor: agent
    artifact:
      name: 需求池 Markdown 结构检查结果
      format: markdown
  - action: 向 human 汇报需求记录处理摘要。
    actor: agent
    artifact:
      name: 需求记录处理摘要
      format: markdown
