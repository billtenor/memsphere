!procedure
syntax: memsphere-20260721-stable
names:
  - code-branch-review-and-remediation
  - 基于代码分支的评审与修复流程
  - 代码分支循环评审修复流程
defines:
  - 面向一个代码分支，在同一个 Run 中基于目标分支与基线分支的完整差异持续完成代码评审、问题判断、修复和复验，直到没有待处理问题或 human 决定结束。
  - 合并代码评审与评论修复的核心逻辑，不依赖 GitHub Pull Request、review comment 或 thread。
  - 评审意见、接受或拒绝依据、代码修改和验证结果只记录在本地 Memsphere 交付物中，不向 GitHub 发布 comment。
asserts:
  - 每轮评审必须固定并记录目标分支 HEAD SHA 与基线分支 SHA；HEAD 变化后必须基于新版本重新评审受影响范围。
  - 必须发现并读取当前工程中与变更范围相关的 Concept、Statement、Schema 和 Procedure Memory，并将适用规则与代码证据共同用于判断。
  - 必须阅读目标分支相对基线分支的完整变更、受影响代码与调用关系、相关测试和可用检查结果；不得只依据提交标题、局部 diff 或既有结论下结论。
  - 所有评审意见必须按相同的证据标准判断；接受、拒绝、请求澄清或延期都必须在本地 Memsphere Artifact 中记录依据。
  - 不得创建或发布 GitHub review、comment、thread reply 或其他远端评审反馈；Memsphere Artifact 是本流程的评审与处置记录。
  - 只有实际存在代码变更时才允许创建 commit；不得为记录结论、维持循环或表示无问题而制造空 commit。
  - 评审、意见处置和代码修复是三个严格分离的阶段；任何阶段都不得提前执行后续阶段的代码修改、测试修改或提交动作。
goals:
  - 对目标代码分支完成全面、基于工程规则且可追溯的评审。
  - 在同一流程中判断并修复合理问题，执行必要验证，并对修复后的新 HEAD 再评审。
  - 形成包含全部意见、处置依据、代码提交、验证结果和残余风险的本地交付记录。
flow:
  - !action
    action: 提供需要评审与修复的目标代码分支及基线分支。
    actor: human
    asserts:
      - 已知的评审范围、修复限制、允许提交范围和终止条件必须一并说明。
    artifact: !artifact
      name: 代码分支评审与修复请求
      format: markdown

  - !action
    action: 建立分支评审基线。
    actor: agent
    asserts:
      - 必须确认目标分支、基线分支、两者 SHA、工作区状态和允许修改范围；存在可能混入无关改动的脏工作区时不得擅自覆盖或提交。
      - 必须记录目标分支相对基线分支的提交范围、完整 diff 范围和可用测试入口。
    artifact: !artifact
      name: 代码分支评审基线
      format: markdown

  - !while
    condition: !action
      action: 判断是否仍需评审或处理尚未闭环的问题。
      actor: agent
      asserts:
        - 首轮必须返回 true；后续在存在新 HEAD、未处理意见、修复失败、待澄清事项或需要复验的风险时返回 true。
        - 只有最新 HEAD 已完成评审、全部意见已有明确处置、适用验证完成且没有阻塞性残余风险时才能返回 false；human 明确要求结束时也可返回 false，但必须保留未完成事项。
      artifact: !artifact
        name: 是否继续分支评审与修复
        type: boolean
    do:
      - !action
        action: 只读评审当前 HEAD 并生成代码问题清单。
        actor: agent
        asserts:
          - 必须固定当前 HEAD SHA，检查相对基线的完整变更、受影响实现、调用关系、测试和检查结果，并发现和读取适用的工程 Memory。
          - 候选必须明确覆盖范围、已读取规则、逐项问题、代码定位、影响、证据和建议；没有问题时也必须说明实际完成的覆盖。
          - 本步骤只允许读取代码、运行不改变目标分支受版本控制内容的检查并编写或修订当前 Artifact；不得修改代码、测试或配置，不得创建 commit。
          - 从固定当前 HEAD 到当前 Artifact Review 完成期间，目标 HEAD 必须保持不变；HEAD 变化时当前候选失效，必须基于新 HEAD 重新执行本步骤。
          - 各 Reviewer 必须覆盖完整变更，角色名称只规定重点视角，不得成为跳过其他代码或风险的理由。
          - Reviewer 审核的是问题清单的覆盖范围、问题判断、证据和严重级别是否准确完整，不是判断目标代码是否已经达到合入条件；候选准确记录 blocking 或 risk 问题时仍应通过，不得仅因目标代码存在问题而拒绝候选。
          - request_changes 只表示当前 Artifact 存在遗漏、错误或证据不足，只能通过修订并重报同一 Artifact 响应，不得在本步骤修改目标代码。
          - 没有投票权的 Reviewer 提供的意见只作为建议；拥有最终决定权的流程执行者（Runner）必须基于代码、测试和适用工程 Memory 独立复核后作出最终决定，有权拒绝缺乏证据或不合理的意见。
        artifact: !artifact
          name: 当前 HEAD 代码问题清单
          format: markdown
          review:
            - 架构师
            - 测试工程师

      - !action
        action: 综合评审意见并形成不包含代码修改的处置结论。
        actor: agent
        asserts:
          - 必须读取全部评审意见、复核代码和规则证据、合并同一根因的重复项，并逐项判断接受、拒绝、请求澄清或延期。
          - 接受必须说明问题为何成立和预期修改；拒绝必须说明为何不成立或不适用；证据不足时必须请求澄清，不得猜测修改。
          - 本步骤只允许形成意见处置 Artifact；不得修改代码、测试或配置，不得创建 commit。
          - 接受表示问题成立并进入下一修复步骤，不表示问题已经修复；处置结论必须说明预期修改和验证要求。
          - 项目负责人审核的是处置判断及依据是否合理完整，不得仅因已接受问题尚未修复而拒绝准确的处置结论。
          - 已修复、仅供参考或不再适用于当前 HEAD 的意见不得被强行转化为代码修改，但仍须记录处置依据。
          - 处置结论只写入本地 Memsphere Artifact，不得发布到 GitHub。
        artifact: !artifact
          name: 分支评审意见处置结论
          format: markdown
          review:
            - 项目负责人

      - !action
        action: 根据已批准的处置结论修复问题并完成验证。
        actor: agent
        asserts:
          - 在评审意见处置链中，只有本步骤允许针对本轮已接受意见修改代码和测试；不得修复尚未经过处置结论接受的意见。
          - 必须实施必要修改并运行适用工程 Memory 和变更范围要求的测试与检查；只允许修改本流程范围内的内容。
          - 本步骤不得创建 commit；本轮修复必须由后续独立 Git commit Action 提交，master 合入也只能由其后的独立 Action 执行。
          - 如果目标分支 HEAD 在修复期间发生变化，必须先重新同步并复核处置结论，禁止覆盖或忽略他人的新提交。
          - 测试失败或环境阻塞时不得声称问题已经修复，必须记录实际结果和后续处理条件。
          - 每项修改和验证必须能追溯到对应的本地评审意见；拒绝、澄清和延期意见不得伪造成已修复。
        artifact: !artifact
          name: 分支问题修复与验证记录
          format: markdown

      - !action
        action: 提交本轮修复的 Git commit。
        actor: agent
        asserts:
          - 只允许提交本轮已接受评审问题产生的修复；不得暂存或提交其他工作区内容，也不得把尚未执行的 master 合入混入该 commit。
          - 存在实际改动时，必须在本轮修复及适用验证达到可提交条件后创建 commit 并记录 commit SHA；没有实际改动时必须记录未创建 commit，不得制造空 commit。
          - 必须在合入 master 前完成本轮修复 commit，并确认不存在尚未提交的本轮修复；无法建立可安全合入的工作区状态时不得继续。
          - 不得自动 push，除非 human 在请求中明确授权。
        artifact: !artifact
          name: 分支修复 Commit 结果
          format: markdown

      - !action
        action: 将 master 合入目标分支并解决冲突。
        actor: agent
        asserts:
          - 必须确认当前位于目标分支、本轮修复已提交且工作区可安全合入，并获取最新 master；不得把目标分支反向合入 master。
          - 必须保留本轮已接受评审问题产生的修复，完成 master 合入并逐项解决全部冲突；不得通过丢弃一方改动或覆盖他人提交规避冲突。
          - 合入或冲突解决后必须重新检查相对基线的完整变更，并运行受合入影响的测试与检查；验证失败时不得声称本轮完成。
          - 必须完成合入所需的 merge commit 并记录 SHA；目标分支已经包含最新 master 时必须记录未创建 merge commit，不得制造空 commit。
        artifact: !artifact
          name: Master 合入与冲突解决记录
          format: markdown

      - !action
        action: 记录本轮评审与修复结果。
        actor: agent
        asserts:
          - 必须以文字记录目标 HEAD SHA、评审覆盖、全部意见及处置、代码改动、验证结果、分支修复 Commit 结果、Master 合入与冲突解决记录、未解决问题和残余风险，作为下一轮避免遗漏和重复处理的基线。
          - 本轮修复 commit 或 master 合入使目标 HEAD 变化时，完成本记录后外层 while 必须继续，并基于本轮最终 HEAD 重新执行只读评审；不得在提交或合入步骤内提前跳回评审。
          - 不得用 GitHub comment、review 或 thread 链接代替本地产物中的完整文字说明。
        artifact: !artifact
          name: 分支评审与修复轮次记录
          format: markdown

  - !action
    action: 汇总代码分支评审与修复结果。
    actor: agent
    asserts:
      - 必须汇总基线与最终 SHA、各轮覆盖、全部意见与处置、master 合入与冲突解决结果、修复提交、验证结果、未完成事项和残余风险。
      - 总结必须能够在不访问 GitHub 评论的情况下独立说明本流程完成的评审与修复工作。
    artifact: !artifact
      name: 代码分支评审与修复总结
      format: markdown
      final: true
