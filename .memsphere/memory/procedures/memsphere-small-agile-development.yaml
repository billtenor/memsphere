!procedure
names:
  - memsphere 小型需求敏捷开发流程
  - memsphere 敏捷需求开发流程
  - memsphere-small-agile-development
defines:
  - 面向 memsphere 工程小型功能、简单功能和轻量体验改进的敏捷需求开发流程。
  - 该流程将几句话或简单图片描述的需求，通过 human 与 agent 的协作，推进到功能开发完成、提需方验收通过，并完成项目回归测试摘要。
  - 该流程不覆盖大型需求、bug 修复、技术重构、架构演进、性能专项或需要复杂评审的需求。
goals:
  - 确保 agent 与 human 对需求理解达成一致后再进入方案和开发。
  - 明确需求交付物、功能范围、不做事项和可验收标准。
  - 在写代码前形成明确的技术方案、测试方案和开发任务清单。
  - 按任务清单完成开发，并完整执行自动化测试、功能测试、项目回归测试和验收标准检查。
  - 在提需方验收通过后形成敏捷需求交付验收报告，包含功能完成说明、验收结论、回归测试摘要和交付结论。
flow:
  - action: 接收 human 提供的小型需求描述、截图或其他上下文材料。
    actor: human
    artifact:
      name: 原始需求描述
      format: markdown

  - !if
    condition:
      action: 判断需求是否可能不适合小型需求敏捷开发流程。
      actor: agent
      artifact:
        name: 需求是否可能不适合本流程
        format: boolean
    then:
      - action: 提醒 human 该需求可能不适合本流程；如果 human 仍希望继续，则后续步骤按本流程执行。
        actor: agent
        artifact:
          name: 流程适用性提醒
          format: markdown
    else:
      - action: 确认该需求可按小型需求敏捷开发流程继续。
        actor: agent
        artifact:
          name: 需求适用性确认
          format: string

  - action: 阅读需求材料并产出简短的需求理解文档。
    actor: agent
    artifact:
      name: 需求理解文档
      format: markdown

  - !while
    condition:
      action: 判断需求理解是否仍需 human 确认或修正。
      actor: agent
      artifact:
        name: 需求理解是否仍需确认或修正
        format: boolean
    do:
      - action: 请 human 确认需求理解是否一致；若不一致，必须说明需修正之处。
        actor: human
        artifact:
          name: 需求理解确认反馈
          format: markdown
      - !if
        condition:
          action: 判断需求理解是否已确认一致。
          actor: agent
          artifact:
            name: 需求理解是否一致
            format: boolean
        then:
          - action: 记录需求理解已确认一致。
            actor: agent
            artifact:
              name: 需求理解确认记录
              format: string
        else:
          - action: 根据 human 反馈修正需求理解文档。
            actor: agent
            artifact:
              name: 修正后的需求理解文档
              format: markdown

  - action: 梳理需求交付物、功能范围、不做事项和验收标准。
    actor: agent
    artifact:
      name: 交付物与验收标准
      format: markdown

  - !while
    condition:
      action: 请 human 判断交付物与验收标准是否仍需确认或修正。
      actor: human
      artifact:
        name: 交付物与验收标准是否仍需确认或修正
        format: boolean
    do:
      - action: 请 human 确认交付物和验收标准是否一致；若不一致，必须说明需修正之处。
        actor: human
        artifact:
          name: 交付物与验收标准确认反馈
          format: markdown
      - !if
        condition:
          action: 判断交付物与验收标准是否已确认一致。
          actor: agent
          artifact:
            name: 交付物与验收标准是否一致
            format: boolean
        then:
          - action: 记录交付物与验收标准已确认一致。
            actor: agent
            artifact:
              name: 交付物与验收标准确认记录
              format: string
        else:
          - action: 根据 human 反馈修正交付物和验收标准。
            actor: agent
            artifact:
              name: 修正后的交付物与验收标准
              format: markdown

  - action: 制定技术方案和测试方案。
    actor: agent
    artifact:
      name: 技术方案与测试方案
      format: markdown

  - !while
    condition:
      action: 判断技术方案与测试方案是否仍需 human 确认或修正。
      actor: agent
      artifact:
        name: 技术方案与测试方案是否仍需确认或修正
        format: boolean
    do:
      - action: 请 human 确认技术方案和测试方案是否认可；若不认可，必须说明需修正之处。
        actor: human
        artifact:
          name: 技术方案与测试方案确认反馈
          format: markdown
      - !if
        condition:
          action: 判断技术方案与测试方案是否已认可。
          actor: agent
          artifact:
            name: 技术方案与测试方案是否认可
            format: boolean
        then:
          - action: 记录技术方案与测试方案已认可。
            actor: agent
            artifact:
              name: 技术方案与测试方案确认记录
              format: string
        else:
          - action: 根据 human 反馈修正技术方案和测试方案。
            actor: agent
            artifact:
              name: 修正后的技术方案与测试方案
              format: markdown

  - action: 基于已确认方案产出开发计划或 task list。
    actor: agent
    artifact:
      name: 开发任务清单
      format: markdown

  - action: 按开发任务清单开发实现需求功能。
    actor: agent
    artifact:
      name: 功能实现摘要
      format: markdown

  - !while
    condition:
      action: 判断测试或 agent 可验收标准是否仍未通过。
      actor: agent
      artifact:
        name: 测试或 agent 可验收标准是否仍未通过
        format: boolean
    do:
      - action: 执行自动化测试、功能测试和项目回归测试，并检查所有 agent 可验收标准。
        actor: agent
        artifact:
          name: 测试与验收检查摘要
          format: markdown
      - !if
        condition:
          action: 判断测试和 agent 可验收标准是否通过。
          actor: agent
          artifact:
            name: 测试和 agent 可验收标准是否通过
            format: boolean
        then:
          - action: 记录测试和 agent 可验收标准已通过。
            actor: agent
            artifact:
              name: 测试与 agent 验收通过记录
              format: string
        else:
          - action: 修正测试失败或 agent 验收失败的问题。
            actor: agent
            artifact:
              name: 测试或 agent 验收修正摘要
              format: markdown

  - !while
    condition:
      action: 请 human 判断提需方验收是否仍未通过。
      actor: human
      artifact:
        name: 提需方验收是否仍未通过
        format: boolean
    do:
      - action: 请 human 基于验收标准进行提需方验收；若未通过，必须说明需修正之处。
        actor: human
        artifact:
          name: 提需方验收反馈
          format: markdown
      - !if
        condition:
          action: 判断提需方验收是否已通过。
          actor: agent
          artifact:
            name: 提需方验收是否通过
            format: boolean
        then:
          - action: 记录提需方验收已通过。
            actor: agent
            artifact:
              name: 提需方验收通过记录
              format: string
        else:
          - action: 根据提需方验收反馈修正需求功能或相关产物。
            actor: agent
            artifact:
              name: 提需方验收修正摘要
              format: markdown
          - action: 重新执行受影响的自动化测试、功能测试和项目回归测试。
            actor: agent
            artifact:
              name: 验收修正后的回归测试摘要
              format: markdown

  - action: 形成最终敏捷需求交付验收报告，必须包含功能完成说明、提需方验收结论、回归测试摘要和交付结论。
    actor: agent
    artifact:
      name: 敏捷需求交付验收报告
      format: markdown
