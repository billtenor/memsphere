!procedure
syntax: memsphere-20260721-stable
names:
  - memsphere-tutorial-chapter-03-review-experience
  - memsphere 教学流程-第三章评审体验
defines:
  - 用一份简短的角色对照运行产物，让人工参与者实际体验一次带评审的流程运行。
asserts:
  - 启动时必须将“人工体验者”绑定到人工参与者。
  - “智能体观察者”可以绑定到可用智能体参与者；没有可用智能体参与者或人工参与者不希望使用时可以跳过。
goals:
  - 产出一份经人工评审，并在可用时同时经智能体评审的运行产物。
  - 让人工参与者在可视化界面中查看运行产物、评审意见、投票、评审轮次和最终结果。
flow:
  - !action
    action: 根据本次流程运行的真实流程执行者、评审槽位和参与者绑定，生成一份简短的流程运行执行角色与评审角色对照。
    actor: agent
    asserts:
      - 必须说明人工操作由人工参与者执行，智能体操作交给流程执行者，流程执行者内部分工由通用智能体框架管理。
      - 必须列出实际绑定的评审者，不得把已跳过的评审槽位表述为已参与。
      - 必须说明评审者只评审运行产物，不接管流程运行步骤，也不直接修改运行产物。
    artifact: !artifact
      name: 流程运行执行与评审角色对照
      type: object
      format:
        name: markdown
        layout: outline
      schema: !schema
        fields:
          - 流程运行执行角色
          - 评审角色
          - 本次实际参与者
          - 设计原因
      review:
        - 人工体验者
        - 智能体观察者

  - !action
    action: 总结本次运行产物评审的参与者、评审意见、投票、评审轮次和最终结果。
    actor: agent
    asserts:
      - 必须根据本次实际评审记录总结，不得编造参与者或结果。
      - 必须提供实际运行 ID（run_id）和可视化界面入口。
    artifact: !artifact
      name: 第三章评审体验完成摘要
      format: markdown
      final: true
