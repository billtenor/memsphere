!procedure
syntax: memsphere-20260719-stable
names:
  - 敏捷需求开发流程
  - 需求敏捷开发流程
  - memsphere-agile-requirement-development
defines:
  - 通过 human 与 agent 的迭代协作，把软件需求推进到当前迭代实现、验证和验收完成。
asserts:
  - 存在更专用且适用的 Procedure 时，不得使用本流程替代。
  - 一次 Run 只推进一个已确认、可独立验收的当前迭代；范围变化必须先更新需求契约并重新确认。
  - 必须完成实际验证并解决阻塞问题，才能进入提需方验收。
goals:
  - 确认当前迭代的范围、交付物和验收标准。
  - 按仓库规范完成实现和验证。
  - 通过提需方验收并形成交付报告。
flow:
  - !action
    action: 调查需求、相关实现和仓库规范，形成当前迭代需求契约。
    actor: agent
    asserts:
      - 读取与需求和验收相关的适用 Statement；在契约中列出采用项，未找到则记“无”并继续。
      - 需求契约必须包含整体目标、当前迭代范围、后续范围、交付物、验收标准和待确认项。
    artifact: !artifact
      name: 当前迭代需求契约
      format: markdown

  - !while
    condition: !action
      action: 请 human 判断当前迭代需求契约是否仍需修正；需要时返回 true，确认后返回 false。
      actor: human
      artifact: !artifact
        name: 当前迭代需求契约是否仍需修正
        type: boolean
    do:
      - !action
        action: 请 human 说明需要修正的内容。
        actor: human
        artifact: !artifact
          name: 当前迭代需求契约修正反馈
          format: markdown
      - !action
        action: 根据反馈补充调查并完整修正当前迭代需求契约。
        actor: agent
        asserts:
          - 范围或规范领域变化时，补充读取相关 Statement。
        artifact: !artifact
          name: 修正后的当前迭代需求契约
          format: markdown

  - !action
    action: 基于已确认的需求契约调查代码，形成实施与验证方案。
    actor: agent
    asserts:
      - 读取与设计、开发和测试相关的适用 Statement；在方案中列出采用项，未找到则记“无”并继续。
      - 方案必须基于实际代码，说明实现方式、影响范围、开发任务和验证方式；待决问题先与 human 对齐。
    artifact: !artifact
      name: 实施与验证方案
      format: markdown

  - !if
    condition: !action
      action: 判断实施与验证方案是否需要 human 确认。
      actor: agent
      asserts:
        - 需求复杂或 human 明确要求审阅方案时，必须返回 true。
      artifact: !artifact
        name: 实施与验证方案是否需要 Human 确认
        type: boolean
    then:
      - !while
        condition: !action
          action: 请 human 判断实施与验证方案是否仍需修正；需要时返回 true，确认后返回 false。
          actor: human
          artifact: !artifact
            name: 实施与验证方案是否仍需修正
            type: boolean
        do:
          - !action
            action: 请 human 说明需要修正的内容。
            actor: human
            artifact: !artifact
              name: 实施与验证方案修正反馈
              format: markdown
          - !action
            action: 根据反馈修正实施与验证方案。
            actor: agent
            artifact: !artifact
              name: 修正后的实施与验证方案
              format: markdown

  - !action
    action: 基于已确认的实施与验证方案产出开发计划或 Task List。
    actor: agent
    artifact: !artifact
      name: 开发计划
      format: markdown

  - !action
    action: 按需求契约、实施与验证方案和开发计划完成开发。
    actor: agent
    asserts:
      - 开发前读取适用的开发规范 Statement；在摘要中列出采用项，未找到则记“无”并继续。
      - 实施必须与需求契约、实施与验证方案和开发计划一致；方案变更必须先完成同等确认。
      - 实现需求涉及的代码、文档、Skill 或 Memory 时，保持相关内容一致。
    suggests:
      - 在满足需求契约和实施与验证方案的前提下，agent 可以自主安排具体实施与验证过程。
    artifact: !artifact
      name: 功能实现摘要
      format: markdown

  - !action
    action: 按验证方案执行测试和验收标准检查。
    actor: agent
    asserts:
      - 验证前读取适用的测试规范 Statement；未找到则按无额外规范继续。
      - 必须实际执行首次验证，记录执行内容、结果和未执行项。
      - 必须区分本轮失败、历史失败和环境阻塞。
    artifact: !artifact
      name: 初始验证报告
      format: markdown

  - !while
    condition: !action
      action: 判断是否仍有阻止提需方验收的未解决问题；存在时返回 true，否则返回 false。
      actor: agent
      artifact: !artifact
        name: 是否仍有验收前未解决问题
        type: boolean
    do:
      - !action
        action: 分类并解决验收前问题，重新执行受影响验证。
        actor: agent
        asserts:
          - 不得通过降低标准或缩小已确认范围制造通过结果。
          - 需要调整需求契约时，必须先取得 human 确认。
        artifact: !artifact
          name: 验收前修复与复测报告
          format: markdown

  - !action
    action: 请 human 基于需求契约、实际功能和验证结果完成提需方验收。
    actor: human
    artifact: !artifact
      name: 提需方验收反馈
      format: markdown

  - !while
    condition: !action
      action: 判断是否仍需根据最新验收反馈修正；需要时返回 true，已通过时返回 false。
      actor: agent
      artifact: !artifact
        name: 是否仍需根据验收反馈修正
        type: boolean
    do:
      - !action
        action: 分类验收反馈，完成当前迭代范围内的修正和验证。
        actor: agent
        asserts:
          - 区分本轮缺陷、新增需求和无关问题；新增需求不得静默并入当前迭代。
          - 新增需求需要纳入本轮时，先更新需求契约并取得 human 确认。
        artifact: !artifact
          name: 验收反馈修正与复测报告
          format: markdown
      - !action
        action: 请 human 重新完成提需方验收。
        actor: human
        artifact: !artifact
          name: 提需方复验反馈
          format: markdown

  - !action
    action: 复核实际改动、验证结果和验收结论，形成交付报告。
    actor: agent
    asserts:
      - 读取适用的交付规范 Statement；未找到则按无额外规范继续。
      - 报告必须包含交付内容、验证结果、验收结论、后续范围和残留问题。
    artifact: !artifact
      name: 敏捷需求开发交付报告
      format: markdown
      final: true

  - !if
    condition: !action
      action: 请 human 判断是否需要 agent 创建本轮 Git commit。
      actor: human
      artifact: !artifact
        name: 是否需要创建本轮 Commit
        type: boolean
    then:
      - !action
        action: 按当前迭代范围检查改动并创建 Git commit。
        actor: agent
        asserts:
          - 读取适用的 Git 规范 Statement；未找到则继续。
          - 只允许提交当前迭代产生的改动，不得暂存或提交其他工作区内容。
        artifact: !artifact
          name: 本轮 Commit 结果
          format: markdown
          final: true
