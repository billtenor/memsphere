!procedure
syntax: memsphere-20260721-stable
names:
  - memsphere 教学流程-第二章
  - memsphere-tutorial-chapter-02
defines:
  - 面向已经完成第一章的用户，介绍 Artifact、Artifact Review、评审席位、参与者及其配置方式。
  - 本章只帮助用户理解相关功能并完成当前环境支持的配置，不发起真实 Artifact Review。
  - 每个教学主题都允许 human 留在当前步骤继续讨论，明确选择进入下一步后才继续。
asserts:
  - 不得修改 System Memory 或覆盖已有用户 Memory；写操作必须说明目标和影响。
  - 不得为教学创建练习 Procedure、启动额外 Run 或发起真实 Artifact Review。
  - 每个教学主题尚未开始或 human 选择继续讨论时必须留在对应 while；只有 human 明确选择进入下一步时才能退出。
  - Human 在任一教学主题中提问时，agent 必须先使用 memsphere 查询并读取相关 Memory；Memory 中没有可靠答案时必须明确说明不知道，不得编造。
goals:
  - 让用户理解 memsphere 为什么通过 Artifact 管控流程执行与产出质量。
  - 让用户理解 Artifact Review、评审席位、参与者及其关系。
  - 让用户理解 Human 与 Agent 参与评审的方式，并完成当前环境支持的参与者配置。
flow:
  - !while
    condition: !action
      action: 检查教学准入要求，判断是否仍有任何一项未满足。
      actor: agent
      asserts:
        - 必须已经安装 memsphere npm 包与 memsphere skill，并存在可用 Project；当前 Workspace 必须绑定 Primary Project。
        - 当前 Project 的 config 与 Memory Store 必须可用，且 memsphere validate 必须通过。
        - memsphere View 必须使用当前环境可访问的 Host 和一个可用端口成功启动，且 agent 已确认访问地址可用；首次配置时端口可以由 agent 随机选择。
        - 必须实际检查 memsphere CLI 与 skill、Project Binding、config、Memory Store 和 memsphere validate 结果，不得依据默认值或历史结果推断。
        - 任一准入项无法确认时，必须判定为尚未满足。
      artifact: !artifact
        name: 是否仍有未满足的教学准入要求
        type: boolean
    do:
      - !action
        action: 定位未满足的准入项，完成 agent 可以安全处理的事项，并为必须由 human 完成的事项给出最小操作和影响说明。
        actor: agent
        asserts:
          - 不得替 human 猜测 Primary Project；需要新建或绑定时说明 `memsphere project create <name> --bind` 或 `memsphere project bind <name>` 的影响。
          - View 尚不可用时，agent 必须根据当前环境选择 Host 和可用端口、启动或重启 View，并实际确认访问地址可用。
        artifact: !artifact
          name: 教学准入处理结果
          format: markdown
      - !if
        condition: !action
          action: 判断教学准入处理结果中是否仍有必须由 human 完成的事项。
          actor: agent
          artifact: !artifact
            name: 是否需要 Human 完成准入操作
            type: boolean
        then:
          - !action
            action: 完成教学准入处理结果中明确标记为必须由 human 执行的操作，并反馈结果。
            actor: human
            artifact: !artifact
              name: Human 准入操作结果
              format: markdown

  - !while
    condition: !action
      action: 判断 human 是否尚未完成“Artifact”教学主题。
      actor: agent
      artifact: !artifact
        name: 是否继续 Artifact 教学
        type: boolean
    do:
      - !action
        action: |-
          介绍 Artifact 的含义和设计理念。首次进入时可以这样表述：
          “Artifact 是一次 Run 中某个执行步骤正式上报的结果。每个可执行 Action 都必须声明并产出 Artifact；用于分支或循环判断的 Action 也会产出 Boolean Artifact。因此，一次 Run 通常会留下多份过程 Artifact 和最终 Artifact，而不会出现执行了步骤却没有结果的空转。
          Artifact 必须带有要求。type、format 和 schema 等确定性规则由 memsphere 代码校验；asserts 和 suggests 是使用自然语言描述的要求。当这些要求需要 Human 或 Agent 校验时，会基于 Procedure 为 Artifact 声明的 Review 完成。
          memsphere 不试图直接控制 Agent 的执行步骤和思考过程，而是要求 Agent 每完成一步都上报 Artifact，再通过确定性校验和必要的 Artifact Review 决定流程能否继续。这样既保留 Agent 的判断空间，也能管控过程和结果。”
          后续轮次根据 human 的问题继续讨论。
        actor: agent
        asserts:
          - 必须区分确定性校验与 Artifact Review，不得声称代码能够理解并自动判断全部自然语言要求。
          - 必须说明 suggests 是改进建议，不得把它表述为与 asserts 等价的强制条件。
        artifact: !artifact
          name: Artifact 教学内容
          format: markdown
      - !action
        action: 选择继续讨论 Artifact，或明确进入下一个教学主题；继续讨论时说明问题或想法。
        actor: human
        artifact: !artifact
          name: Artifact 学习选择
          format: markdown

  - !while
    condition: !action
      action: 判断 human 是否尚未完成“Artifact Review、评审席位与参与者”教学主题。
      actor: agent
      artifact: !artifact
        name: 是否继续 Artifact Review 模型教学
        type: boolean
    do:
      - !action
        action: |-
          介绍 Artifact Review、评审席位、参与者和绑定关系。首次进入时可以这样表述：
          “Artifact Review 用于判断 Run 中已经上报的 Artifact 是否满足当前步骤的要求，并给出评论、投票和改进意见。它评审的是 Artifact，与用于修改 Memory 的 Memory Review 是两套不同机制。
          Procedure 在 Artifact 的 review 字段中声明评审席位。席位表示流程需要的评审视角或职责，例如‘产品负责人’或‘流程把控者’，不是某个具体的人或 Agent。
          参与者是在当前工程配置中登记的具体 Human 或 Agent，例如 Alice 或某个由 Traex 启动的 Agent。启动 Run 时，再把具体参与者绑定到本次 Run 的评审席位。这样，同一份 Procedure 可以在不同工程或不同 Run 中使用不同参与者，而不用修改流程记忆。”
          后续轮次根据 human 的问题继续讨论。
        actor: agent
        asserts:
          - 必须把评审席位表述为 Procedure 内的评审视角或职责，把参与者表述为配置中的具体 Human 或 Agent。
          - 不得把参与者名称直接写入 Procedure 的 review 字段，不得把 Artifact Review 与 Memory Review 混为一谈。
        artifact: !artifact
          name: Artifact Review 模型教学内容
          format: markdown
      - !action
        action: 选择继续讨论 Artifact Review、评审席位与参与者，或明确进入下一个教学主题；继续讨论时说明问题或想法。
        actor: human
        artifact: !artifact
          name: Artifact Review 模型学习选择
          format: markdown

  - !while
    condition: !action
      action: 判断 human 是否尚未完成“Human 与 Agent 参与者”教学主题。
      actor: agent
      artifact: !artifact
        name: 是否继续参与者教学
        type: boolean
    do:
      - !action
        action: |-
          介绍 Human 与 Agent 参与者在 Artifact Review 中的行为。首次进入时可以这样表述：
          “Human 参与者由真实用户完成评审。Artifact Review 开始后，Human 在 View 的 Task 页面打开对应 Run 和当前步骤，在 Artifact Review 浮窗中查看 Artifact，添加评论、选择投票并提交。
          Agent 参与者是由 memsphere 自动启动、承担评审工作的子 Agent。Artifact Review 开始后，memsphere 会把当前评审要求和 Artifact 上下文交给它；子 Agent 通过 memsphere 命令读取评审、提交评论和投票。
          要启动子 Agent，需要为 Agent 参与者选择 ACP Provider 和可选模型。ACP Provider 是 memsphere 连接并启动具体 Agent 产品的适配入口，不是另一个评审角色。
          同一个评审席位在一次 Run 中可以绑定 Human，也可以绑定 Agent。选择哪一种参与者，取决于流程需要的人类判断、自动化程度和可用环境。”
          后续轮次根据 human 的问题继续讨论。
        actor: agent
        asserts:
          - 必须说明 Human 在 View 中完成本人评审，Agent 由 memsphere 通过 ACP 自动启动。
          - 不得声称普通 Agent 文本回复等同于正式评论或投票。
        artifact: !artifact
          name: Human 与 Agent 参与者教学内容
          format: markdown
      - !action
        action: 选择继续讨论 Human 与 Agent 参与者，或明确进入下一个教学主题；继续讨论时说明问题或想法。
        actor: human
        artifact: !artifact
          name: 参与者学习选择
          format: markdown

  - !while
    condition: !action
      action: 判断 human 是否尚未完成“配置中心”教学主题。
      actor: agent
      artifact: !artifact
        name: 是否继续配置中心教学
        type: boolean
    do:
      - !action
        action: |-
          提供已经通过准入检查的 View 访问地址，介绍如何进入设置，以及配置中心中的 ACP Provider 和参与者配置；必须把实际地址输出为可点击的 Markdown 链接，不得保留 Host 或端口占位符。首次进入时可以这样表述：
          “你可以点击 [打开 memsphere View](<实际 View 访问地址>)，再进入设置。使用 127.0.0.1 等 loopback Host 时可以直接进入；使用 0.0.0.0 等非 loopback Host 时，先执行 memsphere view status 获取 settings token，再在设置页输入。
          ‘ACP Provider’用于管理 memsphere 启动 Agent 的命令环境、共享参数和超时，并检测对应 Agent CLI 是否可用；Agent CLI 的安装、认证和模型账户仍由 Provider 自己管理。
          ‘参与者配置’用于维护 Runner 以及具体的 Human、Agent 参与者。参与者包含稳定 ID、显示名称和权限；Agent 参与者还需要选择 ACP Provider 与模型。
          保存设置时，View 会先校验配置并展示变更，确认后才写入当前工程配置。若页面提示磁盘配置与运行配置不一致，再按提示重启 View。”
          后续轮次根据 human 的问题继续讨论。
        actor: agent
        artifact: !artifact
          name: 配置中心教学内容
          format: markdown
      - !action
        action: 可打开 View 查看设置；随后选择继续讨论配置中心，或明确进入参与者配置，继续讨论时说明问题或想法。
        actor: human
        artifact: !artifact
          name: 配置中心学习选择
          format: markdown

  - !while
    condition: !action
      action: 判断 human 是否尚未完成当前环境支持的参与者配置。
      actor: agent
      asserts:
        - 必须依据 human 已明确说明的网络环境、期望参与者和配置结果判断，不得自行假设。
        - 必须确认 human 希望配置哪些 Human 参与者与 Agent 参与者。
        - Human 需要 Agent 参与者时，必须展示 memsphere 支持的 ACP Provider 并由 human 选择需要安装和配置的 Provider。
        - 只有 human 选择 Traex 时，才询问是否处于字节内网；非字节内网用户不支持 Traex，但仍可选择其他 Provider。
        - Human 选择的参与者与 Provider 必须完成配置并通过 memsphere validate；human 明确暂不配置时，应记录结论，不得阻塞本章。
      artifact: !artifact
        name: 是否继续参与者配置
        type: boolean
    do:
      - !action
        action: |-
          询问 human 希望配置哪些 Human 参与者与 Agent 参与者。首次询问时分别给出一个帮助理解的例子：
          “Human 参与者可以是你本人，例如 ID 为 owner、名称为‘项目负责人’，在 View 中亲自评审；Agent 参与者可以是一个子 Agent，例如 ID 为 system-architect、名称为‘系统架构师’，由选定的 Provider 启动并自动评审。”
          同时告诉 human：参与者可以在 View 的“设置 → 参与者配置”中查看和编辑，Provider 可以在“设置 → ACP Provider”中查看和编辑。
          示例只用于解释，不得作为默认配置。需要 Agent 参与者时，说明 memsphere 当前支持 traex、qwen、kimi 和 codex，并询问希望使用的 Provider 与模型；只有选择 Traex 时才询问是否处于字节内网。后续轮次只询问仍缺少或需要修正的信息。
        actor: agent
        asserts:
          - Human 需要 Agent 参与者时，必须先展示全部受支持 Provider，不得替 human 默认选择。
          - 只有 human 选择 Traex 时才能询问字节内网环境，并且 Traex 配置必须以 human 明确处于字节内网为前提。
          - 必须告诉 human 在 View 中查看和编辑参与者与 ACP Provider 的入口。
        artifact: !artifact
          name: 参与者配置询问
          format: markdown
      - !action
        action: 说明希望配置的 Human 与 Agent 参与者、所选 Provider 和模型；补充上一轮指出的缺失信息，或明确暂不配置。
        actor: human
        artifact: !artifact
          name: 参与者配置需求
          format: markdown
      - !action
        action: 根据 human 已确认的需求，安装和检测所选 Provider，配置 Human 与 Agent 参与者，并验证配置结果；只把必须由 human 完成的认证、授权或环境操作列为待办。
        actor: agent
        asserts:
          - 必须保留 config.json 中与本次需求无关的配置，不得写入凭据、Token、API Key 等 Secret。
          - 参与者 ID 必须稳定且不冲突，权限必须来自系统 Catalog，并按实际职责授予。
          - Agent 参与者只能选择已支持的 Provider 和可选模型；Provider 自身要求的认证必须由 human 完成。
          - 修改后必须运行 memsphere validate；View 运行配置尚未生效时必须执行 memsphere view restart。
        suggests:
          - 可先运行 memsphere project show 与 memsphere validate 确认当前 Project，再读取并只修改 Project config 中的 control_plane。
          - Human 参与者写入 control_plane.actors，kind 使用 human，并配置 name 与 permissions。
          - Agent 参与者写入 Project config.json 的 control_plane.actors，kind 使用 agent，并在 agent 中配置 provider 与可选 model；Provider 的非敏感参数和超时写入 Memsphere Home config.json 的 acp_providers。
          - 可使用 View 的 Provider 检测结果了解 CLI 是否已安装；Agent 可以安全完成的安装与检查由 Agent 执行，认证和账户配置交给 human。
          - |-
            仅配置一名 Human 评审者时，可以把下面的 control_plane 合并进现有 config.json：
            ```json
            {
              "control_plane": {
                "runner": {
                  "permissions": [
                    "artifact.read",
                    "artifact.write",
                    "artifact.submit",
                    "decision.decide"
                  ]
                },
                "actors": {
                  "owner": {
                    "kind": "human",
                    "name": "项目负责人",
                    "permissions": [
                      "artifact.read",
                      "decision.assess"
                    ]
                  }
                }
              }
            }
            ```
          - |-
            同时配置 Human 与 Codex Agent 评审者，并覆盖 Codex Provider 超时时，可以参考：
            ```json
            {
              "control_plane": {
                "runner": {
                  "permissions": [
                    "artifact.read",
                    "artifact.write",
                    "artifact.submit",
                    "decision.decide"
                  ]
                },
                "acp_providers": {
                  "codex": {
                    "startup_timeout_ms": 60000,
                    "idle_timeout_ms": 120000,
                    "max_runtime_ms": null
                  }
                },
                "actors": {
                  "owner": {
                    "kind": "human",
                    "name": "项目负责人",
                    "permissions": [
                      "artifact.read",
                      "decision.assess"
                    ]
                  },
                  "system-architect": {
                    "kind": "agent",
                    "name": "系统架构师",
                    "permissions": [
                      "artifact.read",
                      "decision.assess",
                      "decision.challenge"
                    ],
                    "agent": {
                      "provider": "codex",
                      "model": "gpt-5.4"
                    }
                  }
                }
              }
            }
            ```
            示例中的 ID、名称、权限、Provider、模型和超时应按 human 的真实需求调整；不得把示例整体覆盖到已有 config.json。
        artifact: !artifact
          name: 参与者配置执行结果
          format: markdown
      - !if
        condition: !action
          action: 判断参与者配置执行结果中是否仍有必须由 human 完成的认证、授权或环境操作。
          actor: agent
          artifact: !artifact
            name: 是否需要 Human 完成配置操作
            type: boolean
        then:
          - !action
            action: 完成参与者配置执行结果中明确列出的认证、授权或环境操作，并反馈结果。
            actor: human
            artifact: !artifact
              name: Human 配置操作结果
              format: markdown

  - !action
    action: |-
      汇总 human 已理解的 Artifact 管控机制、Artifact Review 模型、参与者差异和已完成配置，列出仍受环境限制的事项，并推荐继续学习 memsphere 教学流程-第三章。
      必须说明本章没有发起真实 Artifact Review；需要继续时，可以这样表述：“你可以使用 memsphere skill，并对我说：‘请你启动 memsphere 教学流程-第三章 的流程。’”
    actor: agent
    artifact: !artifact
      name: memsphere 教学第二章完成摘要
      format: markdown
      final: true
