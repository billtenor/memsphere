!procedure
syntax: memsphere-20260719-stable
names:
  - 处理 memsphere review 流程
  - 应用 memsphere review comments 流程
  - memsphere-review-application
defines:
  - 用于处理 memsphere review comments 的程序性记忆。
  - 适用于 human 明确要求 agent 应用或处理 review comments 的场景，覆盖 memory review 和 task review。
  - 强调以当前目标 memory YAML 为准，并使用 review metadata、snapshot 与 task/run artifacts 作为上下文理解 comment 意图。
goals:
  - 读取并理解指定 review 文件。
  - 根据 review source 收集 memory 或 task/run 上下文。
  - 安全应用可处理的 comments，谨慎记录无法处理的 comments。
  - 更新 review YAML。
  - 向 human 汇报 review 文件路径、最终 review status 和处理摘要。
flow:
  - !action
    action: 接收 human 提供的 review id 或 review 文件路径，以及明确应用或处理 review comments 的诉求。
    actor: human
    artifact: !artifact
      name: review 处理诉求
      format: markdown
  - !action
    action: 在当前运行环境中根据 human 提供的 review id 或路径定位 review 文件；优先使用当前 scope 的 reviewsRoot，读取 review.yaml，并提取 id、status、source、target、memoryRoot、snapshots、comments 和已有 agent.summary。
    actor: agent
    artifact: !artifact
      name: review 元数据和 comments 摘要
      format: markdown
  - !while
    condition: !action
      action: 判断 review 是否尚未处于 submitted 状态。
      actor: agent
      artifact: !artifact
        name: review 是否尚未 submitted
        type: boolean
    do:
      - !action
        action: 提示 human 需要先提交 review，说明当前 review 状态不能直接应用 comments。
        actor: agent
        artifact: !artifact
          name: review 尚未 submitted 提示
          format: markdown
      - !action
        action: 将 review 提交为 submitted，或说明不继续处理该 review。
        actor: human
        artifact: !artifact
          name: review 提交处理结果
          format: markdown
      - !action
        action: 重新读取 review YAML，确认最新 status 和 updatedAt。
        actor: agent
        artifact: !artifact
          name: 重新读取后的 review 状态
          format: markdown
  - !action
    action: 将 review YAML 的 status 更新为 processing，并更新 updatedAt。
    actor: agent
    artifact: !artifact
      name: processing 状态更新结果
      format: markdown
  - !if
    condition: !action
      action: 判断 review source 是否为 task。
      actor: agent
      artifact: !artifact
        name: review source 是否为 task
        type: boolean
    then:
      - !action
        action: 读取 task/run snapshot、运行 artifacts，以及最终仍要修改的目标 memory YAML。
        actor: agent
        artifact: !artifact
          name: task review 上下文
          format: markdown
    else:
      - !action
        action: 读取 review 指向的 memory YAML 和相关 snapshot。
        actor: agent
        artifact: !artifact
          name: memory review 上下文
          format: markdown
  - !action
    action: 按目标 memory、kind、memoryName 或相关目标对象对 comments 分组。
    actor: agent
    artifact: !artifact
      name: comments 分组结果
      format: markdown
  - !while
    condition: !action
      action: 判断是否还有未处理的 comment。
      actor: agent
      artifact: !artifact
        name: 是否还有未处理 comment
        type: boolean
    do:
      - !action
        action: 结合 target、location.anchor、location.hash、snapshot、body、当前 YAML 和 task/run artifacts 上下文理解一条 comment 的修改意图。
        actor: agent
        artifact: !artifact
          name: comment 修改意图判断
          format: markdown
      - !if
        condition: !action
          action: 判断当前 comment 是否仍可安全应用。
          actor: agent
          artifact: !artifact
            name: comment 是否可安全应用
            type: boolean
        then:
          - !action
            action: 对可安全应用的 comment，产出拟修改摘要，说明准备调整的目标、原因、范围和不会改动的内容。
            actor: agent
            artifact: !artifact
              name: comment 拟修改摘要
              format: markdown
          - !while
            condition: !action
              action: 判断 comment 拟修改摘要是否仍需调整。
              actor: human
              artifact: !artifact
                name: comment 拟修改摘要是否仍需调整
                type: boolean
            do:
              - !action
                action: 说明 comment 拟修改摘要需要调整的内容。
                actor: human
                artifact: !artifact
                  name: comment 拟修改摘要调整意见
                  format: markdown
              - !action
                action: 根据 human 调整意见更新 comment 拟修改摘要。
                actor: agent
                artifact: !artifact
                  name: 更新后的 comment 拟修改摘要
                  format: markdown
          - !action
            action: 根据 human 已确认的 comment 拟修改摘要，修改对应 memory YAML，保持 YAML tag、schema 和无关内容不变。
            actor: agent
            artifact: !artifact
              name: comment 应用结果
              format: markdown
        else:
          - !action
            action: 对过期、语义不清或无法安全应用的 comment，记录不处理原因。
            actor: agent
            artifact: !artifact
              name: comment 未处理原因
              format: markdown
  - !action
    action: 运行适合的校验；核心是 memsphere validate，必要时补充 task/run 上下文可读性检查。
    actor: agent
    artifact: !artifact
      name: 校验结果
      format: markdown
  - !while
    condition: !action
      action: 判断是否仍存在未处理 comment、阻塞问题或校验失败。
      actor: agent
      artifact: !artifact
        name: 是否仍有待收敛问题
        type: boolean
    do:
      - !action
        action: 汇总当前未处理 comment、阻塞问题或校验失败原因，并说明下一步需要 human 还是 agent 处理。
        actor: agent
        artifact: !artifact
          name: 待收敛问题摘要
          format: markdown
      - !action
        action: 补充必要判断、确认取舍或提供缺失上下文。
        actor: human
        artifact: !artifact
          name: 收敛问题补充信息
          format: markdown
      - !action
        action: 根据补充信息继续处理可解决的问题，并更新目标 memory YAML 或未处理原因。
        actor: agent
        artifact: !artifact
          name: 收敛处理结果
          format: markdown
      - !action
        action: 重新运行适合的校验；核心是 memsphere validate，必要时补充 task/run 上下文可读性检查。
        actor: agent
        artifact: !artifact
          name: 重新校验结果
          format: markdown
  - !action
    action: 将 review 标记为 done，写入 doneAt、updatedAt 和 agent.summary。
    actor: agent
    artifact: !artifact
      name: 更新后的 review YAML
      type: object
      format: yaml
  - !action
    action: 向 human 汇报 review 文件路径、最终 review status 和处理摘要。
    actor: agent
    artifact: !artifact
      name: 面向用户的处理摘要
      format: markdown
