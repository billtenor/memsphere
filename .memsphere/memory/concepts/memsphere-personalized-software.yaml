!concept
syntax: memsphere-20260721-stable
names:
  - memsphere-personalized-software
  - 个性化软件
  - Personalized Software
defines:
  - 围绕特定个人、团队、组织或行业的真实需求构建，并能随着这些需求和实际使用持续演化的软件。
  - 个性化软件不必从代码或完整系统开始；它可以从一句自然语言 Prompt 开始，在反复使用中逐步沉淀为可复用、可验证、可管理、可持续演化的资产。
  - Prompt 适合表达一次意图并完成当前任务；Skill 适合组织一项专注、边界清晰、可复用的能力；Memsphere 适合组织需要长期运行、持续管理和不断演化的个性化软件。这不是必须走完的升级路线，简单需求可以停留在 Prompt 或 Skill。
  - 个性化软件可以从真实使用中按需生长出 Memory、个性化 CLI、数据和界面四类协作资产，而不要求在诞生的第一天为了形式完整全部建设：Memory 是 Agent 理解并进入软件的语义入口；CLI 封装供 Agent 调用的确定性工具；数据是 CLI 与界面的公共底座；界面是人操作和观察软件的入口。
  - LLM 的 Token 算力适合语义、歧义、判断和变化；CPU、GPU 等传统确定性算力适合明确、重复和机械化的工作。个性化软件应逐步把已经稳定的步骤沉淀到 CLI，把 Token 留给真正需要理解与判断的部分。
