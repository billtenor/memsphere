!concept
syntax: memsphere-20261027-stable
names:
  - memsphere-runner
  - Runner Agent 身份与后台任务
defines:
  - Runner 身份来自当前调用进程的白名单环境变量，Codex 使用 CODEX_THREAD_ID，Traex 使用 TRAECLI_THREAD_ID，Claude Code 使用 CLAUDE_CODE_SESSION_ID；缺失、冲突或非法会话 ID 不猜测目标。
  - Home CommandState 使用 agentType-sessionId 直接拼接 data_id，保留当前 Project、Run、Step 和读取记账；Continue 无需也不接受额外 ID。身份未开启或无法识别时使用原生命令显式定位，Continue 拒绝执行。
  - DaemonTask 是 Home 通用后台任务，首期 type 为 review-wait，保存输入、接收会话、status、error、认领与时间，不保存结果正文。Codex 和 Traex 的 queue 成功后 completed；Claude Code 的本地收件箱写成功后 completed，发送时间和原会话成功回读时间独立保存。轮次变更或开关关闭取消未发送的等待，失败提供查询与显式 retry。
  - daemon 只恢复 queued 任务；崩溃遗留 running 置为 failed 与 recovery 阶段错误，提示可能已经投递，不自动重发。优雅停止可把仍在等待的任务退回 queued，发送中的任务有界等待；Claude Code 未确认的写入不自动重放，已完成发送的任务等待原会话自行回读。
  - review wait 先判断结果是否可返回；可返回时输出轮次、计数和后续动作，按同轮 details 入口读取授权明细，否则按当前 Runner 配置选择异步登记或同步等待，不接受单次同步参数。任务固定原会话和轮次，过期轮次不误投，接收会话不能由命令参数覆盖。
  - daemon 重启恢复 View 的期望启停状态；首次不启动 View，操作系统开机自启动服务暂不安装，机器重启后须显式或由 View/异步命令启动 daemon 才恢复。
  - Memsphere 发往 Agent 会话的通知只有三行：按 Run 冻结语言显示的来源标记和执行提示、定位 Project 与投递轮次的原生 review wait 命令；不携带结果、失败详情、Human 指令或授权。Claude Code 通知命令带投递标识，校验原会话、任务和正式轮次后读取；未观察到回读不改变发送状态。其他 Agent 通知的原生命令指定投递轮次。回读旧通知保留当前会话绑定，Continue 仍跟随当前工作。
  - Claude Code 的异步通知按验证的平台与 CLI 版本启用，并核验原会话的本地收件箱。收件箱不可用时可关闭该 Runner 的异步开关，保留已启用的身份并使用同步等待。
  - 异步等待仅对 queued/running 活动任务去重；历史 completed/failed/cancelled 记录保留，当前仍需等待时可创建新任务，不自动重放历史通知。
