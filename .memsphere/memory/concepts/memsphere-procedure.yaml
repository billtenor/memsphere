!concept
syntax: memsphere-20260721-stable
names:
  - Procedure
  - memsphere-procedure
defines:
  - memsphere 中用于描述一个任务从开始到结束如何执行的 Memory。
  - Procedure 通过 goals 描述目标，通过 asserts 声明全局约束，通过可选 role_bindings 提供 Artifact Review 默认角色绑定，并通过 flow 安排有序 Action、分支、循环和对子流程的调用。
  - Artifact 可以通过 review_role 标记需求、实现、验证或评审材料，并通过 review_requires 声明后续 Artifact Review 必须携带的自包含证据。
  - 同一个 Procedure 可以被多次执行，每次执行形成相互独立的 Run；Run 记录当前步骤、步骤产物和最终交付物。
  - !statement
    asserts:
      - 需要使用 memsphere 遵循 Memory 完成任务时，必须先选择适用的 Procedure，并完整读取或按 Node 读取执行任务所需的内容。
      - 存在适用的专用 Procedure 时必须优先使用；没有适用的专用 Procedure 时使用 memsphere-general-task-execution。
      - Agent 必须使用 memsphere run start 启动 Procedure，并只执行 CLI 当前返回的步骤，不得提前执行尚未返回的步骤。
      - 启动 Run 后必须保存 run id；后续 run report、run enter-schema 和 run repeat 必须显式传入该 id，不得凭名称猜测或混用其他 Run。
      - CLI 返回的 Procedure Asserts 是当前调用链中持续生效的全局约束，Asserts 是当前步骤必须满足的要求，Suggests 是执行时可以参考但不强制满足的建议。
      - CLI 返回的 Actor 表示步骤由 agent 还是 human 执行，Do 或 Ask human to do 表示当前动作，Details 提供补充上下文，Artifact 规定步骤产物及其格式，Then 给出下一条命令。
      - 每个 Action 都必须产生明确的 Artifact；Actor 为 human 时，Agent 必须等待 human 提供结果后再上报和继续。
      - 短内容使用 memsphere run report 的 --artifact 上报，文件产物使用 --artifact-file 上报；带 Schema 的结构化 Markdown 产物可以按照 Then 提示进入 Schema 填写流程。
      - 配置 control_plane 后，每个 Artifact 都必须通过 Runner 的 artifact.submit 鉴权；执行者必须在 report 前阅读 CLI 的自然语言权限说明，拒绝不会改变 Run 状态或写入 Artifact。
      - 完成当前步骤后，必须按照 CLI 返回的 Then 命令上报 Artifact；Run 显示 done 后才能汇报流程完成和最终产物。
  - !ref
    target: schemas/Procedure Schema
