!concept
syntax: memsphere-20260719-stable
names:
  - Concept
  - memsphere-concept
defines:
  - memsphere 中用于解释一个可稳定复用的概念、词汇或领域抽象是什么的 Memory。
  - 用于统一记忆术语，使不同记忆和执行流程对同一概念形成一致理解。
  - Concept 的 defines 可以同时使用文本定义、外部 Memory 引用、匿名 Statement 和匿名 Schema 描述同一个概念；这些成员相互补充并共同生效，不是可任选其一的候选解释。
  - !statement
    asserts:
      - 一份 Concept 记忆应当围绕一个可稳定复用的词汇或领域抽象建立定义。
      - 同一 Concept 的名称与别名应当表达同一个概念，不应引入彼此冲突的含义。
      - 阅读 Concept 时必须完整读取并递归解释全部 defines 成员。
      - 文本 defines 说明概念含义和用途，!ref 连接外部定义，匿名 Statement 补充必须成立的约束，匿名 Schema 补充实例或产物结构。
      - 需要独立判断真假的事实、规则或约束应当使用 Statement 表达。
      - 文档、数据或协作产物的结构应当使用 Schema 表达。
  - !ref
    target: schemas/Concept Schema
extends:
  - Memory
