!concept
syntax: memsphere-20261027-stable
names:
  - memsphere-concept
  - Concept
defines:
  - Concept 是解释稳定概念、词汇或领域抽象的 Memory，使不同读者与 Agent 对其含义、用途、边界和关系形成一致理解。
  - Concept 提供理解其他记忆和流程所需的共同语义；可独立核查的事实与规则由 Statement 表达，执行步骤由 Procedure 表达，内容结构由 Schema 表达。
  - Concept 的撰写与评审依据见 memsphere-concept-writing-rules；合法 YAML 结构由 memsphere-concept-schema 定义。
extends:
  - memsphere-memory
