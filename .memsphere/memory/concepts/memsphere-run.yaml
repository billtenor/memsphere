!concept
syntax: memsphere-20260721-stable
names:
  - memsphere-run
  - Run
defines:
  - 一次有名称、有状态且可追溯的运行，可执行 Procedure，也可承载 Agent 自由探索。
  - 流程执行模式的 Run 按 Procedure 的 flow 逐步推进，同一时刻只有一个当前步骤，并记录每一步的 Artifact、Review 和状态变化。
  - Action 的 actor 只区分 human 与 agent：human 表示 Run 暂停并等待 Human 提供结果，agent 表示由当前 Runner 执行。
  - Runner 是 Memsphere 在当前通用 Agent 框架中的实际执行者。Runner 由 Agent 框架托管：框架只使用主 Agent 时，Runner 就是主 Agent；框架启用子 Agent 时，主 Agent 和子 Agent 共同构成 Runner。Memsphere 只把 Agent Action 交给这个 Runner，不介入 Agent 框架内部如何分工。
  - Artifact Review 是 Run 中对已提交 Artifact 的独立评审环节；Reviewer 负责审查，Runner 仍负责执行和推进。
  - Run 正常完成时进入 done；只有 Human 可以主动将仍在执行的 Run 变为 abandoned。两种终态都保留已有执行证据。
  - 流程执行模式的 Run 的 Artifact、中间产物、Memory 快照文件、Agent 活动日志和活动快照分别由四类 raw 模型描述，经当前或归档 DataStore 按 DataId 访问；资源发现沿用 Run 状态中的业务引用，Memory 快照补充 memorySnapshot.files。
  - 流程执行模式的 Run status 与 .archive.json 仍是原生 JSON 状态文件，不进入内容 Store。归档与恢复先复制覆盖并校验内容，最后切换 Run status，再清理旧端；状态切换后重试只续做清理。
  - 归档或恢复前须确认已有记录的 Agent Worker PID 已退出；无法确认时保留两端并重试，不主动终止 Worker。
  - 流程执行模式的 Run 启动冻结全部可达模型产物的目标绑定和模型指纹；report 及接受写入前检查，变化时明确拒绝。stepExecutionId 持久化且同次失败重试、审核修改重交复用，循环或 Call 的下一次执行生成新身份；业务数据 ID 默认取 run_id 与 stepExecutionId 的组合，显式选择规则见下文。
  - 流程执行模式的模型 Artifact 仍完整保存不可变提交快照，用于 Review、历史查看和追溯；接受后另行将同一模型值整条 upsert 到业务 Store，成功才推进。业务记录后续更新不改变历史快照；Store revision 不是历史内容读取能力，Artifact 不仅保存业务引用。写入后 Run 保存失败时同 ID redo，允许 revision 增长；取消、删除、归档或恢复 Run 不联动删除或重写业务数据。
  - 流程执行模式的模型 Artifact 可通过 run report --write-options 内联 JSON 对象（可选 data_id 字段） 选择稳定业务 ID，仅适用于绑定业务 Store 的普通模型产物（空对象也受此限制）；仅接受 JSON 对象与当前支持的 data_id 字段，不支持文件引用，未知字段或非字符串值拒绝；ID 必须非空白并符合 filesystem JSON ValueStore 可移植文件名规则（含 .json 后缀长度），不修剪或编码。省略时按 Run ID 与 stepExecutionId 生成。首个通过格式及模型校验的候选在评审或业务写入前持久化目标，重试/评审修订省略时继承、同 ID 可重交、不同 ID 拒绝；校验失败尚未冻结目标。不同步骤、循环或 Run 可显式选择同一 ID，执行身份和历史快照仍独立。候选 modelTarget、评审材料和接受 modelData 回执记录业务 ID，接受只写已评审目标；旧记录未含目标字段时按原生成规则处理。写入为无条件整条原子 upsert，最后成功写入覆盖，不合并字段，无 expected-revision 或 CAS，写入后 Run 保存失败以同 ID redo。
  - Run 也可承载没有 Procedure 的自由探索；执行流程模式沿用 flow 调度与原生 RunState，自由探索使用上下文控制五模型的 Store，两种模式并行且不自动迁移。
  - 自由探索通过 run start --name 创建；每份 Artifact 关联一个系统管理的 Step。需要预先阅读材料时使用 run artifact create 声明无正文 draft 目标，读取命令用 --for 目标ID，最后 run report --target 提交同一ID的完整成果；简单完整结果仍可直接 report。纯浏览不创建或切换 Step。
  - 自由探索的 Run、Step、Artifact、External、Review 对应 memsphere/context_control 下五个 .json 模型；默认 Store 为 context_control/runs、steps、artifacts、externals、reviews（后四项同样带 context_control/ 前缀）。Run 的 data_id 是 run_id，其他实体是 run_id/实体_id，值内的 id 仍为实体标识。
  - 自由探索的产物内容由 content.model（definedBy、definition）与 content.payload（contentType、content 字符串）表达，或使用 contentRef（storeId、dataId、sha256）引用固定内容；submitted 必须二选一，声明空 draft 时可都省略。引用内容读取时验证 SHA-256。
  - 自由探索的已提交 Artifact 内容、依赖和修订来源固定；修改或回到历史成果重做时创建新的 Artifact/Step，revisedFrom 指向原成果但不是自动依赖。不提供普通 report --draft 或独立 rewind，Schema 渐进撰写仍走原流程。
  - 每个自由探索 Artifact 自动带 default 标签，额外标签由 --tag 或 artifact tag 添加且仅在当前 Run 生效；--depends-on 支持 artifact:ID、external:ID、tag:名称，标签只在当前提交时展开成已提交成果的具体 ID，不追随后续标签变化，历史版本也匹配。修订省略依赖继承原具体 ID，显式依赖替换，结构化空数组清空；自定义标签不从旧版继承。
  - 自由探索读取 Artifact/External 时，--for 明确目标产物，对应 Step.reads 记录 artifact:ID 或 external:ID 到最近 readAt；不传 --for 只浏览。读取记录只作候选，不自动加依赖或要求确认；正文和文件先成功，记账失败、冲突、超时只告警。--out 排他创建正文文件，不覆盖既有文件。
  - 自由探索的轻量 Review 以 review create --reviewer human/agent 记录意见，重复 --comment 保留多条独立评论，也可使用 --comment-file；两种入口互斥。source 是声明的来源类别，不要求预配置 Actor，不产生正式轮次、投票或生产门禁。
  - 自由探索由 ValueStore 保证单记录 CAS，跨记录由业务服务按 Run 短锁编排。先保存 Artifact，再创建或完成 Step；下一次业务写操作自动按原实体 ID 幂等 redo，已完成直接沿用，缺信息或冲突再报错。内部 redo 不新增成果；没有目标ID的新 CLI 请求不承诺重试去重。改绑保护与存储迁移不在首版。
  - 自由探索用 run finish --artifact 选择一个或多个完整已提交成果作为最终根，交付视图是 dependencies 闭包并集；草稿或未完成提交不能作依赖或根。同根重复 finish 返回原结果，终态不能改选或进行领域变更；Human 决定取消后可 abandon。
  - 自由探索在现有 Run 模块中展示真实产物依赖图；顶部只展示一份 Run 名称和状态，节点保留名称与标签。历史默认收起，选择历史只切换图，点击节点才打开产物内容与评论浮窗；浮窗内翻页保持打开并同步背后依赖图。交付视图从最终根计算，历史选择不修改持久化记录。
