!concept
syntax: memsphere-20260721-stable
names:
  - memsphere-view
  - View
defines:
  - Memsphere 提供给 Human 的本地操作界面，用于查看和操作当前 Project 中的 Memory、Run、Artifact Review 和 ChangeSet。
  - 一个 Memsphere Home 运行一个 View 服务；View 同一时刻展示一个 Project，切换 Project 后页面内容随之切换。
  - View 使用稳定 Shell 组合 Home、Memory、Run 和启用的用户 Module 视图；Home 通过待处理、继续工作与我的模块三个区域汇总当前 Project 状态，ChangeSet 从 Memory 相关入口进入。
  - Shell 提供 navigation.primary、navigation.secondary、content.list、side.panel、search.providers、header.title、header.actions、header.account、sidebar.footer、home.attention、home.continue、home.modules、main.view 与 overlay 十四个根 Slot；Module 只管理 Host 分配的列表、Page、右侧上下文栏或 Overlay 容器。side.panel 默认隐藏，Host 提供 Header 开关、关闭与焦点返回；桌面展开时压缩正文，窄屏以覆盖面板呈现。主导航、二级导航、对象列表和详情形成四栏结构，二级导航栏与对象列表栏支持由用户拖动并在浏览器本地保存宽度；全局搜索由 Host 提供统一浮层并聚合各 Module 的 search Provider。
  - View Framework 分为五层：Shell 管公共区域、尺寸、滚动和响应式；Theme 管共享视觉 Token；UI Primitives 管跨 Module 通用 DOM、状态和交互；Slot 管带类型、可验证的组合关系；Feature/Module 管领域数据、行为和 main.view 内的自由正文。Module 不依赖 Shell 私有 DOM 或 CSS。
  - ViewHost 向 Module 提供 slots、router、版本化 Theme v1 与 UI v1；Plugin 只有同时声明服务与对应 version 才获得 context.theme 或 context.ui。Theme 把公开 --mem-view-* Token 安装到 Shell、element 与 portal root；UI v1 提供动作与确认、Badge 与反馈、Tabs/Segmented、Disclosure、受控表单、Select/Combobox、Progress、Card/Section 和标准内容列表 Mount。常规列表由 ctx.ui.contentList(descriptorOrProvider) 生成后注册到原 content.list，可表达分组、三行信息、多 Badge、尾部操作、展开详情和 loading/empty/error 重试态；复杂领域仍可使用自定义 Mount。
  - 可信本地界面扩展包沿用 Module 的稳定 id、SemVer、View SDK range 与入口协议：Home 全局配置统一保存已安装绝对路径、Slot 及所需实例；同一套界面配置应用到所有 Project。安装建立对本地包的信任，Manifest capability 只声明包提供的内容类型；主题单独选择，页面、组件和全局样式通过 Slot 选择，选择本身即启用对应内容，不再设置重复的 Package 权限。“一键应用全部”只批量填充主题与 Slot。入口、CSS、Theme 与资源受包根 realpath、内容摘要、MIME allowlist 和 Project 隔离 URL 约束。View 服务启动时冻结全局 composition 和规范化 digest，并为全部已注册 Project 构建一致实例；这些实现诊断不在普通设置界面展示，用户只看到已保存、未保存和保存后需重启。
  - ViewHost 的 14 个根 Slot 中，除 Core 保留的 header.account 与运行时生成的 home.modules 外，其余 12 类公开 Slot 均可由界面扩展包声明并在全局“界面配置”表中选择；list Slot 可多选，single/keyed Slot 单选。Memory 与 Run 另提供 page presentation 与 detail/artifact renderer 四个稳定 portable cell，并保留 Route 和业务 API 所有权。外部注册必须与 Manifest 的 cell+id 完全匹配，已显式配置的 Slot 会安全忽略所有未选 contribution；失败候选会 abdicate 并回退到官方 priority 1000 实现。
  - Theme Registry 支持完整 light/dark Theme 和成对的部分 Token override；Theme 与 light/dark/system 模式随整套界面配置应用到所有 Project，历史 Project Theme 字段仍可解析但不参与当前展示。被选中的扩展包 Theme 会创建仅加载主题的受限实例。Package scoped CSS 随实例自动加载且只进入实例 root/portal；global CSS 作为 styles.global@1 多选 Slot 候选，必须在 Manifest 声明并由用户在该 Slot 中选择，且拒绝 @import、远程资源、Host 私有 selector、!important、公共 Token 声明和不可检查的动态 CSS。历史 view_composition.styles 只保留解析兼容，新保存统一写入 Slot。
  - View 设置只提供一个“界面与主题”入口，按“界面扩展包安装、主题配置、界面配置”组织；页面内所有配置均为 Home 全局配置，不显示额外生效范围分组。界面配置以可扩展表格列出全部 20 类用户可配置 Slot，list Slot 使用下拉多选；Memory/Run 的四个位置按“模块 / 具体位置”命名。整页只有一个状态和一个保存按钮，客户端校验后原子写入 Home；revision、digest、running/disk 等实现字段不出现在普通 UI。旧 settings/packages 与 settings/composition 地址兼容进入统一页面。Package 身份不编码 community 或 official 状态，未来可附加 verified/curated 治理元数据而不静默替换用户安装版本。
  - 公共组件 Slot 由 Host 公共 UI 层声明，与框架布局 Slot 和 Module 业务 Slot 区分。content.document、content.flow、content.disclosure 的 v1 default cell 分别提供画布、流程和折叠字段，Memory 与 Run 通过 ctx.ui.contentComponent 重复调用；扩展包声明并注册一次后可全局选择。输入保留调用方的 content 节点和业务事件，支持 defaultRender 默认回退；折叠实现保留原生 details/summary 语义。异步加载和需显式清理的全局副作用仍使用 ViewMount。
  - Memory 与 Run 的官方 renderer 自带系统默认内容视觉，不需要安装或选择 View Package；默认规则保持较低的层叠优先级，使用户选择的 styles.global@1 样式可以在不使用 !important 的情况下覆盖它。示例 View Package 是可独立演进的参考实现，不充当系统默认样式的源或一致性标准。
  - Module 只消费公开 Token 和自身作用域样式，不声明公共 Token、不读取 Host 私有 --view-* 视觉变量、不依赖 .view-shell-* 或 data-view-slot，也不以 !important 覆盖公共壳；实例回滚和 Mount 卸载会清理 Theme root、订阅与其他副作用。
  - 前端原型应建立独立 Module，通过正式 ViewHost、Loader、Route、Slot、Theme 与 UI 组合验证，不为演示框架能力改造 Memory、Run 或 Settings。仓库的 Reference Module 进入 builtin catalog，由正式 memsphere view 在 /reference 提供资产、Boot instance 与导航入口，并展示全部公共组件、主要状态、默认隐藏的 Side Panel 与自由业务正文，以便直接在真实框架中验收和供后续 Module 参考。
  - Human 可以在 Run 页面查看当前步骤、Artifact、参与者和状态；Artifact Review 从对应 Run 步骤进入，由 Run Module 注册到 Host overlay，并保留 Submission、Comment、Vote、Round、Material 与稳定 URL。
  - View 的固定界面文案通过独立语言资源展示，支持 zh-CN 和 en，并跟随 Memsphere Home config.json 的 language；Memory DSL 字段在中文标签与 YAML 原名之间的展示切换是另一项独立偏好，不改变界面语言。
  - 在配置中心成功保存 language 后，当前 View 进程立即更新界面语言，下一次页面加载使用新语言；保存失败不得改变运行中的界面语言。修改 View host 或 port 仍需执行 memsphere view restart。
  - 用户内容、Memory canonical name、Run id、命令、文件路径、ACP Provider 名称、状态码和错误原文等技术标识保持原样；固定按钮、标题、提示、空状态、确认文案、日期格式与 ACP 安装检测说明由当前界面语言决定。
  - View 源码使用可执行静态门禁检查静态模板和动态 DOM 文案入口；除品牌、结构标记和可复制技术命令的最小允许清单外，固定可见文案必须来自界面语言资源或 Memory DSL 标签表。
  - View 中的稳定地址可以让 Human 与 Agent 返回同一个 Project、ChangeSet、Run 或 Review。
  - View 对单条持久化记录实行故障隔离：损坏 ChangeSet 在列表中标为 unavailable，详细错误只在 Human 选择后显示，不阻塞 Memory、记忆市场或其他有效 ChangeSet；记忆市场只跳过明确的 ChangeSet 完整性损坏，非完整性存储故障仍显式失败；单个 Run detail 损坏只在该 Run 详情区报错，不阻塞 Running 列表与其他 Run。
  - View 是 Memsphere 当前的通用管理界面，不等同于某个个性化软件未来生长出的专属界面。
