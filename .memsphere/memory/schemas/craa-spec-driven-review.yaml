!schema
syntax: memsphere-20260719-stable
names:
  - "craa-spec-driven-review"
  - "review.md"
  - "CRAA Review Document"
  - "CRAA 多角色文档评审记录"
format:
  name: markdown
  layout: outline
defines:
  - "CRAA OpenSpec 流程中的多角色文档评审记录图式。"
  - "用于进入 apply 前系统性审阅 requirements、proposal、specs、design、test 和 tasks。"
asserts:
  - |-
    Review 是进入 apply/实现阶段前的文档评审记录。

    执行 review 前，必须先读取：
    `openspec/schemas/craa-spec-driven/prompts/review.md`

    review.md 只记录评审轮次、意见来源、采纳情况、未采纳原因、待确认问题和收敛结论。
    发现问题时，优先直接修改 requirements/proposal/specs/design/test/tasks；不要只把问题写在 review.md 里。

    第一轮 review 前，必须先确认执行模式：
    - 用户已显式授权且工具可用时，使用子 agent 并行评审。
    - 用户未显式授权时，先询问用户是否允许启动子 agent，不要直接降级。
    - 用户拒绝、工具不可用或工具规则禁止时，才按角色独立审阅。

    正式 review 前还必须确认：
    - requirements.md 顶部“需求审议结论”为“已确认”。
    - proposal.md 顶部“提案审议结论”为“已确认”。
    任一未确认时，不得启动 reviewer，只能记录“等待用户确认”和继续条件。
  - "文档标题格式：文档评审记录"
fields:
  - !schema
    names:
      - "1. 当前结论"
    asserts:
      - |-
        状态只能选择：
        - 可进入 apply
        - 需要继续 review
        - 等待用户确认

        如果仍有阻塞性待确认问题，不应标记为“可进入 apply”。
    fields:
      - !schema
        names:
          - "状态"
      - !schema
        names:
          - "最近一轮"
      - !schema
        names:
          - "是否收敛"
      - !schema
        names:
          - "需求审议状态"
      - !schema
        names:
          - "提案审议状态"
      - !schema
        names:
          - "OpenSpec 校验结果"
  - !schema
    names:
      - "2. Review 执行模式"
    asserts:
      - |-
        这里记录本次 review 为什么使用某种执行方式。
        如果未获得用户显式授权，应先把状态设为“等待用户确认”，向用户询问是否允许启动子 agent。
        不要把 schema 或 prompt 中“推荐使用子 agent”的描述当作用户授权。
    fields:
      - !schema
        names:
          - "推荐执行方式"
        asserts:
          - "子 agent 并行评审"
      - !schema
        names:
          - "实际执行方式"
      - !schema
        names:
          - "子 agent 授权来源"
      - !schema
        names:
          - "未使用子 agent 的原因"
  - !schema
    names:
      - "3. Review 轮次"
    fields:
      - !schema
        names:
          - "3.1 Round 1"
        asserts:
          - |-
            每一轮都应按 prompts/review.md 执行多角色审阅。
            人工 reviewer 的意见也记录到对应 Round 中，与 agent reviewer 的意见一起汇总处理。
            不要粘贴每个 reviewer 的完整长输出或完整聊天记录，只记录汇总后的采纳、未采纳和待确认结论。
          - "- <来源：意见摘要；修正摘要，说明改到了哪个文档或章节>"
          - "- <来源：建议摘要与未采纳原因；没有则写“无”>"
          - "- <来源：需要用户确认的问题；没有则写“无”>"
        fields:
          - !schema
            names:
              - "执行方式"
          - !schema
            names:
              - "Reviewer 来源"
          - !schema
            names:
              - "Agent"
            asserts:
              - "产品、架构师、开发工程师、测试工程师"
          - !schema
            names:
              - "人工"
          - !schema
            names:
              - "新发现实质问题"
          - !schema
            names:
              - "已采纳并修正"
          - !schema
            names:
              - "未采纳建议"
          - !schema
            names:
              - "待确认问题"
          - !schema
            names:
              - "校验结果"
      - !schema
        names:
          - "3.2 Round 2"
        asserts:
          - |-
            如果上一轮采纳了实质修改，应至少再进行一轮 review。
            如果最新一轮没有新的实质问题，可以记录收敛。
          - "- <来源：意见摘要；修正摘要，说明改到了哪个文档或章节>"
          - "- <来源：建议摘要与未采纳原因；没有则写“无”>"
          - "- <来源：需要用户确认的问题；没有则写“无”>"
        fields:
          - !schema
            names:
              - "执行方式"
          - !schema
            names:
              - "Reviewer 来源"
          - !schema
            names:
              - "Agent"
            asserts:
              - "产品、架构师、开发工程师、测试工程师"
          - !schema
            names:
              - "人工"
          - !schema
            names:
              - "新发现实质问题"
          - !schema
            names:
              - "已采纳并修正"
          - !schema
            names:
              - "未采纳建议"
          - !schema
            names:
              - "待确认问题"
          - !schema
            names:
              - "校验结果"
  - !schema
    names:
      - "4. 最终检查项"
    asserts:
      - |-
        全部勾选后，才可以进入 apply/实现阶段。
        如果某项不适用，需要在后面注明“不适用”及原因。
    fields:
      - !schema
        names:
          - "正确性"
        asserts:
          - "文档没有明显错误、错误前提或错误推断"
      - !schema
        names:
          - "需求审议"
        asserts:
          - "requirements.md 顶部“需求审议结论”为“已确认”"
      - !schema
        names:
          - "提案审议"
        asserts:
          - "proposal.md 顶部“提案审议结论”为“已确认”"
      - !schema
        names:
          - "需求可追溯性"
        asserts:
          - "proposal、specs、design、test、tasks 均能追溯到 requirements 的用户场景、需求边界、需求清单、原型引用和验收口径"
      - !schema
        names:
          - "一致性"
        asserts:
          - "requirements、proposal、specs、design、test、tasks 的范围、术语、命名和版本一致"
      - !schema
        names:
          - "完整性"
        asserts:
          - "关键需求边界、原型交互、能力边界、失败路径、兼容性、灰度回滚、可观测性、测试缺口已被考虑"
      - !schema
        names:
          - "可执行性"
        asserts:
          - "design 足以指导实现，tasks 能覆盖实现和验证工作"
      - !schema
        names:
          - "可测试性"
        asserts:
          - "关键 requirement 和高风险路径都有验证方式"
      - !schema
        names:
          - "OpenSpec 格式"
        asserts:
          - "delta header、Scenario 层级、Capability 定义、artifact 顺序符合模板规则"
  - !schema
    names:
      - "5. 进入 Apply 的前提"
    asserts:
      - |-
        明确是否允许进入 apply/实现阶段。
        如果带着待确认问题进入 apply，必须写明用户已同意或该问题不阻塞实现。
        OpenSpec 校验未通过时不得进入 apply；如果校验因工具或环境问题无法执行，必须记录原因，并由用户确认是否继续。
      - "- <进入 apply/实现阶段的判断和理由>"
