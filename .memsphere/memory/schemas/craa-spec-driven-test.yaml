!schema
names:
  - "craa-spec-driven-test"
  - "test.md"
  - "CRAA Test Document"
  - "CRAA 测试方案文档"
defines:
  - "CRAA OpenSpec 流程中的测试方案文档图式。"
  - "用于说明如何证明本次变更满足 specs 和 design。"
asserts:
  - |-
    Test 用来回答一个问题：怎么证明这次变更真的满足 specs 和 design。
    
    它不是单元测试 case 清单，也不是把测试代码再抄一遍。
    
    撰写时机：
    - 在 proposal、specs、design 都完成后撰写。
    - 在 tasks.md 之前撰写，tasks 需要把测试方案中的关键验证项拆成可执行任务。
    
    写作原则：
    - 重点写关键行为、关键风险、端到端链路、兼容性和上线前必须确认的验证。
    - 单元测试只写覆盖策略、关键边界和验证入口；具体 case 以测试代码为准。
    - 每个高风险设计点、关键 requirement、兼容性承诺和回滚要求，都应该能在本文找到对应验证方式。
    - 如果某项验证无法自动化，需要说明人工验证步骤、通过标准影响或遗留风险。
  - "文档标题格式：测试方案"
fields:
  - !schema
    names:
      - "1. 测试目标"
    asserts:
      - |-
        用几句话说明这次测试到底要证明什么。
        
        建议回答：
        - 这次最需要证明什么。
        - 哪些行为必须自动化覆盖。
        - 哪些行为需要端到端或人工验证。
        - 哪些风险即使测试通过仍然需要上线观察。
  - !schema
    names:
      - "2. 测试范围"
    fields:
      - !schema
        names:
          - "2.1 本次重点验证"
        asserts:
          - "列出必须进入测试方案的范围。这里写行为、链路、端到端场景和风险，不写所有函数级 case。"
          - |-
            - <重点验证范围 1>
            - <重点验证范围 2>
      - !schema
        names:
          - "2.2 不在本文逐条展开"
        asserts:
          - |-
            说明哪些内容只要求代码测试覆盖，不在 test.md 逐条列出，避免文档复制测试代码。
            
            示例：
            - 纯函数级单元测试 case。
            - SDK 内部小分支 mock case。
            - 参数解析、字段映射、错误码映射等细粒度边界。
          - |-
            - <不逐条展开的测试范围 1>
            - <不逐条展开的测试范围 2>
  - !schema
    names:
      - "3. 关键要求验证表"
    format: table
    items:
      - Schema
    asserts:
      - |-
        把 specs 中的关键 requirement、design 中的关键风险，映射到验证方式。
        不是每个单元测试 case 一行，而是每个关键行为或风险点一行。
        
        自动化程度建议填写：
        - 自动化
        - 半自动
        - 人工
        - 暂不覆盖，并说明原因
      - |-
        表格示例行：
        | <capability> | <requirement 或风险点> | <单元 / 模块 / 链路 / 端到端 / 人工> | <关键验证场景> | <自动化程度> | <备注> |
    fields:
      - !schema
        names:
          - "Capability"
      - !schema
        names:
          - "Requirement / 风险点"
      - !schema
        names:
          - "验证方式"
      - !schema
        names:
          - "关键场景"
      - !schema
        names:
          - "自动化程度"
      - !schema
        names:
          - "备注"
  - !schema
    names:
      - "4. 测试类型与覆盖策略"
    asserts:
      - |-
        这一节说明不同粒度的测试分别覆盖什么。
        不用追求每一类都很长；小变更可以只写涉及的测试类型。
    fields:
      - !schema
        names:
          - "4.1 单元测试"
        asserts:
          - |-
            验证函数、类、小段纯逻辑。
            只写覆盖策略和关键边界，不逐条列 case。
            
            建议说明：
            - 哪些纯逻辑必须有单元测试。
            - 哪些边界必须覆盖。
            - 使用什么测试框架或验证入口。
          - |-
            - <单元测试覆盖策略 1>
            - <单元测试覆盖策略 2>
      - !schema
        names:
          - "4.2 模块测试"
        asserts:
          - |-
            验证一个可独立封装的模块或组件，通常仍然使用单测框架运行，外部依赖用 mock / fake / stub。
            
            示例：
            - SDK client 使用 fake HTTP server。
            - SinkFunction 使用 fake SDK。
            - DAO 使用测试数据库或 testcontainer。
          - |-
            - <模块测试场景 1>
            - <模块测试场景 2>
      - !schema
        names:
          - "4.3 链路测试"
        asserts:
          - |-
            验证多个真实模块组合后的链路，尽量少 mock。
            重点看模块之间的协议、状态、错误传播、资源生命周期是否正确。
            
            示例：
            - API + workflow + storage。
            - batch job + parser + sink + SDK。
            - 异步任务创建 + 状态查询 + 结果持久化。
          - |-
            - <链路测试场景 1>
            - <链路测试场景 2>
      - !schema
        names:
          - "4.4 端到端测试"
        asserts:
          - |-
            验证从真实入口到最终结果的完整链路。
            涉及 Dorado、Flink、HDFS、TCE、K8s、外部服务、上线环境时，需要明确环境、输入、输出和人工检查点。
          - |-
            - <端到端测试场景 1>
            - <端到端测试场景 2>
  - !schema
    names:
      - "5. 测试环境与依赖"
    format: table
    items:
      - Schema
    asserts:
      - |-
        说明测试需要哪些环境、依赖、配置、账号或资源。
        
        注意：
        - 不要写明文 token、密钥、DSN 等敏感信息。
        - 如果依赖外部平台，需要说明测试环境和生产环境的差异。
        - 如果某些依赖只能 mock，也要说明 mock 与真实依赖的差距。
      - |-
        表格示例行：
        | <环境或依赖> | <用途> | <配置方式> | <风险或限制> |
    fields:
      - !schema
        names:
          - "环境 / 依赖"
      - !schema
        names:
          - "用途"
      - !schema
        names:
          - "配置方式"
      - !schema
        names:
          - "风险或限制"
  - !schema
    names:
      - "6. 测试数据设计"
    format: table
    items:
      - Schema
    asserts:
      - |-
        说明关键测试数据类别，不要求贴完整大样本。
        
        建议覆盖：
        - 正常输入
        - 边界输入
        - 非法输入
        - 重复输入 / 重跑输入
        - 大批量输入
        - 包含敏感字段的输入
        - 兼容旧格式或旧行为的数据
      - |-
        表格示例行：
        | <数据类别> | <验证目的> | <样例说明> | <预期结果> |
    fields:
      - !schema
        names:
          - "数据类别"
      - !schema
        names:
          - "目的"
      - !schema
        names:
          - "样例说明"
      - !schema
        names:
          - "预期结果"
  - !schema
    names:
      - "7. 关键验证场景"
    asserts:
      - |-
        只列系统级、链路级、端到端或高风险场景。
        不要把所有单元测试 case 塞进来。
    fields:
      - !schema
        names:
          - "7.1 场景：<场景名称>"
        fields:
          - !schema
            names:
              - "前置条件"
          - !schema
            names:
              - "输入 / 操作"
          - !schema
            names:
              - "预期结果"
          - !schema
            names:
              - "验证方式"
      - !schema
        names:
          - "7.2 场景：<场景名称>"
        fields:
          - !schema
            names:
              - "前置条件"
          - !schema
            names:
              - "输入 / 操作"
          - !schema
            names:
              - "预期结果"
          - !schema
            names:
              - "验证方式"
  - !schema
    names:
      - "8. 失败场景验证"
    format: table
    items:
      - Schema
    asserts:
      - |-
        列出必须验证的失败路径、超时、重试、幂等、降级、取消和资源释放场景。
        对长耗时、异步、并发、外部依赖调用尤其重要。
        
        如果无法真实注入故障，可以说明使用 mock、fake server、测试开关或人工方式模拟。
      - |-
        表格示例行：
        | <故障场景> | <如何注入或模拟> | <系统应该如何表现> | <如何验证> |
    fields:
      - !schema
        names:
          - "故障场景"
      - !schema
        names:
          - "注入方式"
      - !schema
        names:
          - "预期行为"
      - !schema
        names:
          - "验证方式"
  - !schema
    names:
      - "9. 兼容性与回归验证"
    asserts:
      - "说明如何证明本次变更没有破坏既有行为、既有数据、既有配置、既有部署或既有调用方。"
      - |-
        - <兼容性或回归验证项 1>
        - <兼容性或回归验证项 2>
  - !schema
    names:
      - "10. 测试执行与通过标准"
    asserts:
      - |-
        这一节回答两个问题：测试按什么顺序执行，以及满足什么条件才算测试通过。
        如果变更很小，可以写得很短；如果涉及平台、打包、上线或人工验证，必须写清楚。
        
        建议包含：
        - 本地验证入口
        - CI / 端到端测试入口
        - 人工验证步骤
        - 失败时是否阻断合入或发布
    fields:
      - !schema
        names:
          - "10.1 执行顺序"
        asserts:
          - |-
            1. <第一步验证>
            2. <第二步验证>
            3. <第三步验证>
      - !schema
        names:
          - "10.2 通过标准"
        asserts:
          - |-
            - <通过标准 1>
            - <通过标准 2>
  - !schema
    names:
      - "11. 遗留风险"
    asserts:
      - |-
        记录测试无法完全覆盖、只能上线观察或需要后续补充的风险。
        不要把已知高风险但无验证方案的问题静默省略。
      - |-
        - <遗留风险 1>
        - <遗留风险 2>
