!schema
syntax: memsphere-20260719-stable
names:
  - "craa-spec-driven-requirements"
  - "requirements.md"
  - "CRAA Requirements Document"
  - "CRAA 需求文档"
format:
  name: markdown
  layout: outline
defines:
  - "CRAA OpenSpec 流程中的产品和业务需求文档图式。"
  - "用于把 PRD、业务诉求、用户反馈或讨论结论收敛成当前 change 可审阅的需求输入。"
asserts:
  - "文档标题格式：需求文档：<需求名称>"
  - |-
    Requirements 用来回答：为什么要做、给谁用、用户期望什么、业务侧怎样验收。

    它是 proposal 的上游输入，不负责工程 capability 划分，也不展开技术方案。
    如果已有独立 PRD，可以在本文引用 PRD，并把与本次 OpenSpec change 直接相关的需求结论收敛到这里。

    写作边界：
    - 应该写业务背景、使用方、用户场景、需求边界、需求清单、原型与交互说明、非功能诉求和业务验收标准。
    - 不应该写代码结构、模块拆分、数据库表设计、接口调用编排、测试执行入口或开发任务。
    - 如果业务强制指定技术平台或外部系统，可以作为约束写入；具体接入方案放到 design.md。

    澄清优先：
    - 写正文前先判断需求本身是否足够清楚。
    - 如果目标用户、核心问题、需求边界、需求清单、原型冲突或验收口径不清楚，必须把状态标为“待澄清”，只记录已知事实和阻塞问题，然后停止并向用户提问。
    - 提问时直接问缺失事实和业务判断，不替用户枚举方案、做权衡或默认选择。
    - 只有不存在阻塞性需求不清楚时，才继续完成完整 requirements.md，并把状态标为“待确认”。
fields:
  - !schema
    names:
      - "需求审议结论"
    fields:
      - !schema
        names:
          - "状态"
        asserts:
          - "待澄清 / 待确认 / 已确认"
      - !schema
        names:
          - "审议人"
      - !schema
        names:
          - "审议时间"
      - !schema
        names:
          - "结论摘要"
      - !schema
        names:
          - "阻塞问题"
      - !schema
        names:
          - "继续条件"
        asserts:
          - "状态为“已确认”，且用户明确同意后，才进入 proposal。"
  - !schema
    names:
      - "1. 需求概述"
    fields:
      - !schema
        names:
          - "1.1 背景"
        asserts:
          - |-
            说明业务背景、问题来源、为什么现在要做。
            如果已有 PRD、工单、会议纪要或用户反馈，必须引用来源。
        fields:
          - !schema
            names:
              - "需求来源"
          - !schema
            names:
              - "提出方 / 需求负责人"
          - !schema
            names:
              - "目标版本 / 时间窗口"
          - !schema
            names:
              - "背景摘要"
      - !schema
        names:
          - "1.2 目标用户 / 使用方"
        asserts:
          - |-
            说明谁会使用或依赖这个能力。
            可以是最终用户、运营、内部系统、数据消费方、运维人员或其他平台。
      - !schema
        names:
          - "1.3 核心问题"
        asserts:
          - |-
            说明当前用户或业务链路遇到什么问题、缺少什么能力。
            这里写用户可感知或业务可感知的问题，不写工程实现缺口。
      - !schema
        names:
          - "1.4 目标与成功标准"
        asserts:
          - |-
            说明需求完成后业务侧希望达到什么结果。
            这里写业务成功标准，不写测试方案、测试命令或技术验收步骤。
  - !schema
    names:
      - "2. 用户场景"
    asserts:
      - |-
        用户场景描述具体使用过程，帮助 proposal 判断工程能力边界。
        每个场景应说明使用方、触发条件、当前流程、期望流程和用户可见结果。
        如果需求很小，可以只写一个场景。
    fields:
      - !schema
        names:
          - "2.1 场景：<场景名称>"
        fields:
          - !schema
            names:
              - "使用方"
          - !schema
            names:
              - "触发条件"
          - !schema
            names:
              - "当前流程 / 当前问题"
          - !schema
            names:
              - "期望流程"
          - !schema
            names:
              - "用户可见结果"
          - !schema
            names:
              - "失败或异常时的期望"
  - !schema
    names:
      - "3. 需求边界"
    asserts:
      - |-
        需求边界只负责界定本次业务需求覆盖什么、不覆盖什么。
        不要在这里逐条写功能需求；可验收的需求条目放到“需求清单”。

        先写前提与假设，是因为本次覆盖和本次不覆盖通常依赖这些前提。
        如果某条“假设”其实是系统必须保证的行为，不要放在假设里，应进入需求清单或非功能需求。
    fields:
      - !schema
        names:
          - "3.1 前提与假设"
        asserts:
          - |-
            写本需求成立所依赖的业务、数据、权限、平台、时间窗口等前提。

            示例：
            - 使用方已经具备访问目标数据的业务权限。
            - 上游系统能够提供本次需求约定的数据范围。

            反例：
            - 系统必须校验用户权限。这个是系统行为要求，应写入需求清单或非功能需求。
      - !schema
        names:
          - "3.2 本次覆盖"
        asserts:
          - |-
            在上述前提成立时，本次覆盖哪些场景、用户、数据、流程或业务对象。
            这里写需求边界，不写具体实现任务。
      - !schema
        names:
          - "3.3 本次不覆盖"
        asserts:
          - |-
            明确排除哪些相邻场景、异常情况、用户类型、数据类型、平台或后续阶段能力。
            本次不覆盖用于防止需求膨胀，也帮助 proposal 写清“不提供的能力边界”和“本次不做”。
  - !schema
    names:
      - "4. 需求清单"
    type: array
    format:
      name: markdown
      layout: table
    asserts:
      - |-
        需求清单写可验收的用户可见需求。
        每条需求应能追溯到用户场景，并能被后续 proposal/spec/test 进一步翻译和验证。
        如果需求有原型图、截图或交互稿，表格中只写原型 ID；图片和交互说明放到“原型与交互说明”章节。

        优先级建议：
        - P0：没有它需求不可用或无法验收。
        - P1：应随本次交付，否则明显影响使用效果或业务目标。
        - P2：建议支持，但可延期。

        不要把开发任务写成需求，例如“新增 xxx 类”“修改 xxx 表”“编写单元测试”。
      - |-
        表格示例行：
        | R-001 | <用户希望系统支持什么> | P0 | <场景> | P-001 | <怎样算满足> |
    item: !schema
      type: object
      fields:
        - !schema
          names:
            - "ID"
        - !schema
          names:
            - "需求描述"
        - !schema
          names:
            - "优先级"
        - !schema
          names:
            - "来源场景"
        - !schema
          names:
            - "原型引用"
        - !schema
          names:
            - "验收口径"
  - !schema
    names:
      - "5. 原型与交互说明"
    asserts:
      - |-
        原型与交互说明用于承载截图、原型图、页面状态和关键交互。
        需求清单中通过 `原型引用` 列关联这里的原型 ID。

        注意：
        - 原型用于表达业务交互和用户可见结果，不约束最终技术实现细节。
        - 如果没有原型，写“无”；不要为了填充模板而临时编造图片。
        - 图片建议放在当前 change 的 `assets/` 目录下，并使用相对路径引用。
    fields:
      - !schema
        names:
          - "P-001：<原型名称>"
        asserts:
          - "![<原型名称>](./assets/<prototype-image>.png)"
        fields:
          - !schema
            names:
              - "关联需求"
            asserts:
              - "R-001"
          - !schema
            names:
              - "页面 / 入口"
          - !schema
            names:
              - "关键交互"
          - !schema
            names:
              - "边界状态"
          - !schema
            names:
              - "备注"
            asserts:
              - "原型仅表达业务交互，不约束最终 UI 实现细节。"
  - !schema
    names:
      - "6. 非功能需求"
    asserts:
      - |-
        写业务侧可感知、可约束或可验收的非功能诉求。
        如果某项不涉及，写“不涉及”；不要留空。
    fields:
      - !schema
        names:
          - "6.1 性能与容量"
      - !schema
        names:
          - "6.2 可用性与稳定性"
      - !schema
        names:
          - "6.3 兼容性"
  - !schema
    names:
      - "7. 验收标准"
    asserts:
      - |-
        写业务验收标准，描述需求满足时外部可观察到的结果。
        不要写测试框架、测试命令、mock 方式或 CI 入口；这些放到 test.md。
    fields:
      - !schema
        names:
          - "A-001"
      - !schema
        names:
          - "A-002"
  - !schema
    names:
      - "8. 未决问题"
    type: array
    format:
      name: markdown
      layout: table
    asserts:
      - |-
        记录需求阶段尚未关闭的问题。
        如果问题会影响范围、验收或优先级，应标为阻塞，并在进入 proposal 前确认；如果不阻塞，也要说明影响。
      - |-
        表格示例行：
        | <待确认问题> | 是 / 否 | <影响范围> | <负责人> | <时间> |
    item: !schema
      type: object
      fields:
        - !schema
          names:
            - "问题"
        - !schema
          names:
            - "是否阻塞"
        - !schema
          names:
            - "影响"
        - !schema
          names:
            - "Owner"
        - !schema
          names:
            - "期望确认时间"
  - !schema
    names:
      - "9. 参考资料"
    fields:
      - !schema
        names:
          - "PRD / 讨论记录"
      - !schema
        names:
          - "原型 / 截图"
      - !schema
        names:
          - "相关数据 / 工单"
      - !schema
        names:
          - "历史需求"
