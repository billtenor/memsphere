!schema
syntax: memsphere-20260719-stable
names:
  - "craa-spec-driven-proposal"
  - "proposal.md"
  - "CRAA Proposal Document"
  - "CRAA 技术侧需求分析文档"
format:
  name: markdown
  layout: outline
defines:
  - "CRAA OpenSpec 流程中的技术侧需求分析文档图式。"
  - "用于把已确认 requirements 翻译成工程变更边界、能力范围和 OpenSpec capability。"
asserts:
  - "文档标题格式：提案：<变更名称>"
  - |-
    Proposal 用来回答：这次工程变更要交付什么系统能力、边界在哪里、可能影响哪里。

    它依赖已确认的 requirements.md，不重新定义业务需求，也不展开详细技术方案。

    写作边界：
    - 应该写需求来源摘要、现状缺口、能力定义、工程变更范围、影响面预判、风险与约束摘要。
    - 不应该写完整用户故事、完整验收标准、代码结构、接口调用编排、测试执行入口或开发任务清单。
    - 如果写 proposal 时发现 requirements 的目标用户、需求边界、需求清单、原型引用或验收口径仍不清楚，应停止并退回 requirements 澄清，不要在 proposal 中替用户补假设。
    - 如果只是技术方案尚未确定，可以写入“待技术方案确认的问题”，并停在 proposal 审议，不直接进入 design。
fields:
  - !schema
    names:
      - "提案审议结论"
    fields:
      - !schema
        names:
          - "状态"
        asserts:
          - "待确认 / 已确认"
      - !schema
        names:
          - "需求审议依据"
        asserts:
          - "requirements.md 状态已确认，确认来源："
      - !schema
        names:
          - "审议人"
      - !schema
        names:
          - "审议时间"
      - !schema
        names:
          - "结论摘要"
      - !schema
        names:
          - "待确认问题"
      - !schema
        names:
          - "继续条件"
        asserts:
          - "状态为“已确认”，且用户明确同意后，才进入 specs/design/test/tasks/review。"
  - !schema
    names:
      - "1. 背景"
    asserts:
      - |-
        本节只负责建立需求来源和工程上下文，不重复完整 requirements，也不展开技术方案。
        必须引用本 change 的 `requirements.md`；如果还有独立 PRD，也应引用。
        这里只摘要和本次工程变更直接相关的需求结论。
    fields:
      - !schema
        names:
          - "1.1 需求来源"
        asserts:
          - |-
            必填：
            - PRD / 需求文档链接
            - requirements.md 路径
            - 需求负责人或提出方，若已知
            - 技术负责人或承接方，若已知
            - 相关时间点、版本或上线窗口，若已知
        fields:
          - !schema
            names:
              - "requirements.md"
          - !schema
            names:
              - "PRD"
          - !schema
            names:
              - "需求方"
          - !schema
            names:
              - "技术承接"
          - !schema
            names:
              - "目标版本 / 时间"
      - !schema
        names:
          - "1.2 需求摘要"
        asserts:
          - |-
            用 3-5 句话摘要 requirements.md 中已经确定的需求结论。

            应该写：
            - 业务侧已经确认要达成什么结果，或支持什么用户可见能力
            - 该能力对系统外部表现的大致要求
            - 与本次工程变更直接相关的约束

            不应该写：
            - 完整业务背景
            - 完整用户故事
            - 详细交互流程
            - 大段验收标准
      - !schema
        names:
          - "1.3 名词解释（可选）"
        asserts:
          - |-
            只解释上下游或本系统相关、且在本次需求中有专用含义的领域概念，不写成百科。
            公司内部平台或系统缩写不需要解释；这类文档默认面向公司内部同学。

            适合解释：
            - 上下游系统对同一个词有不同语义的概念
            - 本系统里有特定含义的业务对象、数据对象或状态
            - 会影响能力边界、对外使用方式或验收口径的关键字段
            - 容易误解的运行语义，例如同步接口、异步接口、at-least-once、exactly-once、幂等

            更详细的技术解释放到 design.md。
      - !schema
        names:
          - "1.4 现状分析"
        asserts:
          - |-
            说明当前 CRAA 已有什么、缺什么，以及为什么 requirements.md 中的需求需要工程变更。

            应该写：
            - 当前相关系统、模块或链路现状
            - 当前缺口是什么
            - 该缺口为什么不能只通过配置、文档或运维操作解决
            - 该缺口对应到哪些能力边界需要被补齐
            - 与 requirements.md 中哪些用户场景或需求条目相关

            不应该写：
            - 本次具体采用什么技术方案
            - 第一版调用哪个具体接口、传哪些固定参数、按什么顺序查询或重试
            - 目录结构、调度参数、SDK client、打包产物、代码结构等实现细节
            - 详细幂等、失败处理、灰度回滚、测试策略

            如果这些信息已经明确，应放到 design.md、test.md 或 tasks.md；现状分析里最多用一句话说明“详细方案见 design.md”。

            示例：
            当前 CRAA 已提供在线内容处理接口和同步/异步任务语义，业务侧也已有离线数据加工链路，但仓库内尚无面向批处理作业的标准批量接入能力。因此 requirements.md 中的批量接入需求，需要补齐“从标准离线输入到 CRAA 内容处理入库”的稳定能力边界；具体子工程、任务编排、SDK 调用和打包方式在 design.md 中展开。
      - !schema
        names:
          - "1.5 参考资料"
        asserts:
          - |-
            参考资料帮助后续 agent、reviewer 和实现者快速补齐上下文。
            可包含 requirements、PRD、方案文档、平台文档、官方 demo 路径、相关系统线索、历史 issue/MR/change。
        fields:
          - !schema
            names:
              - "requirements"
          - !schema
            names:
              - "PRD"
          - !schema
            names:
              - "方案文档"
          - !schema
            names:
              - "官方文档 / demo"
          - !schema
            names:
              - "相关系统 / 代码线索（可选，不要求列具体文件）"
  - !schema
    names:
      - "2. 能力定义"
    asserts:
      - |-
        能力定义是 proposal 中最重要的 OpenSpec 结构。
        它先于变更范围出现，用来说明本次完成后 CRAA 对调用方、使用方或运维方新增或改变什么稳定行为。

        能力不是零散功能点、文件清单、模块清单或任务清单。
        可以把能力理解为“一组功能组合后形成的稳定使用场景或系统承诺”。

        判断标准：
        - 能独立表达一个可被使用、可被验收、可长期维护的系统行为，才适合上升为 capability
        - 单个接口、单个参数、单个解析动作通常只是功能点
        - 每个 capability 必须能追溯到 requirements.md 中的需求 ID、用户场景或验收口径
        - 如果无法追溯，先回到 requirements 澄清，或将该能力移出本次 proposal

        不推荐：
        - `json-parser`: 支持解析 JSON 输入。
        - `craa-http-call`: 支持调用 CRAA HTTP 接口。

        推荐：
        - `batch-content-ingestion`: 支持从标准离线输入读取业务记录，调用 CRAA 内容处理能力，并按已确认的幂等语义完成入库。
    fields:
      - !schema
        names:
          - "2.1 新增能力"
        asserts:
          - |-
            新增 capability 使用 kebab-case 命名。
            每个新增 capability 都需要对应 `specs/<capability>/spec.md`。
            用一句话说明该能力覆盖的系统行为和边界，并标注来源需求。
        fields:
          - !schema
            names:
              - "<capability-name>"
          - !schema
            names:
              - "来源需求"
            asserts:
              - "R-xxx / 场景 x.x"
          - !schema
            names:
              - "使用方 / 视角"
          - !schema
            names:
              - "行为边界"
      - !schema
        names:
          - "2.2 修改既有能力"
        asserts:
          - |-
            只有既有 `openspec/specs/<capability>/spec.md` 的行为契约需要变化时，才填写这里。
            代码实现细节变化不一定等于 capability 修改。
            只有外部行为、接口契约、数据语义或运行语义发生变化时，才应列为修改既有能力。

            如果没有既有能力需要修改，写：
            当前无既有 OpenSpec capability 需要修改。
        fields:
          - !schema
            names:
              - "<existing-capability-name>"
          - !schema
            names:
              - "来源需求"
            asserts:
              - "R-xxx / 场景 x.x"
          - !schema
            names:
              - "当前行为"
          - !schema
            names:
              - "目标行为"
          - !schema
            names:
              - "边界变化"
      - !schema
        names:
          - "2.3 不提供的能力边界"
        asserts:
          - |-
            说明本次完成后系统不承诺哪些行为。这里描述的是能力边界，不是工程任务边界。

            这些边界必须与 requirements.md 的“本次不覆盖”一致；如果发现冲突，应退回 requirements 或 proposal 审议，不要在这里单方面改写需求边界。

            适合写：
            - 不支持的使用方式
            - 不承诺的运行语义
            - 不覆盖的数据来源、输入格式或平台类型
            - 暂不纳入本能力的上下游场景

            示例：
            - 第一版不提供实时消费能力。
            - 第一版不支持任意输入格式自动适配。
            - 第一版不承诺跨系统强一致写入语义。
  - !schema
    names:
      - "3. 变更范围"
    asserts:
      - |-
        变更范围说明为了实现上述能力，本次工程上做什么、改什么、不做什么。
        这里仍然不展开具体技术方案。

        判断规则：
        - 变更范围是能力定义的工程落点
        - 一个能力可能需要多个变更支撑
        - 一个变更也可能同时服务多个能力
        - 如果某个工程动作无法对应到能力定义、风险约束或必要交付要求，应重新判断它是否属于本次 proposal
        - 这里写交付边界，不写 tasks.md 的逐项开发清单
    fields:
      - !schema
        names:
          - "3.1 本次新增"
        asserts:
          - |-
            列出新增的工程模块、接口、运行作业、处理链路、配置、文档或交付物。
            不要写到具体文件路径、类名或函数级别，除非该边界已经非常确定。
      - !schema
        names:
          - "3.2 本次修改"
        asserts:
          - |-
            列出对既有模块、接口、配置、文档或运行链路的修改。
            如果没有修改既有工程内容，写“无”。
      - !schema
        names:
          - "3.3 本次不做"
        asserts:
          - |-
            说明工程上不修改什么、不新增什么、不交付什么，防止范围膨胀。

            注意区分：
            - `不提供的能力边界`：系统行为不承诺什么
            - `本次不做`：工程实现不修改什么、不新增什么、不交付什么

            示例：
            - 第一版不新增实时消费入口。
            - 第一版不改变既有在线服务部署方式。
            - 第一版不改造服务端写入协议来提供更强的一致性承诺。
  - !schema
    names:
      - "4. 影响面预判"
    asserts:
      - |-
        影响面预判用于帮助 reviewer 在 proposal 阶段判断变更可能波及哪些系统边界。
        它不是详细技术方案，也不要求列出具体代码文件、package、class 或 module。

        proposal 阶段通常还没有完成技术方案，因此这里写的是“可能影响哪里”和“哪些影响需要在 design.md 技术方案中确认”，而不是“具体改哪些代码”。

        应该写：
        - 是否可能影响服务端 API、SDK、任务平台、存储、配置、发布链路等系统边界
        - 是否可能影响已有用户、已有任务、已有配置或已有数据
        - 哪些影响已经确定，哪些还需要在 design.md 技术方案中确认
        - 哪些使用方可见的接口、参数、格式或语义明确不会变化

        不应该写：
        - 具体会修改哪些代码文件
        - 具体新增哪些 Java 类或 Go package
        - 具体模块如何拆分
        - 依赖如何注入、函数如何组织等实现方案
    fields:
      - !schema
        names:
          - "4.1 涉及系统边界"
        asserts:
          - |-
            列出本次能力可能涉及的系统、平台、上下游边界。

            示例：
            - 可能涉及批处理运行链路、离线输入和 CRAA 内容处理接口。
            - 不涉及 CRAA 在线服务部署拓扑调整。
      - !schema
        names:
          - "4.2 对外使用方式影响"
        asserts:
          - |-
            说明是否影响调用方或使用方看得见的使用方式，例如 HTTP API、SDK、输入格式、错误码、配置参数、运行参数或输出格式。
            如果明确不影响，应直接写清楚。
            如果只是内部实现方式变化，不应写成对外使用方式影响。

            示例：
            - 需要定义批处理作业参数和标准离线输入格式。
            - 不修改现有 CRAA 服务端 HTTP API 语义。
      - !schema
        names:
          - "4.3 运行与发布影响"
        asserts:
          - |-
            说明是否新增运行平台、发布产物、部署方式、调度方式或运行依赖。

            示例：
            - 需要新增可发布的批处理运行产物。
            - 需要在任务平台中配置作业入口和运行参数。
      - !schema
        names:
          - "4.4 数据与兼容性影响"
        asserts:
          - |-
            说明是否可能影响数据格式、幂等标识、存储语义、重跑语义、兼容性或迁移。
            如果影响会改变 requirements.md 中的验收口径或需求边界，应退回 requirements/proposal 审议，而不是只在这里补一句说明。

            示例：
            - 标准离线输入格式和业务标识稳定性会影响失败重跑和幂等写入。
            - 第一版不迁移既有 CRAA 数据。
      - !schema
        names:
          - "4.5 待技术方案确认的问题"
        asserts:
          - |-
            列出 proposal 阶段尚不能确定、需要在 design.md 技术方案中继续分析的问题。
            这里只记录技术方案问题，不记录需求问题。目标用户、业务范围、优先级、验收口径或原型冲突不清楚时，应退回 requirements；capability 或变更范围无法判断时，应保持 proposal 为“待确认”。

            示例：
            - 离线输入读取使用平台原生能力还是封装适配层，需要在 design.md 技术方案中结合运行环境兼容性确认。
            - 失败记录输出到日志、旁路文件还是外部存储，需要在 design.md 技术方案中结合运维方式确认。
  - !schema
    names:
      - "5. 风险与约束摘要"
    asserts:
      - |-
        只写高层风险和约束，不展开详细解决方案。
        详细设计、技术取舍和缓解措施放到 design.md。

        推荐写法：
        - 外部内容处理调用耗时长，可能影响批处理吞吐和下游限流。
        - 任务失败重跑可能重复提交记录，需要稳定业务标识支撑幂等。
        - 新增运行作业或发布产物可能影响现有发布窗口、回滚路径和运维排障成本。
