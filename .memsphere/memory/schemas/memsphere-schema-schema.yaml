!schema
syntax: memsphere-20260719-stable
names:
  - Schema Schema
  - memsphere-schema-schema
format: yaml
defines:
  - 定义 memsphere !schema Memory 的合法内容结构、值契约和组合约束。
asserts:
  - 根节点必须使用 !schema 标签，只允许 syntax、name/names、defines、asserts、optional、type、format、fields、item 和 items 字段。
  - "syntax 必须填写 memsphere-20260719-stable。"
  - 顶层 Schema 必须使用非空 name 或 names；fields 中的详细 Schema 字段也必须具有名称，defines 与 item/items 中的匿名 Schema 可以省略名称。
  - name 与 names 互斥；names 必须是非空且成员不重复的字符串数组，首项为规范名称。
  - defines 可以包含非空字符串、!ref、匿名 !statement 或匿名 !schema；嵌套结构必须携带 YAML tag，全部成员共同生效。
  - optional 只能在 fields 中的具名 !schema 字段上取 true；省略或 false 表示字段必填。
  - type 不继承父层；显式声明优先，省略时有 fields 推断为 object、无 fields 推断为 string。
  - format 省略时继承父 Schema 或所属 Artifact 的兼容格式；object markdown 使用 outline，array markdown 使用 table。
  - fields 只用于 object Schema，成员可以是字符串简写、指向 Schema 的 !ref、具名 !schema 或合法 !repeat。
  - item 与 items 互斥，任一出现时必须显式声明 type 为 array；item 是唯一元素契约，items 是至少两个候选组成的联合元素契约。
fields:
  - !schema
    name: syntax
    type: string
    defines:
      - 当前顶层 Schema 使用的不可变语法版本。
  - !schema
    name: name
    optional: true
    type: string
    defines:
      - Schema 只有一个名称时使用的简写。
  - !schema
    name: names
    optional: true
    type: array
    item: !schema
      type: string
    defines:
      - Schema 的规范名称与别名，首项为规范名称。
  - !schema
    name: defines
    optional: true
    type: array
    items:
      - !schema
        type: string
      - !schema
        type: object
    defines:
      - 对结构语义的文本说明、外部 Memory 引用，以及用于补充规则或结构的匿名 Statement、Schema。
  - !schema
    name: asserts
    optional: true
    type: array
    item: !schema
      type: string
    defines:
      - 内容、书写或校验要求。
  - !schema
    name: optional
    optional: true
    type: boolean
    defines:
      - 当前具名字段是否可以缺失。
  - !schema
    name: type
    optional: true
    type: string
    defines:
      - 本层 Schema 的值类型。
  - !schema
    name: format
    optional: true
    defines:
      - 本层 Schema 的编码格式与格式参数。
  - !schema
    name: fields
    optional: true
    type: array
    items:
      - !schema
        type: string
      - !schema
        type: object
    defines:
      - 由简写字段名、!ref、嵌套 !schema 或 !repeat 组成的子结构。
  - !schema
    name: item
    optional: true
    type: object
    defines:
      - array 的唯一元素 Schema 契约，可以是匿名 !schema 或指向 Schema 的 !ref。
  - !schema
    name: items
    optional: true
    type: array
    item: !schema
      type: object
    defines:
      - 至少两个候选 Schema 组成的联合元素契约；每个候选可以是匿名 !schema 或指向 Schema 的 !ref。
