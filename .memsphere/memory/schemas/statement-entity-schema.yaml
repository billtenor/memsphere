!schema
syntax: memsphere-20260719-stable
names:
  - Statement entity schema
  - "!statement 编写模板"
format: yaml
defines:
  - 定义 memsphere !statement Memory 的合法内容结构和字段要求。
asserts:
  - 根节点必须使用 !statement 标签，不得使用独立的 type 字段。
  - names 必须是非空字符串数组，首项为规范名称。
  - defines 可以包含字符串、!ref、!statement 或 !schema；嵌套结构必须携带 YAML tag。
  - asserts、suggests 和 sections 均为可选非空数组；每个 Statement 节点必须至少包含 defines、asserts、suggests 或 sections 中的一项。
  - suggests 不得削弱或替代 asserts。
  - sections 的每个成员必须携带 !statement tag 和非空 names，并递归遵循本 Schema。
fields:
  - !schema
    name: syntax
    type: string
    defines:
      - 当前 Statement 使用的不可变语法版本。
  - !schema
    name: names
    type: array
    item: !schema
      type: string
    defines:
      - 陈述主题的名称与别名，首项为规范名称。
  - !schema
    name: defines
    optional: true
    type: array
    items:
      - !schema
        type: string
      - !schema
        type: object
    defines:
      - 对陈述主题的文本说明、外部 Memory 引用，以及用于补充规则或结构的匿名 Statement、Schema；全部成员共同生效。
  - !schema
    name: asserts
    optional: true
    type: array
    item: !schema
      type: string
    defines:
      - 必须成立或需要被验证的事实、规则或约束。
  - !schema
    name: suggests
    optional: true
    type: array
    item: !schema
      type: string
    defines:
      - 执行时可以参考但不强制满足的建议。
  - !schema
    name: sections
    optional: true
    type: array
    item: !schema
      type: object
    defines:
      - 用有名称的内嵌 Statement 节点递归组织规则；同级规范名称必须唯一。
