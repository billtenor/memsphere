!statement
syntax: memsphere-20260721-stable
names:
  - memsphere-app-usage-rules
  - App 使用规则
defines:
  - 规定 App 安装、外部工具发现与使用的边界。
asserts:
  - 作者以 app.json 和清单声明的资产组成可信本地发行目录；使用者在明确的 Project 执行 app install <directory>，需要配置时传 --config <file>，安装后默认停用。
  - app show <id> 提供组成、Memory 阅读或 Procedure Run 命令及 View 入口；app check <id> 显式检查依赖和工具，app enable <id> 检查后启用。View 组合变更须按命令提示重启 View。
  - App 安装自动登记自有 CLI 描述；外部程序由使用者按作者说明安装，不自动下载、安装或托管。独立工具使用 cli register <descriptor-file> 登记。
  - cli bind <id> --binding <binding-file> 的绑定属于当前 Project；指定 --app <app-id> 时只覆盖该 App 的调用上下文，不影响其他 App。配置文件中的 args 是独立参数数组，不是 shell 字符串。
  - cli list 和 cli show 只读取登记及绑定，不执行程序。Agent 按 show 返回的 executable、args、cwd、env 和 envFrom 直接调用程序；envFrom 的值是宿主环境变量名，不是凭据内容，不能把凭据明文写入发行清单或绑定。
  - cli check 只检查声明条件，并仅执行明确的 versionProbe；无版本协议时不得猜测 --version，不运行 help 或业务命令，不把未经验证的认证和网络状态视为已通过。
  - App 停用后 Memory 保留归属且可读，新建 Run 的根 Procedure 或调用闭包涉及停用 App 时拒绝；已冻结 Run 的内容、来源和业务数据保留，独立外部 CLI 不因此被禁用。
  - Managed 安装复用 ChangeSet 校验与发布；Embedded 只应用到当前 worktree，不自动提交 Git。Mounted 来源严格只读。未完成安装的保留路径不会作为普通 Memory 暴露，重试必须使用相同发行内容。
  - App 归属来自安装登记；普通 Memory 内容编辑和规范名称变更不转移归属。必需资产不能通过普通删除或文件移动脱离 App，首版不提供升级、卸载或自动认领已有 Memory。
  - ChangeSet 的 App 归属附件参与 checkpoint 摘要；候选 Run 冻结四类 Memory 及归属，归档恢复使用已有内容清单，不能重新混入当前 App 状态。
