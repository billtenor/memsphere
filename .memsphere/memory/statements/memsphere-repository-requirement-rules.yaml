!statement
syntax: memsphere-20260721-stable
names:
  - memsphere-repository-requirement-rules
  - memsphere 代码仓库需求规范
defines:
  - 规定 memsphere 代码仓库需求文档必须明确的需求决策。
sections:
  - !statement
    names:
      - 向前兼容规范
    defines:
      - 规定需求如何明确向前兼容的决策与范围。
    asserts:
      - 每份需求文档必须设置独立且醒目的“向前兼容”章节或字段，并明确写出“结论：需要向前兼容”或“结论：不需要向前兼容”。
      - Git 仓库中名称包含 stable 的 Tag 所指向的 commit 才是稳定 checkpoint；向前兼容只考虑相关 checkpoint 到当前功能的演进，其他历史状态不形成兼容责任。
      - 结论为需要向前兼容时，需求必须说明对应的稳定 Tag checkpoint 和需要保持兼容的范围，并将其纳入验收标准。
