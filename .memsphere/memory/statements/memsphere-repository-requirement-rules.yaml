!statement
syntax: memsphere-20260721-stable
names:
  - memsphere-repository-requirement-rules
  - memsphere 代码仓库需求规范
defines:
  - 规定 memsphere 代码仓库需求文档必须明确的需求决策。
asserts:
  - 每份需求文档，无论采用 Markdown、YAML、表单或其他形式，都必须设置独立且醒目的“向前兼容”章节或字段，不得把兼容性决定隐藏在背景、实现方案或其他内容中。
  - “向前兼容”章节或字段必须明确写出“结论：需要向前兼容”或“结论：不需要向前兼容”；不得省略结论、同时选择两者或使用含糊表述。
  - 是否需要向前兼容，必须以本轮修改是否存在用户使用中断风险为判断依据，不得仅因存在历史行为就默认要求兼容。
  - 当前阶段已经存在用户工程中的持久化 Memory、配置、Run、Review、脚本和 CLI 使用方式；本轮修改可能使这些既有内容无法读取、执行或继续使用时，存在用户使用中断风险，因此需要向前兼容。
  - 当能力尚未被用户使用，或既有内容能够在变更生效前完成迁移且不会导致用户操作、数据访问或任务执行中断时，不存在用户使用中断风险，无需向前兼容。
  - 结论为需要向前兼容时，必须说明需要保持兼容的既有行为、数据、配置、CLI、API 或 Memory 语法范围，并将其纳入验收标准。
  - 结论为不需要向前兼容时，必须说明允许破坏的范围，以及既有数据、配置或 Memory 是否需要迁移、重建或废弃。
