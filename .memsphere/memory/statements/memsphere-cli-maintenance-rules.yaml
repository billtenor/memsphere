!statement
syntax: memsphere-20261027-stable
names:
  - memsphere-cli-maintenance-rules
  - CLI 维护规范
defines:
  - 规定本仓库新增或修改 Agent 可调用命令时，如何实现和验证输出。
asserts:
  - 在 src/prompts/contracts 中声明入口、身份、场景和逐层允许的字段。以 data read 为例核对真实命令注册、正文及元数据分支。新增 Continue 或 Reviewer 能力时，同时核对实际绑定的身份和冻结资源。
  - 记录每项字段的用途、来源和出现条件。业务层完成一次操作后按授权范围构造结果。正文、配置、路径、错误、动作参数各自按来源审查。写入后发生输出错误时提供该对象的只读核验入口。
  - 两种表示共用公开对象。在 src/prompts/templates/en 与 zh-CN 维护对应模板，保留空字符串、零、false、null、游标和合法动作。协议专用入口按其实际标准流、媒体类型、退出码和容量验证。
  - 对照 test/cli-output-routes.unit.test.ts 和 test/cli-output-format.system.test.ts 从真实入口测试，使用独立期望，同时验证合法数据和禁止字段。用同一绑定身份实际执行返回的动作。采集真实命令、两种语言和支持格式的原始输出及退出码，逐项审阅必要事实、可执行动作与重复信息，核验打包后的模板。
  - 输入兼容以命令、位置参数、选项、允许取值和默认业务行为为准。输出字段按场景契约维护，同步仓内调用方、Skill、适用 Memory 和测试。交付时给 Reviewer 可回查的逐场景实录。
