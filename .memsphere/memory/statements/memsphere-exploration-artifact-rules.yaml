!statement
syntax: memsphere-20261027-stable
names:
  - memsphere-exploration-artifact-rules
  - 自由探索产物上报规则
defines:
  - 规定自由探索 Run 中 Artifact 的含义、粒度与上报时机。
asserts:
  - Artifact 是围绕明确目的组织、可独立阅读或使用，且值得作为后续引用、评审、修订或交付对象保留的一份结果。阶段性版本可以上报，但必须足以表达结果、依据及适用边界，不能只有标题或占位符；未解决事项可明确列出。
  - 当可用的一版将交给用户或其他 Agent 检查，作为后续工作的明确输入、交接点或交付成果时上报。上报前应能具体说明该版本的实际用途及为何需独立保留；仅有内容、短暂结论或将来可能有用不足以上报。
  - 按结果的用途确定粒度。紧密相关且用于同一问题的内容可以合为一份；需分别引用、评审或演进的结果宜分开。一个文件不必对应一份 Artifact，一次对话也不必产生 Artifact。
  - 连续讨论、零碎发现、普通确认、执行进度、单次工具输出、措辞调整和文件小改不逐项上报。没有明确使用场景时在对话或工作文件中继续整理；不按消息数、工具次数、时间间隔或文件保存次数机械上报。
  - 不因最终定稿或审批尚未完成而丢失有明确用途的阶段性结果。用户明确要求留存或提交一份结果时遵从其要求。
  - 已提交结果仅在更新后的完整版本需要保留和使用时修订，以 revisedFrom 关联旧版；反馈或小改本身不自动产生新版本。用途不同的新结果应建立新 Artifact，并按真实关系声明依赖。
  - 外部原始材料登记为 External；由材料形成的分析或结论才是 Artifact。对已有产物的评价登记为轻量 Review。上报 Artifact 与选为最终成果是两个决定，结束前核对成果集合。
