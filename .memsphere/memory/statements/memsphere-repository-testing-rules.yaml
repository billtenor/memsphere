!statement
syntax: memsphere-20260721-stable
names:
  - memsphere-repository-testing-rules
  - memsphere 代码仓库测试规范
defines:
  - 规定 memsphere 代码仓库测试的目的、分层覆盖、实现方式和执行验收要求。
sections:
  - !statement
    names:
      - 通用原则
    defines:
      - 规定所有测试共同遵守的契约表达、范围选择和证明边界。
    sections:
      - !statement
        names:
          - 测试目的与契约
        asserts:
          - 每条测试必须能说明，在前提 P 下对被测对象执行 A，应观察到结果 Y，保护契约 X；契约可以是组件公开行为，也可以是用户或 Agent 可观察的产品行为。
          - 测试名称、前置状态和断言必须共同说明被测对象、预期结果及失败含义。
          - 一条测试只保护一个主要契约；多个断言必须共同证明该契约，无关契约须拆为独立测试。
      - !statement
        names:
          - 测试范围与层级选择
        asserts:
          - 必须选择能够充分证明变更风险的最低适用测试层级。
          - 层级必须依据被测责任和实际验证的边界判定，不得仅由文件名、测试框架、是否使用 fake/mock、准备耗时或启动进程的数量决定。
          - 业务模块边界必须沿用既有业务职责，不得为了归类测试临时扩大或缩小模块范围；将业务模块封装为单个类不使其自动成为单元测试对象。
          - 结构校验只证明其显式检查的结构条件；判断正文语义必须阅读实际内容，判断执行行为必须使用覆盖该契约的行为验证。
  - !statement
    names:
      - 测试分层
    defines:
      - 按被测责任区分单元、模块、集成、系统和端到端五层测试。
    sections:
      - !statement
        names:
          - 单元测试 unit
        defines:
          - 验证函数、类或小组件局部契约的测试。
        asserts:
          - 必须针对所属组件的合法输入、非法输入、边界、异常和局部不变量组织充分覆盖，并按等价类和实际组合风险选择场景。
          - 单元测试中，被测逻辑使用的文件系统、网络、进程、系统时钟和外部服务等外部能力必须通过 mock 或 fake 隔离，不得实际调用这些能力。
          - 调用辅助函数或使用通用库本身不改变被测范围；不得通过这些依赖间接绕过外部能力隔离要求。
      - !statement
        names:
          - 模块测试 module
        defines:
          - 验证一个业务模块及其内部协作所形成的模块级行为的测试。
        asserts:
          - 被测业务模块及其内部协作实现必须保持真实，模块外部依赖须通过明确接口和可复用 fake/mock 隔离。
          - 必须验证模块级流程、状态变化、能力传递和失败传播，不能用底层组件分别通过代替模块协作验证。
          - 模块测试中，被测逻辑使用的文件系统、网络、进程、系统时钟和外部服务等外部能力必须通过 mock 或 fake 隔离，不得把真实系统交互纳入模块验证后仍标为模块测试。
      - !statement
        names:
          - 集成测试 integration
        defines:
          - 验证独立业务模块之间真实协作，或模块与真实系统适配契约的测试。
        asserts:
          - 被测协作方和适配器必须使用真实实现；可以替代被测集成范围之外的依赖，不得以替身代替本次要证明的集成关系。
          - 必须验证集成新增的接口衔接、数据转换、能力适配及相关副作用。
          - 涉及真实文件系统、锁、Git、进程或网络的契约，必须在适用的真实环境中验证。
      - !statement
        names:
          - 系统测试 system
        defines:
          - 通过产品公开入口验证一个独立子系统完整功能的测试。
        asserts:
          - 必须通过真实组装的 CLI 命令树、公开 API、浏览器界面或后台服务入口验证子系统功能及可观察结果。
          - 创建真实 View 服务并由浏览器验证 API、DOM 或 CSS 的用例属于 View 系统测试。
          - 真实进程、网络或浏览器边界本身属于被测契约时必须实际跨越该边界；仅为调用命令不要求每次新建进程。
      - !statement
        names:
          - 端到端测试 e2e
        defines:
          - 从用户视角验证一项完整任务或旅程能否贯通的测试，按任务需要跨越子系统。
        asserts:
          - 必须以完整用户目标和最终可观察结果组织用例，覆盖任务涉及的入口、数据、权限和主要协作链路。
          - 必须声明旅程的验证范围和必要的环境替代；被替代的真实链路不得宣称已获端到端验证。
          - 不能仅因单条系统用例跨越多个组件，就将其视为完整用户旅程覆盖。
  - !statement
    names:
      - 覆盖设计与用例精简
    defines:
      - 规定各层新增覆盖的归属、回归要求和精简前提。
    sections:
      - !statement
        names:
          - 各层覆盖分工
        asserts:
          - 基础输入矩阵应由负责相应函数或组件契约的单元测试完整覆盖，高层测试重点验证自身新增的协作责任和边界。
          - 每层必须对自身责任充分覆盖；高层新增的风险需要相应场景，不得统一缩成一条成功和一条失败用例。
          - 高层必须保留各独立入口的校验接线、错误传递和代表性失败无副作用检查，不能仅凭底层校验器通过便推断入口正确使用了它。
      - !statement
        names:
          - 成功、失败与边界覆盖
        asserts:
          - 修改代码行为时，必须在适用层级补充或更新覆盖本次风险的测试；修复 bug 必须有能够复现原问题的回归用例。
          - 修改 CLI、Memory、Run、Artifact、Review、View、Reserved Store、Archive 或 Migration 行为时，相关用例必须覆盖成功路径及本次变更涉及的失败、边界路径。
          - 只要上层组合产生了新的输入含义、状态迁移或副作用风险，就必须在该层验证，不能将其当作低层已有输入矩阵的重复覆盖。
      - !statement
        names:
          - 覆盖迁移与重复用例精简
        asserts:
          - 精简前必须指明被省略场景对应的低层覆盖，以及仍由高层保护的契约；缺少替代覆盖时，先补齐或迁移用例，再缩减高层矩阵。
          - 低层已完整覆盖且未产生上层新增风险的输入矩阵，不应在模块、集成或系统层重复穷举。
          - 精简不得削弱有效契约的验证保证；不得为了取得通过而直接删除、跳过或弱化有效断言。
          - fake 与真实适配器各自必要的共享契约、并发、持久化、恢复及平台差异验证，不得因场景名称相似就视为重复删除。
  - !statement
    names:
      - 测试实现
    defines:
      - 规定用例组织、前置状态、替身、时序和资源生命周期的实现要求。
    sections:
      - !statement
        names:
          - 测试文件与用例组织
        asserts:
          - 测试文件必须使用与实际范围一致的 .unit.test.ts、.module.test.ts、.integration.test.ts、.system.test.ts 或 .e2e.test.ts 后缀。
          - 混合文件必须按用例的实际边界拆分，不能仅靠重命名完成分层。
          - helper、fixture 和共享契约应按明确职责复用，不能在公共测试支撑代码中隐藏用例的业务含义或引入无必要的通用框架。
      - !statement
        names:
          - 前置状态与 Fixture
        asserts:
          - 非被测前置状态必须通过 Store、API 或 helper 以最短路径构造，不得把无关实现步骤重新演练为测试主体。
          - fixture 必须显式隔离测试拥有的数据、配置和环境状态，不得依赖其他测试先运行或留下状态。
          - 单元和模块测试的准备代码可以读取仅作为输入的静态 fixture；此例外不得用于验证真实文件系统行为，也不得让被测逻辑实际调用外部能力。
          - 子系统测试的复杂环境和数据准备必须与集成层分开组织；准备成本本身不决定测试层级。
      - !statement
        names:
          - Fake、Mock 与共享契约
        asserts:
          - 替身只能替代被测范围之外的能力，不得替代本次要验证的业务逻辑、协作方或真实系统行为。
          - 替身中影响业务判断的身份、版本、错误、取消和并发等行为必须与真实实现的契约一致。
          - 可复用替身与真实适配器应复用必要的关键契约检查；替身通过不能代替真实实现通过。
          - 能力注入应采用有明确责任的接口，默认运行路径必须保留真实实现，不得为了测试再造完整操作系统或改变产品行为。
      - !statement
        names:
          - 异步、并发与稳定性
        asserts:
          - 所有自动化测试均必须控制其依赖的时序，不得依赖机器速度、未约束的调度顺序或其他测试的执行顺序。
          - 异步加载、轮询和重渲染必须等待明确状态并设置超时，不得仅凭固定等待时长判断结果。
          - 并发用例必须控制被测竞争的关键时序，并验证受保护的不变量或合法结果，不能靠提高重复次数碰撞出竞争。
          - 因竞态失败时必须修复竞态；确有必要的固定等待或重试必须有明确原因及时间或次数边界。
      - !statement
        names:
          - 资源隔离、取消与清理
        asserts:
          - 文件、目录、锁、进程、浏览器和连接必须有明确的所属测试及释放责任，成功、失败和中断路径都必须处理。
          - 用例取消必须及时传递给仍在运行的操作，不能让已超时的用例继续写入或推进后续动作。
          - 删除 fixture 前必须停止仍会使用它的所属进程或操作，并等待必要的退出或释放完成。
          - 清理前必须核对资源归属和身份，不得删除其他测试、开发会话或后来复用的资源。
  - !statement
    names:
      - 执行与验收
    defines:
      - 规定检查选择、平台分配、运行策略和结果验收。
    sections:
      - !statement
        names:
          - 本地验证范围
        asserts:
          - 交付前按实际变更及风险选择检查，先运行覆盖受影响契约的最小范围；不得将全量回归作为所有变更的默认步骤。
          - 仅修改 Memory 正文时，校验结构、正文语义及适用引用；涉及 Procedure 可执行流程或 Schema 契约变化时，另做对应运行或契约验证。
          - 修改代码、依赖或构建配置时，按影响执行类型检查、构建及相关测试，先运行受影响文件。
          - 局部检查不足以覆盖跨模块风险，或 Human、发布流程明确要求时，才扩大验证范围并说明原因。
          - 受影响检查通过后，只有新改动、新失败或尚未覆盖的风险才触发追加或重复检查。
      - !statement
        names:
          - CI 平台与运行矩阵
        asserts:
          - 单元、模块、集成和系统测试必须使用独立 CI 作业，不得把不同层级混在同一作业中。
          - 单元和模块测试必须在 default、full 两种模式下的 Linux、macOS、Windows 全部执行。
          - 普通集成测试在 default 只运行 Linux，在 full 运行三个系统；存在操作系统差异契约的集成测试在两种模式都运行三个系统。
          - 系统和端到端测试只在 full 运行，并覆盖三个系统；default 不运行这两层及其独立的打包、Shell 验证作业。
          - 操作系统差异风险必须来自被测契约；仅通过 Git 准备数据或使用浏览器，不构成将普通集成升级为三系统覆盖的理由。
          - OS 契约集成使用 test/platform、test/ci/platform 或文件头的明确声明标识，并按业务职责分组；目录位置不能将系统测试重新归为集成测试。
          - CI 必须自动发现适用文件，并验证每个文件在适用平台恰好分配一次；平台专属用例只在适用系统执行。
          - 某层尚未建设时必须明确说明，不得创建空套件或占位作业来声称已具备该层覆盖。
      - !statement
        names:
          - 并发、时限与失败处理
        asserts:
          - 独立测试默认按执行机器可用 CPU 数并发，不维护预计耗时表，也不按预计耗时排序。
          - default 会运行的测试作业保持五分钟时限，包括三个系统的单元、模块和 OS 契约集成，以及 Linux 的普通集成；full 运行这些相同作业时仍保持五分钟。
          - 仅 full 新增的测试作业限时三十分钟，包括 macOS、Windows 的普通集成，以及三个系统的系统、端到端和独立的平台打包测试。
          - 超时或资源竞争失败必须定位被测操作、准备、等待和清理的实际原因，再修复对应问题，不得以盲目重试或放宽已有单项时限掩盖失败。
      - !statement
        names:
          - 验证证据与通过标准
        asserts:
          - 必须记录验证对象的版本、实际命令、结果及未执行项，不得用历史结果代替当前变更验证。
          - 存在失败时必须说明失败与影响；跳过、未执行或无法完成的检查不得记为通过。
          - full 通过必须覆盖全部适用的单元、模块、集成、系统、已建设的端到端及平台打包作业，不能用快速层结果代替完整验证。
          - Human 明确要求暂缓某层的探索运行时，必须标明暂缓范围，不得发布 full 成功结论。
          - npm run validate 当前只执行构建，不能替代 Memsphere Store 或 Memory ChangeSet 校验。
  - !statement
    names:
      - 专项验证
    defines:
      - 规定特定变更对象在通用测试要求之外的额外检查。
    sections:
      - !statement
        names:
          - Memory 与 ChangeSet
        asserts:
          - 创建、编辑、移动、重命名或删除 .memsphere/memory 下的 Memory 后，必须同时执行 memsphere validate 和 memsphere memory change validate，并记录 ChangeSet ID、checkpoint digest、校验状态和 View 入口。
          - Store 校验必须确认 config、各 root、四类 Memory 解析、syntax、字段结构及 catalog 名称冲突；它不能替代变更级校验。
          - 最终校验后再次修改 Memory 内容时必须重新校验，使交付证据对应最终内容。
      - !statement
        names:
          - System / Reserved Memory
        asserts:
          - 仅修改 reserved-memory 正文时，必须检查解析、引用及发行源与当前 Project 副本的一致性；memsphere validate 不直接校验 reserved-memory 源目录。
          - 修改 System Memory 必须同步当前开发 Project 的副本，并执行 Store 和 ChangeSet 校验，发行源与安装副本不得出现非预期差异。
          - 修改 Reserved Store manifest 或安装行为时，必须运行覆盖安装清单及受影响安装、更新契约的 test/platform/filesystem/reserved-store.integration.test.ts。
      - !statement
        names:
          - 前端交互与浏览器
        asserts:
          - 调整前端交互后，必须使用 playwright-cli 对受影响交互进行实际操作验证。
          - 对可能被重渲染打断的瞬时 DOM 状态进行写入并立即观察时，必须在同一页面执行上下文中完成。
          - 要求状态跨重渲染保留时，必须等待并断言重渲染后的稳定状态。
      - !statement
        names:
          - 变更范围与适用套件
        defines:
          - 记录可长期复用的变更风险与测试范围映射，不记录单次任务临时选择的文件名单。
        asserts:
          - 修改 Memory AST、YAML 语法、解析或序列化代码时，必须运行 memory-schema、memory-syntax、memory-serializer 中覆盖改动的测试；仅编辑 Memory 正文不触发这些代码测试。
          - 修改 Schema 或 Artifact 的契约编译、格式解析或校验代码时，必须运行覆盖改动的 artifact-validation、artifact-format-fixtures 测试；涉及迁移时另运行对应 migration 测试并覆盖合法、非法输入。
          - 修改 Procedure Run、分支、循环、Call、Schema 写作或 Repeat 的执行代码时，必须运行 run-store、run-command 中覆盖改动的测试。
          - 修改 Review、View 或归档代码行为时，必须运行对应 review-store、view、archive-store 中覆盖改动的测试。
