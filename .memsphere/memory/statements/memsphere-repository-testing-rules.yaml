!statement
syntax: memsphere-20260719-stable
names:
  - memsphere-repository-testing-rules
  - memsphere 代码仓库测试规范
defines:
  - 规定 memsphere 代码与 Memory 变更交付前的最低测试和校验要求。
asserts:
  - 交付前按实际变更及其风险选择检查，先运行能覆盖受影响契约的最小范围；不得把全量回归作为所有变更的默认步骤。适用检查存在失败时，必须说明失败与影响，不得声称该检查通过。
  - 仅修改 Memory 正文时，执行 Memory 校验并检查内容语义；涉及引用或 System Memory 时还检查引用及发行源与项目副本的一致性，不要求类型检查、构建或全量回归。涉及 Procedure 可执行流程或 Schema 契约变化时，另做对应运行或契约验证。
  - 修改代码、依赖或构建配置时，根据影响执行类型检查、构建和相关测试；只有明确需要验证跨模块影响、局部检查无法覆盖风险，或用户及发布流程明确要求时，才扩大到全量回归，并说明原因。
  - 本轮存在 Memory 交付差异时，还必须对最终内容执行 memsphere memory change validate [change-id]，并记录 ChangeSet ID、校验状态和 View 入口；普通 memsphere validate 不能满足该门禁。
  - 必须记录实际执行的测试命令、结果和未执行项，不得用历史结果代替当前变更验证。
  - npm run validate 当前只执行构建，不得替代 memsphere validate。
sections:
  - !statement
    names:
      - CI 测试层级与平台覆盖
    defines:
      - 按被测范围区分单元、模块、集成、系统与端到端测试，并按操作系统差异风险分配 CI 覆盖。
    asserts:
      - 单元用例使用 .unit.test.ts 明确入口，在 Linux、macOS、Windows 上全部执行；不同层级用例不得混在同一个 CI 作业中。混合文件须先按实际边界拆分，不能只靠命名将真实服务、浏览器或进程行为归为单元测试。
      - 模块用例使用 .module.test.ts 明确入口，在三个操作系统全部执行；保留真实业务模块及协作，通过可复用 fake/mock 隔离系统能力，不因使用 fake 就归类为单元测试。
      - 完整分层包含单元 unit、模块 module、集成 integration、系统 system 和端到端 e2e 五层；端到端从用户目标验证完整任务及跨子系统旅程，不能仅因系统用例跨多个组件就声称已建立完整端到端覆盖。当前仅建设前四层，第五层尚无独立套件，不为其创建空测试或占位 CI 作业。
      - 集成测试使用 .integration.test.ts 验证多模块协作与真实系统适配，系统测试使用 .system.test.ts 从命令树、公开 API、浏览器界面或完整后台服务入口验证子系统功能；混合文件按用例拆分，不能只按名称或准备耗时分类。
      - 普通集成测试在非 full CI 只运行 Linux，在 full CI 运行三个操作系统；存在原生进程、文件系统、权限、路径或 Git/worktree 差异契约的集成测试在两种 profile 都运行三个系统。平台专有分支只在适用系统执行，不把跳过解释为该系统上的验证通过。
      - 系统差异风险须来自被测产品契约，不能仅因测试通过 Git 准备数据或使用浏览器就要求三系统重复运行；test/platform、test/ci/platform 或文件头的明确平台声明标识这类集成契约，按业务职责分组；目录不能把 .system.test.ts 重新归为集成。
      - 不维护预计耗时表或按预计耗时排序，单元、模块、集成作业保留五分钟，不以延长这些时限取得通过；系统层作业按 Human 确认的独立运行策略设置，不与集成层限时混用，测时探索可以明确不设置自定义作业时限；独立测试默认按执行机器可用 CPU 数并发。full 汇总须同时覆盖全部适用单元、模块、集成、系统和平台打包作业，不能用快速层结果代替集成验证；经 Human 明确要求暂缓某层的探索运行须明确标记，不能发布 full 成功证据。
  - !statement
    names:
      - 测试意图与职责边界
    defines:
      - 规定测试的存在理由、独立保护契约和职责边界。
    asserts:
      - 每条测试必须能用以下范式说明其存在理由：在前提 P 下，用户执行 A 后，应观察到结果 Y；如果测试失败，说明产品契约 X 被破坏。
      - 每条测试必须独立保护一个明确的用户可观察契约，并能通过测试名称和断言识别被破坏的产品含义；无法明确产品契约 X 或可观察结果 Y 的测试不得保持当前形态。
      - 一条测试只能有一个主要失败含义；多个断言必须共同证明同一契约，无关契约必须拆分为独立测试。
      - 非被测前置状态必须优先通过 Store、API 或 helper 以最短路径构造；测试必须验证用户可观察结果，不得把非被测的实现步骤重新演练为测试主体。
  - !statement
    names:
      - 验证方法与证明范围
    defines:
      - 用于本仓库测试与校验的编写和审查，区分结构校验、内容语义判断与执行行为验证各自的证明范围。
    asserts:
      - 结构校验只能证明其显式检查的结构条件，不证明正文规则成立、产物语义正确或执行效果符合预期。
      - 判断内容的语义是否成立，必须阅读实际内容，并依据适用对象、事实和规则核对。
      - 判断执行行为是否符合预期，必须使用覆盖相关行为契约的自动化测试或实际运行验证。
  - !statement
    names:
      - 测试分层
    asserts:
      - 测试层级必须按实际跨越的运行边界判断，不得根据文件名、测试框架或是否使用 mock 笼统命名。
      - 单元测试验证小函数、单个类或小范围行为，可以使用 fake/mock；模块测试验证业务模块及其协作，通过 fake/mock 隔离存储、时钟、进程和外部能力，允许读取静态 fixture；集成测试验证多模块协作及真实文件系统、锁、Git、进程或网络适配契约；系统测试通过 CLI 命令树、公开 API、浏览器或完整后台服务入口验证独立子系统功能，其复杂环境与数据准备须与集成层分开。
      - 创建真实 View HTTP 服务并由浏览器通过 API、DOM 和 CSS 验证行为的测试属于浏览器驱动的 View 系统测试，不得归类为单元测试。
      - 应选择能够验证变更风险的最低测试层级；真实边界上的行为必须由适用的集成测试覆盖，不得只用单元测试替代。
      - 单元层对所属函数或组件尽可能完整覆盖有效输入、非法输入及边界组合；模块层额外验证业务模块间的协作、能力传递和失败传播，集成层额外验证真实适配器、持久化、进程及系统行为，不在高层重复低层已有的完整输入矩阵。
      - 精简前须逐项确认低层覆盖同一被测契约；缺失时先补齐或下沉用例，再缩减高层矩阵。高层仍须保留各独立入口的接线验证、代表性失败及无副作用断言；fake 实现通过不能代替真实实现的契约、并发、恢复与平台差异验证。
  - !statement
    names:
      - 代码行为与回归测试
    asserts:
      - 修改代码行为时必须在适用层级补充或更新能够覆盖变更风险的自动化测试，并先运行受影响测试文件；修复 bug 必须增加或更新能够复现原问题的回归测试。
      - 受影响测试通过后，只有新改动、失败或尚未覆盖的风险才触发追加或重复测试；不得为了使测试通过而删除、跳过或弱化仍然有效的产品契约断言。
      - 修改 CLI、Memory、Run、Artifact、Review、View、Reserved Store、Archive 或 Migration 的代码行为时，相关测试必须覆盖成功路径以及本次变更涉及的失败或边界路径。
  - !statement
    names:
      - 自动化测试稳定性
    defines:
      - memsphere 的单元、模块和集成测试只要由测试代码实现并在 CI 中自动运行，就共同受本节约束；本仓库曾反复出现测试因未受控时序或页面重渲染竞态而在 CI 失败的问题，本节用于防止此类不稳定测试再次进入 CI。
    asserts:
      - 自动化测试不得依赖机器执行速度、任务调度顺序或其他未受控时序；同一份代码在相同 CI 环境中重复运行时，结果必须保持一致。
      - 测试异步加载、轮询或页面重渲染时，必须等待被测状态出现并设置超时，不得仅通过等待固定时长判断测试结果。
      - 测试失败源于竞态时，必须修复竞态；确实需要固定等待或重试时，必须限制等待时间或重试次数，并说明原因。
  - !statement
    names:
      - 前端交互测试
    asserts:
      - 凡是进行了前端交互调整，交付前必须使用 playwright-cli 对受影响的交互进行实际操作测试，并确认交互行为正确。
      - 使用真实浏览器驱动 View 的自动化测试属于系统测试；异步加载、轮询和重渲染场景必须遵循自动化测试稳定性要求。
      - 对可能被重渲染打断的瞬时 DOM 状态进行写入并立即观察时，应在同一页面执行上下文中完成；如果被测契约要求状态跨重渲染保持，则必须等待并断言重渲染后的稳定状态。
  - !statement
    names:
      - Memory Store 校验
    asserts:
      - 新建、修改、移动、重命名或删除 .memsphere/memory 中的任意 Concept、Statement、Procedure 或 Schema 后，必须同时运行 memsphere validate 和 memsphere memory change validate [change-id]；前者检查当前 Store 健康，后者捕获并验证交付差异，两者不得互相替代。
      - memsphere validate 必须确认 config 与各 root 可用、四类当前 Memory 均可解析、syntax 与字段结构合法，并检查规范名称和别名等 catalog 冲突。
      - memsphere validate 不直接校验 reserved-memory 源目录。
  - !statement
    names:
      - System 与 Reserved Memory
    asserts:
      - 仅修改 reserved-memory 的正文时，检查解析、引用及发行源与项目副本的一致性；修改 manifest 或安装行为时，运行 test/platform/filesystem/reserved-store.integration.test.ts，验证安装清单与受影响的安装、更新契约。
      - 修改 System Memory 后必须同步当前开发 Project 的 Memory 副本，再运行 memsphere validate 和 memsphere memory change validate [change-id]；源文件与安装副本不得出现非预期差异，ChangeSet 证据必须匹配最终内容。
  - !statement
    names:
      - 变更范围与必跑测试
    defines:
      - 本节只记录 memsphere 仓库中可长期复用的变更范围与现有必跑测试套件映射，不收录单次变更临时选择的测试。
    asserts:
      - 修改 Memory YAML 语法、实体模型或解析、序列化代码时，运行 memory-schema、memory-syntax 和 memory-serializer 中覆盖改动的测试；仅编辑 YAML 正文不触发这些代码测试。
      - 修改 Schema 或 Artifact 的运行时契约、格式解析和 validator 代码时，运行覆盖改动的 artifact-validation、artifact-format-fixtures 测试；涉及迁移时再运行相关 migration 测试，并覆盖合法与非法 Artifact。
      - 修改 Procedure Run、分支、循环、Call、Schema 填写或 Repeat 的执行代码时，运行 run-store 和 run-command 中覆盖改动的测试。
      - 修改 Review、View 或归档的代码行为时，运行对应 review-store、view 或 archive-store 中覆盖改动的测试。
