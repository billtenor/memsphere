!statement
syntax: memsphere-20260719-stable
names:
  - memsphere 代码仓库开发规范
  - memsphere-repository-development-rules
defines:
  - 规定 memsphere 代码仓库的开发要求，并按主题组织可扩展的规范章节。
sections:
  - !statement
    names:
      - System Memory 同步
    defines:
      - 约束代码变更与 System Memory、skill 冗余说明保持一致。
    asserts:
      - 代码变更影响用户或 agent 可见的概念、命令、YAML、流程或行为时，必须在同一需求中检查并更新对应 System Memory；纯内部重构且语义不变时可以不更新。
      - System Memory 必须修改 reserved-memory 中的源文件，并通过 memsphere init 刷新当前工程的安装副本；新增、重命名或删除 System Memory 时必须同步更新 reserved-memory/manifest.json。
      - System Memory 更新后必须同步检查 src/skills/memsphere/SKILL.md 中的冗余说明，并通过 memsphere validate 与相关测试。
      - 新增的用户可见能力没有对应 System Memory 时，必须补建合适的 System Memory，不得只修改代码、README 或 skill。
    sections:
      - !statement
        names:
          - Memory DSL 与实体模型
        asserts:
          - 修改 src/memory 中的 AST、schema、syntax、YAML、serializer、factory，或修改 artifact-validation 与 migration 契约时，必须更新 memsphere-yaml-syntax-rules。
          - 修改 Concept、Statement、Procedure 或 Schema 的字段、语义和组合规则时，必须同步更新对应的 Concept Memory 与 entity schema；影响通用 Memory 语义时还必须更新“Memory”。
          - 修改 Procedure、Artifact、Schema、分支、循环、Call 或 Repeat 的编写规则时，必须检查 memsphere-procedure-construction 是否仍与新规则一致。
      - !statement
        names:
          - Memory 发现与读取
        asserts:
          - 修改 memory list、memory read、Node 导航、reference 解析、catalog、provider 或 store 的用户可见行为时，必须更新 memsphere-memory-access-rules。
          - 修改 scope 查找、Memory Store 抽象或 Agent 读取方式时，必须同步检查 memsphere-memory、memsphere-framework 和 skill 的读取说明。
      - !statement
        names:
          - Procedure Run 与 Artifact
        asserts:
          - 修改 run start、report、status、Schema 填写、Repeat、Artifact 校验或人机步骤行为时，必须更新 memsphere-procedure、memsphere-procedure-schema、memsphere-schema-schema、memsphere-yaml-syntax-rules 和 skill 的 Run 说明。
          - 修改通用任务执行方式或 Procedure 编写与验收要求时，必须分别检查 memsphere-general-task-execution 和 memsphere-procedure-construction。
      - !statement
        names:
          - Review
        asserts:
          - 修改 review 数据模型、状态流转、snapshot、comment 定位、task review 上下文或 View 中的 Review 操作时，必须更新 memsphere-review。
      - !statement
        names:
          - 初始化与预置安装
        asserts:
          - 修改 init、config、scope 查找、Reserved Memory 安装导入或 System Memory 覆盖删除行为时，必须更新 memsphere-framework 和 skill 的初始化说明。
          - 修改 System Memory 清单或安装路径时，必须更新 manifest、Reserved Store 测试和当前工程安装副本；旧路径需要清理时必须加入 system_memory.remove。
